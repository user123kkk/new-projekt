<script>
const DATA = {"nodes": [{"id": "01-reduce-the-pain-of-paying", "kind": "station", "title": "01 – Reduce the pain of paying: simple checkout, guarantees, free trials", "path": "stationen/01-reduce-the-pain-of-paying.md", "text": "---\nid: 01\nsource: quellen/videos/01 (v24044gl0000d21r6pnog65tk681ln4g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 31.22\nduration_video_s: 36.13\nconcepts: [free-trial, guarantee, loss-aversion, pain-of-paying, simple-checkout]\n---\n# 01 – Reduce the pain of paying: simple checkout, guarantees, free trials\n## Verbatim\n```text\n[00:00.00 - 00:02.98] This is why you lose your customers in the last second.\n[00:04.06 - 00:07.62] Every time someone commits to buy, the brain feels a little pain.\n[00:08.56 - 00:13.36] The pain of paying actually lights up the same brain regions as physical pain.\n[00:14.22 - 00:17.22] So if you want to sell more, don't just focus on value.\n[00:18.24 - 00:20.62] Instead, reduce the pain.\n[00:21.50 - 00:25.52] Use a simple checkout, use guarantees, or free trials.\n[00:26.28 - 00:30.04] Because the easier it feels to buy, the less it feels like a loss.\n[00:30.82 - 00:31.22] And.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with the fragment 'And.' (30.82-31.22 s); on-screen at 30 s: \"And\". No continuation.\n\n## Visuals\n- Abstract outline icons only (diamonds, rings, dots). Frame 10 (27 s): large circle containing a check mark, no caption at that time.\n- Caption fragments at the 3-second samples: \"you lose your customers\", \"Every time\", \"feels a little pain\", \"actually lights up\", \"as physical pain\", \"don't just focus\", \"Reduce the pain\", \"Use a simple checkout\", \"or free Trials\", \"And\".\n\n## Statements\n1. \"This is why you lose your customers in the last second.\"\n2. \"Every time someone commits to buy, the brain feels a little pain.\"\n3. \"The pain of paying actually lights up the same brain regions as physical pain.\"\n4. \"So if you want to sell more, don't just focus on value.\"\n5. \"Instead, reduce the pain.\"\n6. \"Use a simple checkout\"\n7. \"use guarantees\"\n8. \"or free trials\"\n9. \"Because the easier it feels to buy, the less it feels like a loss.\"\n\n## Assessment\n1. **usable** – Claim, unverified: no data that customers are lost \"in the last second\".\n2. **usable** – Claim, unverified: no source.\n3. **usable** – Claim, unverified: no study, author or year named.\n4. **usable** – Neutral instruction; no checkpoint touched.\n5. **conditional** – Allowed only if the pain is reduced by real ease, not by hiding price, total cost or terms (gharar). Required change: full price and terms stay visible before commitment.\n6. **usable** – Fewer steps; no checkpoint touched provided final price and terms are shown.\n7. **conditional** – Core usable. Required change: the guarantee must be real, its conditions stated in plain words, and honored (ghish, gharar).\n8. **conditional** – Core usable. Required change: state duration, what happens at the end, whether payment data is taken, and whether it renews into a paid subscription (gharar). No automatic charge the customer has not clearly agreed to.\n9. **conditional** – Claim, unverified. Usable only if the ease comes from clarity, not from concealment (see statement 5).\n\n## Links\n- [[21-people-want-to-stop-losing]] – same family of mechanism: loss is felt more strongly than gain; the 'loss' in 'feels like a loss'\n- [[05-study-what-works-particl]] – extends: the 14-day free trial offer is an instance of the 'free trials' tactic named here\n- [[27-the-more-people-think-the-less-they-trust]] – prerequisite of: guarantees reduce the perceived risk that 27 says stops purchases\n- [[11-you-sell-emotions-not-the-product]] – related: 11 requires perceived value to exceed perceived costs; 01 lowers the felt cost\n- [[32-conversion-problem-or-traffic-problem]] – related: checkout friction is a conversion problem in the sense of 32\n- [[free-trial]]\n- [[guarantee]]\n- [[loss-aversion]]\n- [[pain-of-paying]]\n- [[simple-checkout]]\n"}, {"id": "02-sell-the-after-not-the-what", "kind": "station", "title": "02 – Sell the after, not the what", "path": "stationen/02-sell-the-after-not-the-what.md", "text": "---\nid: 02\nsource: quellen/videos/02 (v24044gl0000d2c99efog65g60utcsp0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 35.42\nduration_video_s: 39.54\nconcepts: [customer-as-hero, desired-outcome, emotion-selling]\n---\n# 02 – Sell the after, not the what\n## Verbatim\n```text\n[00:00.00 - 00:04.40] This is why you don't understand marketing. People don't want your product.\n[00:05.16 - 00:09.08] They want the better version of themselves. They imagine after buying it.\n[00:09.84 - 00:14.58] They don't buy the gym membership. They buy who they'll become after going there.\n[00:15.42 - 00:19.40] They don't buy the lipstick. They buy the confidence boost and compliments they will\n[00:19.40 - 00:26.02] be getting. Stop listing the benefits and instead start painting their future.\n[00:26.02 - 00:31.64] The most powerful marketing isn't about your brand. It's about your customers desired\n[00:31.64 - 00:35.42] transformation. Sell the after not the what and\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends on 'Sell the after not the what and' (sentence cut off, 35.42 s); on-screen at 33 s: \"not the what\".\n\n## Visuals\n- Frame 12 (33 s): cluster of outline dollar-sign coins while \"not the what\" is shown. Frame 11 (30 s): two person icons above an open box, caption \"desired transformation\". Frame 6 (15 s): outline lipstick tube. Frame 5 (12 s): head-profile outline with a small circle and dot inside, caption \"who they'll become\". Frame 4 (9 s): caption \"They don't buy\".\n\n## Statements\n1. \"This is why you don't understand marketing.\"\n2. \"People don't want your product.\"\n3. \"They want the better version of themselves.\"\n4. \"They imagine after buying it.\"\n5. \"They don't buy the gym membership. They buy who they'll become after going there.\"\n6. \"They don't buy the lipstick. They buy the confidence boost and compliments they will be getting.\"\n7. \"Stop listing the benefits and instead start painting their future.\"\n8. \"The most powerful marketing isn't about your brand. It's about your customers desired transformation.\"\n9. \"Sell the after not the what\"\n\n## Assessment\n1. **usable** – Framing only.\n2. **usable** – Generalisation; claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified.\n5. **conditional** – Usable if the offer actually supports the stated future. Required change: no promise of a result the product does not deliver (ghish).\n6. **conditional** – Usable if confidence is described as an experience, not guaranteed. Required change: no promise of compliments or social outcomes as certain. Product category is not itself a checkpoint hit.\n7. **conditional** – Required change: the future shown must be realistic and attainable with the product (ghish, gharar).\n8. **conditional** – Claim, unverified. Same condition as statement 7.\n9. **conditional** – Same condition as statement 7: the 'after' must be real.\n\n## Links\n- [[33-people-buy-the-product-they-like-best]] – same mechanism: 33 gives the drill/painting example of selling the outcome\n- [[29-sell-the-instant-benefit]] – contrast: 29 says sell the instant benefit, 02 sells the long-term future self\n- [[11-you-sell-emotions-not-the-product]] – same mechanism: selling the emotion of the desired outcome\n- [[23-the-customer-is-the-hero-of-the-story]] – extends: 23 puts the customer's story, not the brand's, at the centre\n- [[37-sell-the-problem-first]] – related: 37 starts from the problem, 02 from the future state\n- [[customer-as-hero]]\n- [[desired-outcome]]\n- [[emotion-selling]]\n"}, {"id": "03-your-brand-is-the-feeling-not-the-logo", "kind": "station", "title": "03 – Your brand is what people think and feel about you, not your logo", "path": "stationen/03-your-brand-is-the-feeling-not-the-logo.md", "text": "---\nid: 03\nsource: quellen/videos/03 (v24044gl0000d34r5vvog65thfjhvh90.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.24\nduration_video_s: 34.13\nconcepts: [brand-consistency, brand-perception, memorability]\n---\n# 03 – Your brand is what people think and feel about you, not your logo\n## Verbatim\n```text\n[00:00.00 - 00:07.68] your brand is not your logo it's not your colors and it's not even your product your brand is about\n[00:07.68 - 00:14.96] what people think and feel about you it's the gut feeling they get when they see you so it's\n[00:14.96 - 00:21.12] never the logo it's the emotion evoked and associated with that logo and you cannot buy\n[00:21.12 - 00:27.52] that with ads you build your brand with every action every touch point and every emotion you\n[00:27.52 - 00:30.24] trigger and this is why\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends mid-sentence on 'and this is why' (30.24 s); no on-screen text for the ending.\n\n## Visuals\n- Abstract outline shapes only; no named brand or number on screen.\n\n## Statements\n1. \"your brand is not your logo it's not your colors and it's not even your product\"\n2. \"your brand is about what people think and feel about you\"\n3. \"it's the gut feeling they get when they see you\"\n4. \"so it's never the logo it's the emotion evoked and associated with that logo\"\n5. \"you cannot buy that with ads\"\n6. \"you build your brand with every action every touch point and every emotion you trigger\"\n\n## Assessment\n1. **usable** – No checkpoint touched.\n2. **usable** – No checkpoint touched.\n3. **usable** – No checkpoint touched.\n4. **usable** – No checkpoint touched.\n5. **usable** – Claim, unverified; consistent with the stated mechanism.\n6. **conditional** – Usable. Required change: emotions triggered must not be produced by false claims (ghish).\n\n## Links\n- [[20-branding-is-the-1p-model-perception]] – same claim: perception is what the brand is\n- [[09-branding-is-for-any-company]] – same claim: 'branding isn't just a logo'\n- [[18-halo-effect]] – extends: 18 explains how impressions generalise (halo effect)\n- [[31-best-product-with-bad-branding-loses]] – same claim: 'the feeling that your overall presence creates'\n- [[07-marketing-and-branding-are-yin-and-yang]] – related: 07 defines branding as 'what people think when you stop saying it'\n- [[brand-consistency]]\n- [[brand-perception]]\n- [[memorability]]\n"}, {"id": "04-there-is-no-winning-product", "kind": "station", "title": "04 – There is no winning product, marketing and branding make or break a business", "path": "stationen/04-there-is-no-winning-product.md", "text": "---\nid: 04\nsource: quellen/videos/04 (v24044gl0000d36k7ifog65i8h305tkg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 37.32\nduration_video_s: 40.47\nconcepts: [named-brands, product-vs-branding, storytelling]\n---\n# 04 – There is no winning product, marketing and branding make or break a business\n## Verbatim\n```text\n[00:00.00 - 00:05.88] There is no winning product and there never has been. The idea of finding the\n[00:05.88 - 00:10.72] one winning product is an illusion sold by coaches. The truth is your marketing\n[00:10.72 - 00:15.76] and branding will always make or break your business. Boring products with great\n[00:15.76 - 00:21.60] marketing will win over fancy products with bad marketing. Dollar Shave Club\n[00:21.60 - 00:28.40] sells razors. Liquid Death sells water. Both built billion-dollar brands by\n[00:28.40 - 00:33.32] selling boring products. So it's never the product it's the branding and the\n[00:33.32 - 00:37.32] story you tell about it and this is why\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends mid-sentence on 'and this is why' (37.32 s).\n\n## Visuals\n- Frame 8 (21 s): razor illustration with partial white lettering on the razor head, not readable [unclear] (single frame f_008 checked). Frame 9 (24 s): blob-like outline for water, caption \"sells water\".\n\n## Statements\n1. \"There is no winning product and there never has been.\"\n2. \"The idea of finding the one winning product is an illusion sold by coaches.\"\n3. \"The truth is your marketing and branding will always make or break your business.\"\n4. \"Boring products with great marketing will win over fancy products with bad marketing.\"\n5. \"Dollar Shave Club sells razors.\"\n6. \"Liquid Death sells water.\"\n7. \"Both built billion-dollar brands by selling boring products.\"\n8. \"So it's never the product it's the branding and the story you tell about it\"\n\n## Assessment\n1. **usable** – Claim, unverified; absolute.\n2. **usable** – Claim, unverified. Motive attributed to a group (coaches); not provable from the source.\n3. **usable** – Claim, unverified; 'always' is absolute.\n4. **usable** – Claim, unverified.\n5. **usable** – Named brand, no data.\n6. **usable** – Named brand, no data.\n7. **usable** – Claim, unverified: no valuation or source given.\n8. **conditional** – Claim, unverified; 'never' is absolute. Required change: the story must be true (ghish).\n\n## Links\n- [[31-best-product-with-bad-branding-loses]] – same mechanism: better product with bad branding loses\n- [[33-people-buy-the-product-they-like-best]] – related: people buy the product they like best\n- [[28-same-wine-different-price-experience]] – example of: same product, different perceived quality by presentation\n- [[07-marketing-and-branding-are-yin-and-yang]] – related: marketing and branding both required\n- [[23-the-customer-is-the-hero-of-the-story]] – extends: the story told should be the customer's\n- [[named-brands]]\n- [[product-vs-branding]]\n- [[storytelling]]\n"}, {"id": "05-study-what-works-particl", "kind": "station", "title": "05 – Study what works instead of guessing: Particl Marketing Assets", "path": "stationen/05-study-what-works-particl.md", "text": "---\nid: 05\nsource: quellen/videos/05 (v24044gl0000d3a5gkfog65v1d5533g0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 46.76\nduration_video_s: 49.67\nconcepts: [call-to-action-dm-comment, competitor-research, free-trial, named-brands]\n---\n# 05 – Study what works instead of guessing: Particl Marketing Assets\n## Verbatim\n```text\n[00:00.00 - 00:06.12] The smartest brands don't guess their marketing. They study what works. That's why companies like\n[00:06.12 - 00:13.16] Skims, Gymshark, and Lululemon spend millions testing campaigns until they know exactly what\n[00:13.16 - 00:20.98] works. Now imagine if you could see all of that. Every ad, every email, every post, even the website\n[00:20.98 - 00:27.14] changes they make, all in one place. With Particle, you can. Their newly launched tool called\n[00:27.14 - 00:32.60] Marketing Assets lets you study how the biggest brands do their marketing, so you can apply\n[00:32.60 - 00:37.76] it directly to your business. So if you want a smarter way to market, you should not miss\n[00:37.76 - 00:44.76] this. DM me Particle for a 14-day free trial, because your business deserves to learn from\n[00:44.76 - 00:46.76] the best.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Particle' / On-screen: \"particl\" and \"PARTICL\" (frames 9 and 14); the brand is spelled Particl on screen.\n- Transcript: 'DM me Particle for a 14-day free trial' / On-screen: \"DM PARTICL for a 14 day\" and \"DM me \"PARTICL\"\" (two overlapping captions at 39 s).\n- Transcript: 'because your business deserves to learn from the best.' / On-screen at 42 s: \"because your business\" and \"THE BEST\".\n\n## Visuals\n- Frame 1 (0 s): boxed logos reading SKIMS, lululemon, GYMSHARK. Frames 3-4: connector diagram of SKIMS and GYMSHARK boxes leading to a box with stacked coins. Frame 9 (24 s): 'Particl' wordmark with a white square logo mark. Frames 10-12: laptop showing a product grid, browser-style window with photo thumbnails and sidebar, circuit-like network around a browser window with blue buttons. Frame 15 (42 s): pendant lamp above the words THE BEST.\n- The video promotes a third-party tool (Particl). Neither audio nor captions state whether the creator is paid or affiliated.\n\n## Statements\n1. \"The smartest brands don't guess their marketing.\"\n2. \"They study what works.\"\n3. \"That's why companies like Skims, Gymshark, and Lululemon spend millions testing campaigns until they know exactly what works.\"\n4. \"Now imagine if you could see all of that. Every ad, every email, every post, even the website changes they make, all in one place.\"\n5. \"With Particle, you can.\"\n6. \"Their newly launched tool called Marketing Assets lets you study how the biggest brands do their marketing, so you can apply it directly to your business.\"\n7. \"So if you want a smarter way to market, you should not miss this.\"\n8. \"DM me Particle for a 14-day free trial\"\n9. \"because your business deserves to learn from the best.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim, unverified: 'millions' not sourced. Named brands: Skims, Gymshark, Lululemon.\n4. **conditional** – Observing competitors' public marketing is usable. Required change: only publicly available material; no access behind logins or against terms.\n5. **conditional** – Product recommendation; claim, unverified. Required change: disclose any paid or affiliate relationship (ghish).\n6. **conditional** – Tool claim, unverified; same disclosure condition.\n7. **conditional** – 'Should not miss this' is urgency without a stated deadline. Required change: no implied scarcity; state a real reason or remove (fabricated urgency).\n8. **conditional** – Free trial: terms must be stated (duration, end, billing, cancellation) (gharar). Existence of the trial as described is unverified.\n9. **usable** – Flattering close; no checkpoint touched.\n\n## Links\n- [[01-reduce-the-pain-of-paying]] – same tactic: free trial named as a way to reduce pain of paying\n- [[13-animations-that-turn-your-message-into-a-story]] – same pattern: call to action by direct message for a service\n- [[10-the-five-year-old-rule]] – same pattern: 'DM me' call to action\n- [[36-confirmation-bias-say-what-people-already-think]] – related: both are research steps before marketing: 36 researches the own customers, 05 researches other brands' campaigns\n- [[call-to-action-dm-comment]]\n- [[competitor-research]]\n- [[free-trial]]\n- [[named-brands]]\n"}, {"id": "06-priming-makes-people-buy-without-a-word", "kind": "station", "title": "06 – Priming: make people buy without saying a word", "path": "stationen/06-priming-makes-people-buy-without-a-word.md", "text": "---\nid: 06\nsource: quellen/videos/06 (v24044gl0000d3rjprnog65k1glu946g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 42.34\nduration_video_s: 47.03\nconcepts: [covert-influence, own-idea-feeling, priming]\n---\n# 06 – Priming: make people buy without saying a word\n## Verbatim\n```text\n[00:00.00 - 00:02.22] You can make people buy without saying a word to them.\n[00:03.16 - 00:08.02] The method is called priming, and it is the reason why brands exist.\n[00:09.04 - 00:17.38] Tiny hints in what people see, hear, or feel can shift their mood and decisions without them ever realizing it.\n[00:18.04 - 00:22.46] For example, show a scene of comfort before selling furniture.\n[00:23.62 - 00:27.04] Show happy families before promoting vacations.\n[00:27.84 - 00:32.68] These little mental seeds make your offer feel right before you even place it.\n[00:33.74 - 00:41.34] They plant this association in your customer's brain, and when the mind is already in the right frame, the sale feels like their own idea.\n[00:41.34 - 00:42.34] So...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'priming' / On-screen at 3 s: \"Primin\" (truncated word).\n- Audio ends with 'So...' (41.34-42.34 s).\n\n## Visuals\n- Frame 10 (27 s): brain outline with white dot, caption \"These little\". Frame 8 (21 s): rectangle with panel and bar (furniture scene), frame 9 (24 s): rectangle with three person icons (families). Frame 11 (30 s): glowing check mark.\n\n## Statements\n1. \"You can make people buy without saying a word to them.\"\n2. \"The method is called priming, and it is the reason why brands exist.\"\n3. \"Tiny hints in what people see, hear, or feel can shift their mood and decisions without them ever realizing it.\"\n4. \"For example, show a scene of comfort before selling furniture.\"\n5. \"Show happy families before promoting vacations.\"\n6. \"These little mental seeds make your offer feel right before you even place it.\"\n7. \"They plant this association in your customer's brain, and when the mind is already in the right frame, the sale feels like their own idea.\"\n\n## Assessment\n1. **conditional** – Claim, unverified; a sale with no message is not shown. Required change: restate as 'create context before the offer'.\n2. **usable** – Claim, unverified; 'the reason why brands exist' is absolute.\n3. **conditional** – The mechanism described is covert influence. Nearest checkpoint: deception (ghish), interpretive mapping. Required change: primed context must be truthful and the offer fully disclosed; hints are not used to hide terms.\n4. **usable** – Truthful mood context if the furniture provides comfort.\n5. **conditional** – Required change: imagery must not include impermissible content (content checkpoint) and must be truthful about the vacation.\n6. **conditional** – Same condition as statement 3.\n7. **conditional** – 'Feels like their own idea' through pre-conditioning is covert. Required change: the decision stays informed; no false association.\n\n## Links\n- [[35-make-them-feel-they-found-it]] – same mechanism: the purchase should feel like the customer's own idea\n- [[12-emotions-are-caught-sell-the-feeling-first]] – related: an emotion associated with an ad is mirrored by the viewer\n- [[36-confirmation-bias-say-what-people-already-think]] – related: tailoring to existing beliefs is another covert-influence technique\n- [[02-sell-the-after-not-the-what]] – related: painting the future is a form of priming\n- [[covert-influence]]\n- [[own-idea-feeling]]\n- [[priming]]\n"}, {"id": "07-marketing-and-branding-are-yin-and-yang", "kind": "station", "title": "07 – Marketing and branding are like yin and yang", "path": "stationen/07-marketing-and-branding-are-yin-and-yang.md", "text": "---\nid: 07\nsource: quellen/videos/07 (v24044gl0000d45eq7fog65t7dl9uugg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 34.56\nduration_video_s: 27.57\nconcepts: [attention, marketing-vs-branding, memorability]\n---\n# 07 – Marketing and branding are like yin and yang\n## Verbatim\n```text\n[00:00.00 - 00:05.44] marketing and branding are like yin and yang one can't exist without the other marketing gets\n[00:05.44 - 00:10.40] attention and branding makes people remember marketing drives sales in the short term but\n[00:10.40 - 00:15.76] branding builds emotional connection in the long term marketing is what you say and branding is what\n[00:15.76 - 00:20.72] people think when you stop saying it most businesses push marketing but forget branding\n[00:20.72 - 00:34.56] do both and watch your business grow\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The final sentence 'do both and watch your business grow' is a single entry from 20.72 s to 34.56 s; the file is 27.57 s long, so the end timestamp is beyond the file.\n\n## Visuals\n- Frames 1-2: yin-yang symbol. Frame 3 (6 s): circle above a lightbulb. Frame 8 (21 s): scattered circles forming a rising line, caption \"and watch your business grow\". Frame 7 (18 s): megaphone in circle, caption \"push marketing\".\n\n## Statements\n1. \"marketing and branding are like yin and yang one can't exist without the other\"\n2. \"marketing gets attention and branding makes people remember\"\n3. \"marketing drives sales in the short term but branding builds emotional connection in the long term\"\n4. \"marketing is what you say and branding is what people think when you stop saying it\"\n5. \"most businesses push marketing but forget branding\"\n6. \"do both and watch your business grow\"\n\n## Assessment\n1. **usable** – Claim, unverified; metaphor.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Definition.\n5. **usable** – Claim, unverified; no data.\n6. **usable** – Claim, unverified; no guarantee may be derived from it.\n\n## Links\n- [[20-branding-is-the-1p-model-perception]] – same distinction: 4P (marketing) vs 1P perception (branding)\n- [[24-attention-comes-from-clarity-not-frequency]] – extends: attention requires clarity, which 07 assigns to marketing\n- [[03-your-brand-is-the-feeling-not-the-logo]] – same claim: brand is what people think and feel\n- [[31-best-product-with-bad-branding-loses]] – related: 07 says do both marketing and branding; 31 says focus on the product but more on branding\n- [[attention]]\n- [[marketing-vs-branding]]\n- [[memorability]]\n"}, {"id": "08-open-a-loop-zagarnik-effect", "kind": "station", "title": "08 – Open a loop: the Zagarnik effect", "path": "stationen/08-open-a-loop-zagarnik-effect.md", "text": "---\nid: 08\nsource: quellen/videos/08 (v24044gl0000d4cospfog65gk0ommbf0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 35.16\nduration_video_s: 39.80\nconcepts: [memorability, named-brands, zagarnik-effect]\n---\n# 08 – Open a loop: the Zagarnik effect\n## Verbatim\n```text\n[00:00.00 - 00:03.96] Have you ever started a Netflix show and suddenly had to finish the whole season?\n[00:05.04 - 00:09.68] Even if it wasn't that good? That's not your weakness. It's how your brain is wired.\n[00:10.52 - 00:15.00] It's called the Zagarnik effect. Your mind simply hates unfinished stories.\n[00:15.98 - 00:18.34] It keeps thinking about them and searches for closure.\n[00:19.62 - 00:22.88] Smart marketers know this. They don't tell you everything up front.\n[00:23.26 - 00:25.66] They open a loop and let your brain chase the ending.\n[00:26.22 - 00:29.76] If you want people to remember your brand, don't close the story too soon.\n[00:30.62 - 00:33.80] Start it, leave a gap, and let curiosity do the rest.\n[00:34.66 - 00:35.16] But...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript spells 'Zagarnik'; no on-screen text shows the name. Source spelling kept.\n- Audio ends with 'But...' (34.66-35.16 s).\n\n## Visuals\n- Frame 1 (0 s): hand holding a phone and monitor outline, caption \"started a Netflix show\". Frame 11 (30 s): two outline squares with two dots, caption \"Leave a gap\".\n\n## Statements\n1. \"Have you ever started a Netflix show and suddenly had to finish the whole season?\"\n2. \"Even if it wasn't that good?\"\n3. \"That's not your weakness. It's how your brain is wired.\"\n4. \"It's called the Zagarnik effect.\"\n5. \"Your mind simply hates unfinished stories.\"\n6. \"It keeps thinking about them and searches for closure.\"\n7. \"Smart marketers know this.\"\n8. \"They don't tell you everything up front.\"\n9. \"They open a loop and let your brain chase the ending.\"\n10. \"If you want people to remember your brand, don't close the story too soon.\"\n11. \"Start it, leave a gap, and let curiosity do the rest.\"\n\n## Assessment\n1. **usable** – Named brand: Netflix; rhetorical question.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim, unverified.\n4. **usable** – Named effect; no study or author cited. Claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified.\n7. **usable** – No checkpoint touched.\n8. **conditional** – Withholding is usable only if no essential term (price, conditions, risks) is withheld (gharar). Required change: open the loop on content, not on terms.\n9. **conditional** – Same condition as statement 8.\n10. **conditional** – Same condition as statement 8.\n11. **conditional** – Same condition; the gap must be filled truthfully, no teaser that is not paid off (ghish).\n\n## Links\n- [[15-three-questions-every-customer-asks]] – contrast: 15 says answer the customer's questions fast; 08 withholds the ending\n- [[27-the-more-people-think-the-less-they-trust]] – contrast: 27 says clarity wins and effort to understand creates risk\n- [[16-illusion-of-innovation]] – same mechanism: curiosity creation\n- [[30-content-fails-in-the-first-seconds]] – related: 30 requires the content's topic to be clear immediately\n- [[24-attention-comes-from-clarity-not-frequency]] – related: attention via relevance, not via mystery\n- [[memorability]]\n- [[named-brands]]\n- [[zagarnik-effect]]\n"}, {"id": "09-branding-is-for-any-company", "kind": "station", "title": "09 – Branding is for any company, size does not matter", "path": "stationen/09-branding-is-for-any-company.md", "text": "---\nid: 09\nsource: quellen/videos/09 (v24044gl0000d4trtcfog65uuam4t9pg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 46.94\nduration_video_s: 52.03\nconcepts: [brand-consistency, brand-perception, named-brands]\n---\n# 09 – Branding is for any company, size does not matter\n## Verbatim\n```text\n[00:00.00 - 00:01.56] In branding, size doesn't matter.\n[00:02.46 - 00:04.92] Most people think branding is only for the biggest companies.\n[00:05.92 - 00:08.24] But actually, branding is for any company,\n[00:08.48 - 00:10.98] and it is the fastest way to create your competitive advantage.\n[00:11.84 - 00:13.28] Because branding isn't just a logo.\n[00:14.22 - 00:17.48] It's how people feel about you before they have even tried your product.\n[00:18.20 - 00:22.68] It's what they feel about you when they hear, see, smell, or think about you.\n[00:23.20 - 00:24.54] Directly or indirectly.\n[00:24.86 - 00:29.46] When your brand is clear and consistent, price stops being the only factor.\n[00:30.00 - 00:34.98] People will choose you because of who you are, not for what you sell.\n[00:35.82 - 00:40.88] And that's when your business stops being a fight for attention and becomes a magnet.\n[00:42.00 - 00:46.94] Invest in your branding, because otherwise you will miss the most important opportunity.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- No discrepancy between transcript and on-screen text found in the sampled frames.\n\n## Visuals\n- Frame 5 (12 s): outline Apple logo, caption \"isn't just a logo\". Frame 8 (21 s): vertical stack of ear, eye, hand and lightbulb icons above a larger circle, caption \"think about you\". Frames 14-15 (39-42 s): blurred dollar coins, network of dollar circles. Frame 16 (45 s): pentagon with a keyhole mark, caption \"opportunity\".\n\n## Statements\n1. \"In branding, size doesn't matter.\"\n2. \"Most people think branding is only for the biggest companies.\"\n3. \"But actually, branding is for any company, and it is the fastest way to create your competitive advantage.\"\n4. \"Because branding isn't just a logo.\"\n5. \"It's how people feel about you before they have even tried your product.\"\n6. \"It's what they feel about you when they hear, see, smell, or think about you.\"\n7. \"Directly or indirectly.\"\n8. \"When your brand is clear and consistent, price stops being the only factor.\"\n9. \"People will choose you because of who you are, not for what you sell.\"\n10. \"And that's when your business stops being a fight for attention and becomes a magnet.\"\n11. \"Invest in your branding, because otherwise you will miss the most important opportunity.\"\n\n## Assessment\n1. **usable** – No checkpoint touched.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified; 'fastest' not shown.\n4. **usable** – No checkpoint touched.\n5. **usable** – No checkpoint touched.\n6. **usable** – Definition.\n7. **usable** – No checkpoint touched.\n8. **usable** – Claim, unverified.\n9. **conditional** – Required change: 'who you are' must be a true identity (ghish).\n10. **usable** – Claim, unverified; metaphor.\n11. **conditional** – Loss-framed urgency without evidence; claim, unverified. Required change: no fear claim beyond what can be shown.\n\n## Links\n- [[03-your-brand-is-the-feeling-not-the-logo]] – same claim: brand is the feeling, not the logo\n- [[20-branding-is-the-1p-model-perception]] – same claim: perception\n- [[31-best-product-with-bad-branding-loses]] – extends: branding as the decisive advantage\n- [[04-there-is-no-winning-product]] – related: branding lets boring products win\n- [[22-price-is-never-the-problem]] – related: price becomes secondary when value is understood\n- [[brand-consistency]]\n- [[brand-perception]]\n- [[named-brands]]\n"}, {"id": "10-the-five-year-old-rule", "kind": "station", "title": "10 – The five-year-old rule: simple marketing converts", "path": "stationen/10-the-five-year-old-rule.md", "text": "---\nid: 10\nsource: quellen/videos/10 (v26044gc0000d54mrtfog65o84vmp77g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 38.16\nduration_video_s: 43.47\nconcepts: [call-to-action-dm-comment, clarity, storytelling]\n---\n# 10 – The five-year-old rule: simple marketing converts\n## Verbatim\n```text\n[00:00.00 - 00:02.84] This is the five-year-old rule and why it matters.\n[00:03.76 - 00:06.10] In marketing, there is this unwritten rule.\n[00:07.04 - 00:09.36] If a five-year-old can't understand what you do,\n[00:09.94 - 00:11.72] most adults won't either.\n[00:12.56 - 00:14.42] Because the more complex your marketing,\n[00:14.88 - 00:16.86] the less it will convert.\n[00:17.60 - 00:20.04] It's also the reason you're still watching this video.\n[00:21.04 - 00:22.82] It explains one simple idea\n[00:22.82 - 00:25.52] with visuals your brain actually enjoys.\n[00:26.24 - 00:29.24] Every person or brand has something worth saying.\n[00:30.00 - 00:32.42] Just don't make it hard for people to understand it.\n[00:33.52 - 00:37.16] DM me to turn your message into a story anyone can get and love.\n[00:37.16 - 00:38.16] Because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'convert' / On-screen at 15 s: \"it will conv[t]\" with the middle of the word covered by a white dot. Covered letters: [unclear] (single frame f_006 checked; the word is read as 'convert' only from the audio).\n- Audio ends with 'Because...' (37.16-38.16 s).\n\n## Visuals\n- Frame 1 (0 s): outline calendar with the number \"4\" and rings on top. Frame 5 (12 s): many grey question marks. Frame 6 (15 s): thin wavy line with a dot and a dollar coin at lower left. Frame 12 (33 s): envelope with a swirl of dots, caption \"to turn your message\".\n- The video contains a service offer by the creator ('DM me').\n\n## Statements\n1. \"This is the five-year-old rule and why it matters.\"\n2. \"In marketing, there is this unwritten rule.\"\n3. \"If a five-year-old can't understand what you do, most adults won't either.\"\n4. \"Because the more complex your marketing, the less it will convert.\"\n5. \"It's also the reason you're still watching this video.\"\n6. \"It explains one simple idea with visuals your brain actually enjoys.\"\n7. \"Every person or brand has something worth saying.\"\n8. \"Just don't make it hard for people to understand it.\"\n9. \"DM me to turn your message into a story anyone can get and love.\"\n\n## Assessment\n1. **usable** – No checkpoint touched.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified.\n5. **usable** – Self-referential; claim, unverified.\n6. **usable** – No checkpoint touched.\n7. **usable** – No checkpoint touched.\n8. **usable** – No checkpoint touched.\n9. **conditional** – Service offer by the creator. Usable as a call to action; price and scope of the service must be stated when offered (gharar).\n\n## Links\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: clarity wins, effort lowers trust\n- [[34-one-message-one-offer-one-action]] – same mechanism: simplicity as message discipline\n- [[13-animations-that-turn-your-message-into-a-story]] – same pattern: animation/story service offer by DM\n- [[16-illusion-of-innovation]] – contradicts: 16 says smart businesses use complexity to create curiosity\n- [[15-three-questions-every-customer-asks]] – extends: 15 says answer fast and understandably\n- [[call-to-action-dm-comment]]\n- [[clarity]]\n- [[storytelling]]\n"}, {"id": "11-you-sell-emotions-not-the-product", "kind": "station", "title": "11 – You don't sell the product, you sell emotions (goal and anti-goal)", "path": "stationen/11-you-sell-emotions-not-the-product.md", "text": "---\nid: 11\nsource: quellen/videos/11 (v26044gc0000d5cj47vog65o3bp0j090.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 45.16\nduration_video_s: 49.67\nconcepts: [cost-of-inaction, desired-outcome, emotion-selling, emotion-then-logic, fear-of-missing-out, perceived-value]\n---\n# 11 – You don't sell the product, you sell emotions (goal and anti-goal)\n## Verbatim\n```text\n[00:00.00 - 00:05.54] This is the most important rule in marketing. You don't sell the product, you sell emotions.\n[00:06.50 - 00:10.98] The emotion of getting closer to the desired outcome. The emotion of reaching a goal.\n[00:11.96 - 00:18.50] But also, the emotion of not reaching it. To each goal, there is also an anti-goal.\n[00:19.36 - 00:22.56] So sell the emotion of how life is going to be when reaching the goal,\n[00:22.92 - 00:26.22] but also how life will be if not reaching it.\n[00:26.22 - 00:30.06] People buy emotions and justify with logic.\n[00:31.22 - 00:34.54] For this reason, the perceived value of experiencing this emotion\n[00:34.54 - 00:39.30] has to be greater than the perceived costs to experience the emotion.\n[00:40.66 - 00:45.16] Picture it and make your customers feel the emotion so that they fear missing out.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'going to be' / On-screen at 18 s: \"so sell the emotion of how life is gonna be\".\n- On-screen \"people buy emotions and justify with logic\" is shown in two consecutive samples (27 s and 30 s); audio says it once (26.22-30.06 s).\n\n## Visuals\n- Image sequence uses objects as emotion/goal symbols: silver watch (frame 2), running figure on a line (frame 3), diamond on a pedestal (frame 4), dark standing silhouette (frame 5), hourglass and close-up of an hourglass with a sand stream (frames 8-9), silver shopping cart (frame 10), balance scale with a small building-like icon in a square on the left and a crystal in a square on the right (frame 13), seesaw with a crystal (frame 12), white blob above dark silhouettes of people (frame 15).\n\n## Statements\n1. \"This is the most important rule in marketing.\"\n2. \"You don't sell the product, you sell emotions.\"\n3. \"The emotion of getting closer to the desired outcome.\"\n4. \"The emotion of reaching a goal.\"\n5. \"But also, the emotion of not reaching it.\"\n6. \"To each goal, there is also an anti-goal.\"\n7. \"So sell the emotion of how life is going to be when reaching the goal, but also how life will be if not reaching it.\"\n8. \"People buy emotions and justify with logic.\"\n9. \"For this reason, the perceived value of experiencing this emotion has to be greater than the perceived costs to experience the emotion.\"\n10. \"Picture it and make your customers feel the emotion so that they fear missing out.\"\n\n## Assessment\n1. **usable** – Claim, unverified; 'most important' is a ranking without evidence.\n2. **conditional** – Usable as framing. Required change: the product's real function and terms are still stated (gharar).\n3. **usable** – No checkpoint touched.\n4. **usable** – No checkpoint touched.\n5. **conditional** – Usable only if the negative outcome is real and caused by not acting; no invented fear (ghish). Required change: show consequences that are factually true.\n6. **usable** – Concept.\n7. **conditional** – Same condition: both pictures must be realistic and attainable/true; no promise of life outcomes the product cannot deliver.\n8. **usable** – Claim, unverified; no study named.\n9. **conditional** – Usable if all costs (price, terms, effort) are disclosed so 'perceived costs' are accurate (gharar).\n10. **conditional** – Fear of missing out is acceptable only about real, verifiable losses. Required change: no fabricated urgency, scarcity or deadline (ghish, najsh).\n\n## Links\n- [[21-people-want-to-stop-losing]] – same mechanism: showing the cost of not acting (anti-goal = 'what they are already losing')\n- [[02-sell-the-after-not-the-what]] – same mechanism: selling the desired after\n- [[12-emotions-are-caught-sell-the-feeling-first]] – same claim: 'sell the feeling first and the product second'\n- [[22-price-is-never-the-problem]] – extends: 22 argues that price objections are perceived-value problems\n- [[37-sell-the-problem-first]] – related: 37 makes the customer feel the pain of the problem first\n- [[25-emotional-content-is-remembered]] – related: emotional content is remembered, logical content is not\n- [[cost-of-inaction]]\n- [[desired-outcome]]\n- [[emotion-selling]]\n- [[emotion-then-logic]]\n- [[fear-of-missing-out]]\n- [[perceived-value]]\n"}, {"id": "12-emotions-are-caught-sell-the-feeling-first", "kind": "station", "title": "12 – Emotions are caught from others: sell the feeling first, the product second", "path": "stationen/12-emotions-are-caught-sell-the-feeling-first.md", "text": "---\nid: 12\nsource: quellen/videos/12 (v26044gc0000d5kdq5vog65hk2f3dg20.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 41.44\nduration_video_s: 45.67\nconcepts: [covert-influence, emotion-selling, emotional-contagion, named-brands]\n---\n# 12 – Emotions are caught from others: sell the feeling first, the product second\n## Verbatim\n```text\n[00:00.00 - 00:03.28] This is the dark psychology behind ads that convert.\n[00:04.08 - 00:07.04] Humans literally catch emotions from others.\n[00:07.04 - 00:12.16] When your friends are happy, excited, or relieved, your brain mirrors that feeling.\n[00:12.16 - 00:14.96] When you see an ad, the same happens.\n[00:14.96 - 00:17.44] If you see someone feeling happy to drink a Coke,\n[00:18.08 - 00:22.08] your brain will mirror this association and emotional reaction too.\n[00:22.08 - 00:26.48] This works even better if the emotion and situation is authentic.\n[00:26.48 - 00:30.96] When the emotion feels raw and real, it spreads even faster.\n[00:30.96 - 00:36.56] So if you want to have more happy customers, sell the feeling first and the product second.\n[00:36.56 - 00:40.08] Because people buy the emotion they want to feel subconsciously.\n[00:40.88 - 00:41.44] And...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Humans literally catch emotions from others.' / On-screen at 3 s: \"We humans literally\" (word 'We' only on screen).\n- Transcript: 'your brain will mirror this association and emotional reaction too.' / On-screen at 18 s: \"this association\" (partial).\n- Audio ends with 'And...' (40.88-41.44 s); the video file is 45.67 s long.\n\n## Visuals\n- Frame 1 (0 s): hooded figure holding a small ball in both hands, caption \"This is the dark psychology\". Frame 8 (21 s): smiley face in circle. Frame 9 (24 s): rosette badge with check mark and partial smiley above, caption \"is authentic\". Frame 12 (33 s): dashed diagram, heart at top and three person icons below, caption \"sell the feeling first\".\n\n## Statements\n1. \"This is the dark psychology behind ads that convert.\"\n2. \"Humans literally catch emotions from others.\"\n3. \"When your friends are happy, excited, or relieved, your brain mirrors that feeling.\"\n4. \"When you see an ad, the same happens.\"\n5. \"If you see someone feeling happy to drink a Coke, your brain will mirror this association and emotional reaction too.\"\n6. \"This works even better if the emotion and situation is authentic.\"\n7. \"When the emotion feels raw and real, it spreads even faster.\"\n8. \"So if you want to have more happy customers, sell the feeling first and the product second.\"\n9. \"Because people buy the emotion they want to feel subconsciously.\"\n\n## Assessment\n1. **conditional** – Framing as 'dark psychology'. Nearest checkpoint: deception (ghish). Required change: use only the non-deceptive part (emotional resonance with truthful content).\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified.\n5. **conditional** – Named brand: Coca-Cola. Usable if the depicted emotion corresponds to a real product experience. Claim, unverified. Beverage content: no checkpoint hit as such.\n6. **usable** – Claim, unverified. Supports truthfulness. 'Authentic' must be real, not staged to look real (ghish).\n7. **conditional** – Claim, unverified. Required change: 'feels raw and real' must not be produced by scripted fake testimonials or actors presented as customers (ghish).\n8. **conditional** – Product and its terms must still be clear (gharar).\n9. **conditional** – Claim, unverified. 'Subconsciously' = covert influence; usable only with fully disclosed offer.\n\n## Links\n- [[11-you-sell-emotions-not-the-product]] – same claim: you sell emotions\n- [[06-priming-makes-people-buy-without-a-word]] – same mechanism: association planted in the viewer, covert\n- [[25-emotional-content-is-remembered]] – extends: emotional content is what is remembered\n- [[19-sell-to-everyone-sell-to-no-one]] – related: 12 says viewers mirror an emotion shown in an ad; 19 says people listen when they feel seen (both rely on the viewer recognising themselves in the message)\n- [[35-make-them-feel-they-found-it]] – related: purchase as own, felt decision\n- [[covert-influence]]\n- [[emotion-selling]]\n- [[emotional-contagion]]\n- [[named-brands]]\n"}, {"id": "13-animations-that-turn-your-message-into-a-story", "kind": "station", "title": "13 – Animations that turn your message into a scroll-stopping story (service offer)", "path": "stationen/13-animations-that-turn-your-message-into-a-story.md", "text": "---\nid: 13\nsource: quellen/videos/13 (v26044gc0000d5pshrvog65umvn2ucog.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 36.04\nduration_video_s: 40.70\nconcepts: [call-to-action-dm-comment, clarity, first-seconds-hook, social-media-content, storytelling]\n---\n# 13 – Animations that turn your message into a scroll-stopping story (service offer)\n## Verbatim\n```text\n[00:00.00 - 00:07.50] A picture is worth a thousand words, but a good video is what makes people stop, feel something,\n[00:07.94 - 00:14.62] and want to know more, all within a few seconds. The problem is most brands explain too much and\n[00:14.62 - 00:22.34] say too little. Our animations do the opposite. They simplify, clarify, and connect. If you're\n[00:22.34 - 00:26.56] building something great but struggling to make people get it, we will help you turn your message\n[00:26.56 - 00:33.44] into a scroll-stopping story, with marketing that moves minds and animations that hypnotize.\n[00:34.48 - 00:36.04] DM to get started.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The file is 40.70 s long; the last spoken line ends at 36.04 s.\n\n## Visuals\n- Frame 10 (27 s): film frame with play triangle, caption \"into a scroll-stopping story\". Frame 11 (30 s): brain outline, caption \"that moves minds\". Frame 8 (21 s): cluster of circles containing a pointer, an eye and a link icon.\n- This video is an advertisement for the creator's own service (first person plural: 'Our', 'we').\n\n## Statements\n1. \"A picture is worth a thousand words, but a good video is what makes people stop, feel something, and want to know more, all within a few seconds.\"\n2. \"The problem is most brands explain too much and say too little.\"\n3. \"Our animations do the opposite.\"\n4. \"They simplify, clarify, and connect.\"\n5. \"If you're building something great but struggling to make people get it, we will help you turn your message into a scroll-stopping story,\"\n6. \"with marketing that moves minds and animations that hypnotize.\"\n7. \"DM to get started.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Service claim by the creator.\n4. **usable** – Service claim, unverified.\n5. **conditional** – Service offer. Required change: scope, price and deliverables stated before purchase (gharar).\n6. **conditional** – 'Hypnotize' and 'moves minds' read as covert influence. Required change: remove as outcome promise (ghish); claim, unverified.\n7. **usable** – Call to action; no checkpoint touched.\n\n## Links\n- [[10-the-five-year-old-rule]] – same pattern: DM call to action for a message/story service\n- [[05-study-what-works-particl]] – same pattern: DM call to action\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: clarity\n- [[30-content-fails-in-the-first-seconds]] – related: stopping people within seconds\n- [[23-the-customer-is-the-hero-of-the-story]] – related: story-based marketing\n- [[call-to-action-dm-comment]]\n- [[clarity]]\n- [[first-seconds-hook]]\n- [[social-media-content]]\n- [[storytelling]]\n"}, {"id": "14-sell-water-to-the-thirsty", "kind": "station", "title": "14 – Sell water to the thirsty: identify demand, do not create it", "path": "stationen/14-sell-water-to-the-thirsty.md", "text": "---\nid: 14\nsource: quellen/videos/14 (v26044gc0000d5shpqfog65ql6imt0fg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.46\nduration_video_s: 34.23\nconcepts: [existing-demand, pain-of-the-problem, relief-framing]\n---\n# 14 – Sell water to the thirsty: identify demand, do not create it\n## Verbatim\n```text\n[00:00.00 - 00:03.28] The easiest way to sell something is to sell water to the thirsty.\n[00:04.16 - 00:09.46] What this means is that you need to understand what people are already looking for and where they are.\n[00:10.28 - 00:13.84] Most marketing fails because it tries to create demand.\n[00:14.36 - 00:17.74] Instead of identifying demand and simply channeling it.\n[00:18.66 - 00:23.58] So instead, go where the problem is already painful enough and where people need a solution for it.\n[00:24.42 - 00:28.46] Because with that, your offer will feel like relief, not like persuasion.\n[00:28.46 - 00:30.46] Because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with 'Because...' (28.46-30.46 s); the file is 34.23 s long.\n\n## Visuals\n- Frame 2 (3 s): glass filled with white, with a dot and a \"?\" above. Frame 3 (6 s): person icon with a grey circle containing \"?\" above the head. Frame 8 (21 s): dashed oval containing an upset face. Frame 10 (27 s): percent-sign badge with dots.\n\n## Statements\n1. \"The easiest way to sell something is to sell water to the thirsty.\"\n2. \"What this means is that you need to understand what people are already looking for and where they are.\"\n3. \"Most marketing fails because it tries to create demand.\"\n4. \"Instead of identifying demand and simply channeling it.\"\n5. \"So instead, go where the problem is already painful enough and where people need a solution for it.\"\n6. \"Because with that, your offer will feel like relief, not like persuasion.\"\n\n## Assessment\n1. **usable** – Claim, unverified; proverb.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim, unverified.\n4. **usable** – No checkpoint touched.\n5. **conditional** – Required change: the offer must really solve the problem; no exploitation of acute distress; a religious obligation is not treated as a market gap (GRUNDSATZ).\n6. **conditional** – Usable if the offer actually brings relief; 'not like persuasion' must not mean hiding the sales intent (ghish).\n\n## Links\n- [[37-sell-the-problem-first]] – same mechanism: people buy relief from a painful problem\n- [[16-illusion-of-innovation]] – contradicts: 16 creates curiosity/need via new-sounding formulas, 14 says do not create demand\n- [[32-conversion-problem-or-traffic-problem]] – related: 32 splits problems into traffic and conversion; 14 is about finding people already looking\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – related: 17 requires showing that you understood the problem\n- [[existing-demand]]\n- [[pain-of-the-problem]]\n- [[relief-framing]]\n"}, {"id": "15-three-questions-every-customer-asks", "kind": "station", "title": "15 – Three questions every customer asks: what is this, will it help me, can I trust it", "path": "stationen/15-three-questions-every-customer-asks.md", "text": "---\nid: 15\nsource: quellen/videos/15 (v26044gc0000d6fesi7og65mdqhpmmog.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.22\nduration_video_s: 34.20\nconcepts: [buyer-questions, clarity, feeling-understood, trust]\n---\n# 15 – Three questions every customer asks: what is this, will it help me, can I trust it\n## Verbatim\n```text\n[00:00.00 - 00:04.60] These are the three questions every customer asks himself before they buy something from you.\n[00:05.52 - 00:10.04] They always ask, what is this, will it help me, and can I trust it?\n[00:10.86 - 00:16.20] If you answer these questions fast and understandable, you are already ahead of 90% of marketers.\n[00:17.22 - 00:19.66] Because people don't decide when they are unsure.\n[00:20.36 - 00:23.92] They decide when they feel understood and safe about their choice.\n[00:24.62 - 00:28.04] So make them understand exactly what they will be getting.\n[00:28.04 - 00:30.22] Because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'every customer asks himself' / On-screen at 0 s: \"Every Customer asks himself\" (no difference in wording).\n- Audio ends with 'Because...' (28.04-30.22 s).\n\n## Visuals\n- Frame 3 (6 s): outline diamond, caption \"What is this\". Frame 5 (12 s): square with bold check mark, caption \"fast and understandable\". Frame 7 (18 s): circle with eight outward arrows, caption \"when they are unsure\".\n\n## Statements\n1. \"These are the three questions every customer asks himself before they buy something from you.\"\n2. \"They always ask, what is this, will it help me, and can I trust it?\"\n3. \"If you answer these questions fast and understandable, you are already ahead of 90% of marketers.\"\n4. \"Because people don't decide when they are unsure.\"\n5. \"They decide when they feel understood and safe about their choice.\"\n6. \"So make them understand exactly what they will be getting.\"\n\n## Assessment\n1. **usable** – Claim, unverified; generalisation.\n2. **usable** – Claim, unverified; 'always'.\n3. **usable** – Claim, unverified: '90% of marketers' has no source.\n4. **usable** – Claim, unverified.\n5. **usable** – Claim, unverified. Supports clear terms (gharar).\n6. **usable** – Aligns with the gharar checkpoint: clear subject of the transaction.\n\n## Links\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: uncertainty prevents purchase, clarity creates certainty\n- [[08-open-a-loop-zagarnik-effect]] – contrast: 08 withholds information to create curiosity\n- [[19-sell-to-everyone-sell-to-no-one]] – related: 'feel seen' and 'build trust'\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – related: customer must understand that you understood\n- [[01-reduce-the-pain-of-paying]] – related: guarantees address 'can I trust it'\n- [[buyer-questions]]\n- [[clarity]]\n- [[feeling-understood]]\n- [[trust]]\n"}, {"id": "16-illusion-of-innovation", "kind": "station", "title": "16 – The illusion of innovation: new-sounding formulas sell more", "path": "stationen/16-illusion-of-innovation.md", "text": "---\nid: 16\nsource: quellen/videos/16 (v26044gc0000d6guconog65vdsb1j6v0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 36.96\nduration_video_s: 41.70\nconcepts: [illusion-of-innovation, named-brands]\n---\n# 16 – The illusion of innovation: new-sounding formulas sell more\n## Verbatim\n```text\n[00:00.00 - 00:04.72] Do you know why most skincare brands constantly launch new formulas?\n[00:05.84 - 00:11.68] Every few months they launch something fancy sounding like a Hydraactive Complex or a\n[00:11.68 - 00:15.92] BioLift Pro Repair. And it sounds like a scientific breakthrough, right?\n[00:16.88 - 00:23.92] But the only reason they do it is to sell more. Smart businesses use complexity to create curiosity.\n[00:24.56 - 00:28.96] If something sounds new or advanced, our brain assumes it must be better than what we already\n[00:28.96 - 00:36.96] have. That's the illusion of innovation. New cells, not because it is new, but because it feels new.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Hydraactive Complex' / On-screen at 9 s: \"Hydra-Active Complex\".\n- Transcript: 'New cells, not because it is new, but because it feels new.' / On-screen at 33-36 s: \"it IS new\", \"it FEELS new\". The words 'New cells' have no on-screen counterpart: [unclear] (audio only).\n- Transcript: 'Do you know why most skincare brands constantly launch new formulas?' / On-screen at 3 s: \"\"new formulas\"?\" (quotation marks around 'new formulas').\n\n## Visuals\n- Frame 1 (0 s): outline skincare tube, pump bottle and jar. Frame 6 (15 s): glowing lightbulb. Frames 12-13 (33-36 s): cylinder with a white dot and sparkle (caption \"it IS new\") and the same cylinder with an outline diamond above (caption \"it FEELS new\").\n\n## Statements\n1. \"Do you know why most skincare brands constantly launch new formulas?\"\n2. \"Every few months they launch something fancy sounding like a Hydraactive Complex or a BioLift Pro Repair.\"\n3. \"And it sounds like a scientific breakthrough, right?\"\n4. \"But the only reason they do it is to sell more.\"\n5. \"Smart businesses use complexity to create curiosity.\"\n6. \"If something sounds new or advanced, our brain assumes it must be better than what we already have.\"\n7. \"That's the illusion of innovation.\"\n8. \"New cells,\"\n9. \"not because it is new, but because it feels new\"\n\n## Assessment\n1. **usable** – Claim, unverified: 'most' and 'constantly'.\n2. **usable** – Examples of product names (appear generic); whether real products exist is unverified. Claim, unverified.\n3. **usable** – Description.\n4. **usable** – Claim, unverified; motive attributed to an entire industry.\n5. **not usable** – Recommends using complicated, advanced-sounding names to create curiosity without real novelty. Deception (ghish). Also contradicts the clarity statements in 10, 27, 34.\n6. **usable** – Claim, unverified. Usable only as an observation to avoid misleading, not as a technique.\n7. **usable** – Name of the effect; description.\n8. **conditional** – [unclear]: audio-only words with no on-screen counterpart and no clear meaning in context; cannot be assessed until the audio is re-checked. Nothing is adopted from this fragment.\n9. **not usable** – Selling the feeling of novelty where the product is not new = deception (ghish). Usable only if the product is genuinely new.\n\n## Links\n- [[10-the-five-year-old-rule]] – contradicts: 10 says the more complex, the less it converts\n- [[27-the-more-people-think-the-less-they-trust]] – contradicts: 27 says the clearest, not the most creative, message wins\n- [[34-one-message-one-offer-one-action]] – contradicts: 34 says one message, because options and complexity cause confusion\n- [[08-open-a-loop-zagarnik-effect]] – same mechanism: curiosity as a sales driver\n- [[18-halo-effect]] – related: perception over reality\n- [[illusion-of-innovation]]\n- [[named-brands]]\n"}, {"id": "17-a-problem-well-explained-is-a-solution-half-sold", "kind": "station", "title": "17 – A problem well explained is a solution half sold", "path": "stationen/17-a-problem-well-explained-is-a-solution-half-sold.md", "text": "---\nid: 17\nsource: quellen/videos/17 (v26044gc0000d6j187nog65hgjqlflr0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 57.16\nduration_video_s: 31.05\nconcepts: [customer-understanding, feeling-understood, problem-first-selling]\n---\n# 17 – A problem well explained is a solution half sold\n## Verbatim\n```text\n[00:00.00 - 00:01.64] This is why your marketing fails.\n[00:02.64 - 00:06.78] You need to understand, a problem well explained is a solution half sold.\n[00:07.48 - 00:09.02] People don't care about your business.\n[00:09.40 - 00:11.22] They only care about it when you make them care.\n[00:12.08 - 00:16.58] And you only make people care when they understand that you understood their problem,\n[00:17.40 - 00:19.76] their desire, and their exact situation.\n[00:21.08 - 00:24.60] Prove that you understand your customers, and they will buy.\n[00:25.88 - 00:27.08] Because...\n[00:30.00 - 00:34.90] ...\n[00:40.88 - 00:42.84] ...\n[00:42.84 - 00:46.76] ...\n[00:48.76 - 00:48.86] ...\n[00:48.98 - 00:53.06] ...\n[00:53.06 - 00:57.16] ...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends the spoken part with 'Because...' (25.88-27.08 s). The transcript then contains six lines of '...' with timestamps 30.00-57.16 s; the video file is 31.05 s long. These entries after the file end are Whisper artifacts and carry no speech.\n- duration_s in the front matter is the last transcript timestamp, as specified; the real file length is in duration_video_s.\n\n## Visuals\n- Frame 2 (3 s): tangled white outline loops, caption \"a problem well explained\". Frame 9 (24 s): starburst of lines around a dot.\n\n## Statements\n1. \"This is why your marketing fails.\"\n2. \"You need to understand, a problem well explained is a solution half sold.\"\n3. \"People don't care about your business.\"\n4. \"They only care about it when you make them care.\"\n5. \"And you only make people care when they understand that you understood their problem, their desire, and their exact situation.\"\n6. \"Prove that you understand your customers, and they will buy.\"\n\n## Assessment\n1. **usable** – Framing.\n2. **usable** – Proverb; claim, unverified.\n3. **usable** – Claim, unverified.\n4. **conditional** – 'Make them care' acceptable via relevance and truthful understanding; not via manufactured emotion (ghish).\n5. **usable** – Claim, unverified.\n6. **conditional** – Claim, unverified; 'they will buy' is no guarantee. The understanding must be real, not simulated (ghish).\n\n## Links\n- [[37-sell-the-problem-first]] – same mechanism: problem first, then the solution\n- [[23-the-customer-is-the-hero-of-the-story]] – same mechanism: the customer, not the business, is the focus\n- [[36-confirmation-bias-say-what-people-already-think]] – extends: 36 shows concrete steps to understand customers\n- [[19-sell-to-everyone-sell-to-no-one]] – same mechanism: feel seen\n- [[15-three-questions-every-customer-asks]] – related: feel understood\n- [[customer-understanding]]\n- [[feeling-understood]]\n- [[problem-first-selling]]\n"}, {"id": "18-halo-effect", "kind": "station", "title": "18 – The halo effect: one strong impression colours everything", "path": "stationen/18-halo-effect.md", "text": "---\nid: 18\nsource: quellen/videos/18 (v26044gc0000d6msqhfog65uptl9ekd0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 37.86\nduration_video_s: 42.03\nconcepts: [brand-consistency, brand-perception, halo-effect]\n---\n# 18 – The halo effect: one strong impression colours everything\n## Verbatim\n```text\n[00:00.00 - 00:03.20] This simple principle decides whether your marketing is great or bad.\n[00:03.80 - 00:07.10] If your brand looks average, people will assume it is average.\n[00:08.18 - 00:09.84] This is what's called the halo effect.\n[00:10.82 - 00:15.74] One strong impression, good or bad, influences directly everything that follows.\n[00:16.56 - 00:19.46] So if your design is weak, your offer feels weak.\n[00:20.04 - 00:23.18] If your site looks outdated, your product feels outdated.\n[00:24.04 - 00:25.34] The brain doesn't separate.\n[00:25.88 - 00:28.32] It generalizes and transfers information.\n[00:28.32 - 00:32.70] So if you want to be seen as premium, make everything look premium.\n[00:33.66 - 00:37.86] Because in marketing, your product is defined by perception, not reality.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends the transcript on 'defined by perception, not reality.' (37.86 s); the file is 42.03 s long.\n\n## Visuals\n- Frame 1 (0 s): spotlight cone with a circle at its top. Frame 7 (18 s): glowing document page outline, caption \"your offer feels weak\". Frame 8 (21 s): browser window outline with a cube in a frame, caption \"your product\".\n\n## Statements\n1. \"This simple principle decides whether your marketing is great or bad.\"\n2. \"If your brand looks average, people will assume it is average.\"\n3. \"This is what's called the halo effect.\"\n4. \"One strong impression, good or bad, influences directly everything that follows.\"\n5. \"So if your design is weak, your offer feels weak.\"\n6. \"If your site looks outdated, your product feels outdated.\"\n7. \"The brain doesn't separate.\"\n8. \"It generalizes and transfers information.\"\n9. \"So if you want to be seen as premium, make everything look premium.\"\n10. \"Because in marketing, your product is defined by perception, not reality.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Named effect; no author or study cited.\n4. **usable** – Claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified.\n7. **usable** – Claim, unverified.\n8. **usable** – Claim, unverified.\n9. **conditional** – Required change: 'premium' appearance must match real quality; no false quality claim (ghish). Design quality itself is permissible.\n10. **conditional** – Usable as description; not a license to misrepresent. Claim, unverified; 'not reality' contradicts the truthfulness condition and is rated conditional on that.\n\n## Links\n- [[28-same-wine-different-price-experience]] – example of: same wine perceived as better quality through presentation\n- [[20-branding-is-the-1p-model-perception]] – same claim: perception becomes reality\n- [[09-branding-is-for-any-company]] – same claim: clear and consistent brand\n- [[03-your-brand-is-the-feeling-not-the-logo]] – extends: the feeling a logo evokes\n- [[04-there-is-no-winning-product]] – related: appearance and story over product\n- [[brand-consistency]]\n- [[brand-perception]]\n- [[halo-effect]]\n"}, {"id": "19-sell-to-everyone-sell-to-no-one", "kind": "station", "title": "19 – If you sell to everyone, you sell to no one", "path": "stationen/19-sell-to-everyone-sell-to-no-one.md", "text": "---\nid: 19\nsource: quellen/videos/19 (v26044gc0000d6qji4nog65uhcd7rur0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 31.92\nduration_video_s: 38.03\nconcepts: [customer-understanding, feeling-understood, named-brands, target-audience-focus, trust]\n---\n# 19 – If you sell to everyone, you sell to no one\n## Verbatim\n```text\n[00:00.00 - 00:03.36] If you are trying to sell to everyone, you will sell to no one.\n[00:04.16 - 00:07.20] The thing is, your product can never be good for everyone.\n[00:08.08 - 00:10.56] Samsung fans will never own an Apple product.\n[00:11.36 - 00:14.24] Pepsi fans will never choose Coca-Cola over it.\n[00:14.96 - 00:18.00] Focus on one group of people and make it your target audience.\n[00:19.04 - 00:21.36] Because people listen when they feel seen.\n[00:22.40 - 00:24.72] This is why your marketing should feel like a mirror.\n[00:25.52 - 00:28.64] They should feel like you understand them better than they understand themselves.\n[00:28.64 - 00:31.92] This will build trust and increase your sales.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'If you are trying to sell to everyone' / On-screen at 0 s: \"If you were trying to sell to everyone\" (are / were). Verified in single frame f_001.\n- Transcript: 'your product can never be good for everyone' / On-screen at 6 s: caption partly covered by a crystal graphic; the letters between 'ca' and 'ever' are covered: the caption reads \"ca[unclear]ever\" on screen (single frame f_003); the remaining words match.\n- On-screen text not in the audio (frame f_007, 18 s): speech bubbles \"Keeps going. Just like you\" (no final period visible; crop checked at 4x) and a second bubble \"Built for how you\" that is blurred and cut off at the right edge; the remainder after 'you' is [unclear] (appears to read 'move' but is not legible).\n- Timing: the caption \"because people listen when they feel seen\" is on screen at 18 s, while the audio line starts at 19.04 s.\n- Transcript: 'Samsung fans will never own an Apple product.' / On-screen at 9 s: \"Samsung fans will never own an apple product\" (lowercase 'apple').\n\n## Visuals\n- Frame 3 (6 s): dark silhouette of a standing person under a crystal-like rock. Frame 4 (9 s): Samsung smartphone (back, with the word SAMSUNG small on the back) beside a dark phone. Frame 5 (12 s): Pepsi can and Coca-Cola can side by side. Frame 7 (18 s): trapezoid with glowing white spheres carrying exclamation marks and two speech bubbles (see discrepancies). Frames 9-10 (24-27 s): two mirrored human silhouettes with a cracked glass panel between them, a hand reaching in from the right. Frame 11 (30 s): clasped hands silhouette with white cloud shapes.\n\n## Statements\n1. \"If you are trying to sell to everyone, you will sell to no one.\"\n2. \"The thing is, your product can never be good for everyone.\"\n3. \"Samsung fans will never own an Apple product.\"\n4. \"Pepsi fans will never choose Coca-Cola over it.\"\n5. \"Focus on one group of people and make it your target audience.\"\n6. \"Because people listen when they feel seen.\"\n7. \"This is why your marketing should feel like a mirror.\"\n8. \"They should feel like you understand them better than they understand themselves.\"\n9. \"This will build trust and increase your sales.\"\n10. \"Keeps going. Just like you\"\n11. \"Built for how you\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified; 'never' absolute.\n3. **usable** – Named brands: Samsung, Apple. 'Never' absolute; claim, unverified.\n4. **usable** – Named brands: Pepsi, Coca-Cola. 'Never' absolute; claim, unverified.\n5. **usable** – No checkpoint touched.\n6. **usable** – Claim, unverified.\n7. **usable** – Metaphor.\n8. **conditional** – Required change: understanding must come from real research of needs; no exploitation of personal vulnerabilities; no feigned insight (ghish).\n9. **usable** – Claim, unverified; 'will' is no guarantee.\n10. **usable** – On-screen only, in a speech bubble (no final period visible); origin not stated, no product named; no claim content to assess.\n11. **usable** – On-screen only, second speech bubble, blurred and cut off at the right edge; the remainder after 'you' is [unclear] (appears to read 'move'); no claim content to assess.\n\n## Links\n- [[36-confirmation-bias-say-what-people-already-think]] – extends: 36 gives the method to get to know the target audience\n- [[15-three-questions-every-customer-asks]] – same mechanism: feel understood builds the decision\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – same mechanism: show you understood the customer\n- [[34-one-message-one-offer-one-action]] – same mechanism: narrow focus (one message) instead of everything\n- [[33-people-buy-the-product-they-like-best]] – related: people buy the product they like best, not the best product\n- [[customer-understanding]]\n- [[feeling-understood]]\n- [[named-brands]]\n- [[target-audience-focus]]\n- [[trust]]\n"}, {"id": "20-branding-is-the-1p-model-perception", "kind": "station", "title": "20 – Branding is the 1P model: the only P is perception", "path": "stationen/20-branding-is-the-1p-model-perception.md", "text": "---\nid: 20\nsource: quellen/videos/20 (v26044gc0000d6smasvog65mtlmf6me0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 35.56\nduration_video_s: 40.60\nconcepts: [brand-perception, marketing-vs-branding]\n---\n# 20 – Branding is the 1P model: the only P is perception\n## Verbatim\n```text\n[00:00.00 - 00:02.26] In marketing, everyone knows the 4P model.\n[00:02.98 - 00:05.90] Product, price, place, and promotion.\n[00:06.70 - 00:08.40] But branding works on a different model.\n[00:09.06 - 00:10.14] The 1P model.\n[00:11.08 - 00:13.96] The only P branding is about is perception.\n[00:14.88 - 00:18.60] And perception is the sum of every impression people get from your business.\n[00:19.18 - 00:22.26] The way your product looks, the way your message sounds,\n[00:22.70 - 00:24.10] the way your brand makes them feel.\n[00:24.66 - 00:28.34] It's not the price or the product itself that matters at all.\n[00:28.34 - 00:32.12] It's the meaning people attach to each and every interaction with you.\n[00:32.82 - 00:35.56] This is why in branding, perception becomes reality.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- On-screen at 3 s the single caption \"Price\" is shown (graphic: square with \"\\$\\$\\$\" label); no wording difference.\n\n## Visuals\n- Frame 2 (3 s): square with a \"\\$\\$\\$\" label box and a circle inside. Frame 4 (9 s): white dot above the text \"The 1P Model\". Frame 9 (24 s): circle containing two \"\\$\" signs. Frame 10 (27 s): bold white X.\n\n## Statements\n1. \"In marketing, everyone knows the 4P model.\"\n2. \"Product, price, place, and promotion.\"\n3. \"But branding works on a different model.\"\n4. \"The 1P model.\"\n5. \"The only P branding is about is perception.\"\n6. \"And perception is the sum of every impression people get from your business.\"\n7. \"The way your product looks, the way your message sounds, the way your brand makes them feel.\"\n8. \"It's not the price or the product itself that matters at all.\"\n9. \"It's the meaning people attach to each and every interaction with you.\"\n10. \"This is why in branding, perception becomes reality.\"\n\n## Assessment\n1. **usable** – Claim, unverified; 'everyone'.\n2. **usable** – Named model, generally known.\n3. **usable** – No checkpoint touched.\n4. **usable** – Term used by the creator.\n5. **usable** – Claim, unverified.\n6. **usable** – No checkpoint touched.\n7. **usable** – No checkpoint touched.\n8. **usable** – Claim, unverified; 'at all' is absolute.\n9. **usable** – No checkpoint touched.\n10. **conditional** – Usable as description; not as license for misrepresentation (ghish). Claim, unverified.\n\n## Links\n- [[03-your-brand-is-the-feeling-not-the-logo]] – same claim: brand is what people think and feel\n- [[18-halo-effect]] – same claim: product defined by perception, not reality\n- [[07-marketing-and-branding-are-yin-and-yang]] – related: marketing vs branding distinction\n- [[22-price-is-never-the-problem]] – related: price is not the problem when value is understood\n- [[33-people-buy-the-product-they-like-best]] – contradicts in part: 33 says people care about the product when they understand the outcome\n- [[brand-perception]]\n- [[marketing-vs-branding]]\n"}, {"id": "21-people-want-to-stop-losing", "kind": "station", "title": "21 – People don't want to gain, they want to stop losing", "path": "stationen/21-people-want-to-stop-losing.md", "text": "---\nid: 21\nsource: quellen/videos/21 (v26044gc0000d700v7fog65lj4el5dug.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.66\nduration_video_s: 33.70\nconcepts: [cost-of-inaction, loss-aversion, pain-of-the-problem]\n---\n# 21 – People don't want to gain, they want to stop losing\n## Verbatim\n```text\n[00:00.00 - 00:03.66] As a business, you need to understand, people don't want to gain something.\n[00:04.08 - 00:05.26] They want to stop losing.\n[00:05.92 - 00:11.52] The fear of losing $100 is twice as powerful as the joy of gaining $100.\n[00:12.42 - 00:13.28] This is not a theory.\n[00:13.78 - 00:15.44] It's simply how our brain works.\n[00:15.60 - 00:20.14] So if your business only shows what people can get, you're missing half the equation.\n[00:20.80 - 00:24.04] Show them what they are already losing by not acting.\n[00:24.52 - 00:28.04] Because the pain of standing still is the most underused trigger in marketing.\n[00:28.56 - 00:29.66] Because...\n[00:29.66 - 00:30.66] ...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with 'Because...' (28.56-29.66 s) followed by a line '...' (29.66-30.66 s); no speech in the second entry. File length 33.70 s.\n\n## Visuals\n- Frame 3 (6 s): circle with a zigzag inside and a small circle with a \"\\$100\" speech bubble. Frame 4 (9 s): circle with a zigzag, a smiley face and a \"\\$100\" speech bubble with a down arrow. Frame 7 (18 s): ring split in half with \"+\" signs on the right half; frame 8 (21 s): ring with \"-\" signs on the left half.\n\n## Statements\n1. \"As a business, you need to understand, people don't want to gain something.\"\n2. \"They want to stop losing.\"\n3. \"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n4. \"This is not a theory.\"\n5. \"It's simply how our brain works.\"\n6. \"So if your business only shows what people can get, you're missing half the equation.\"\n7. \"Show them what they are already losing by not acting.\"\n8. \"Because the pain of standing still is the most underused trigger in marketing.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified: no study, author or year named; the factor 'twice' is not sourced.\n4. **usable** – Assertion without support;
