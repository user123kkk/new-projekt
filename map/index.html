- 01:09.54] It's about understanding why money moves,\n[01:09.74 - 01:12.94] and building something that gives it a reason to move toward you.\n[01:12.94 - 01:31.06] There is an interesting part.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The audio ends at 72.94 s (\"...a reason to move toward you.\"). The transcript then has a last line \"There is an interesting part.\" with timestamps 01:12.94 - 01:31.06 (72.94 s to 91.06 s). The file is only 78.53 s long and the frames after 72 s show only the end card (75 s). This line is a Whisper artifact (no matching speech or text); it is not taken as a statement. The front-matter `duration_s` is the last transcript timestamp as specified; the real length is `duration_video_s`.\n- On-screen numbers are never spoken in the audio: \"THE GOAL $159,400\" (6 s), \"$1,000,000\" on an iceberg (9 s), \"$0\" on a device (12 s), \"$49 SOLUTION\" (36 s), \"VALUE 15%\" / \"VALUE 100%\" (48 s). Their meaning is [unclear]; no source or context is given. They are rated separately below (V1 to V6).\n- Spoken \"saving time, reducing uncertainty, or solving a problem\" / On-screen at 33-36 s: CONVENIENCE, TIME SAVED, CERTAINTY, PROBLEM SOLVED. The on-screen labels are nouns for the same four reasons; \"convenience\" is spoken before them. Wording differs slightly, no contradiction.\n- Spoken \"what people want, what frustrates them, and what they're willing to pay for\" / On-screen at 57-60 s: WANTS, FRUSTRATIONS, WILLING TO PAY. Same content.\n- Spoken \"a reason to spend their money\" / On-screen at 27-30 s: \"A REASON\", \"REASON\". Same content.\n- The frame at 15 s and the frame at 54 s are nearly black (transitions). No text lost.\n\n## Visuals\n- Frame 1 (0 s): person pictogram chasing a glowing dollar coin. Frame 2 (3 s): blueprint-style coin with question marks, caption \"HOW IS IT MADE?\". Frame 3 (6 s): \"THE GOAL $159,400\" over nine person pictograms. Frame 4 (9 s): iceberg tip with \"$1,000,000\". Frame 5 (12 s): device with \"$0\". Frame 7 (18 s): balance scale PRICE (coin) against VALUE (gift box), tilting to VALUE.\n- Frames 10-13 (27 s to 36 s): building with \"A REASON\", then REASON linked to CONVENIENCE, TIME SAVED, PROBLEM SOLVED, CERTAINTY; \"$49 SOLUTION\". Frames 14-17 (39 s to 48 s): gears (COMPLEX) against a paper clip (SIMPLE), EFFORT 0%, VALUE 0%, then VALUE 15% against 100% with OUTCOME and a BUYER. Frame 18 (51 s): \"HUMAN BEHAVIOR\" with many pictograms. Frames 20-21 (57 s, 60 s): WANTS, FRUSTRATIONS, WILLING TO PAY as overlapping circles. Frame 22 (63 s): \"WEALTH\". Frames 23-25 (66 s to 72 s): flow lines funnel into a stack of squares labelled \"YOU\".\n- Faceless person pictograms appear in frames 1, 3, 10, 17, 18, 20, 25. Whether pictograms count as \"drawings of living beings\" under GRUNDSATZ rule 9 is not settled by the rule text; it is a question for the owner.\n- Format: landscape 16:9, white outline icons with glow on black, no photos, one idea per scene (about 3 s per scene), TikTok watermark and end card with search bar \"@ cryothum\". No on-screen caption of the spoken sentences: the pictures illustrate, the voice carries the text.\n\n## Statements\n1. \"The more you chase money, the harder it becomes to understand how it's made.\"\n2. \"Most people who want to become rich spend their time thinking about how much money they want to earn, instead of understanding what actually makes money valuable.\"\n3. \"Because money doesn't appear simply because someone wants it.\"\n4. \"It changes hands when people believe they're receiving something worth paying for.\"\n5. \"And understanding this completely changes the way you look at the world.\"\n6. \"Every successful business exists because it gives customers a reason to spend their money.\"\n7. \"Sometimes that reason is convenience.\"\n8. \"Sometimes it's saving time, reducing uncertainty, or solving a problem that would otherwise cost much more.\"\n9. \"And the interesting part is that the value of a solution isn't necessarily determined by how difficult it is to create.\"\n10. \"It's determined by how valuable the outcome is to the person paying for it.\"\n11. \"This is why understanding human behavior can become such a powerful advantage in business.\"\n12. \"The better you understand what people want, what frustrates them, and what they're willing to pay for, the easier it becomes to recognize opportunities.\"\n13. \"Because becoming wealthy isn't just about wanting more money.\"\n14. \"It's about understanding why money moves,\"\n15. \"and building something that gives it a reason to move toward you.\"\n\nOn-screen statements without a spoken counterpart (rated separately):\n- V1. \"THE GOAL / \\$159,400\" (nine person pictograms) – 6 s\n- V2. \"\\$1,000,000\" on an iceberg tip – 9 s\n- V3. \"\\$0\" on a device – 12 s\n- V4. Scale \"PRICE\" against \"VALUE\", tilted to VALUE – 18 s\n- V5. \"\\$49 / SOLUTION\" – 36 s\n- V6. \"COMPLEX: EFFORT 0%, VALUE 0%, later VALUE 15%\" against \"SIMPLE: VALUE 100%\" – 42 s to 48 s\n\n## Assessment\n1. **usable** – Claim, unverified; absolute tendency (\"the harder\").\n2. **usable** – Claim, unverified (\"Most people\"). Wanting to become rich is described, not recommended; GRUNDSATZ has no rule on wealth as a goal, so whether it is adopted as the aim of the project is for the owner.\n3. **usable** – Claim, unverified.\n4. **conditional** – Required change: the belief must rest on true information and the thing must be worth what is paid (rules 1, 5, ghish); a belief produced by exaggeration or concealment is deception. The product must be permissible (rule 15; order of authority 1).\n5. **usable** – Claim, unverified; hyperbole (\"completely\").\n6. **usable** – Claim, unverified (\"Every\"). Matches [[14-sell-water-to-the-thirsty]]: customers pay where there is a reason.\n7. **usable** – Claim, unverified.\n8. **conditional** – Convenience, time saved, less uncertainty and a solved problem are usable as reasons. Required change: \"would otherwise cost much more\" is a claim about the customer's avoided cost; it must be true and demonstrable (rules 1, 5).\n9. **usable** – Claim, unverified. It does not license a price unrelated to real value; see [[22-price-is-never-the-problem]].\n10. **conditional** – Usable as a principle. Required change: the outcome must really be delivered; no outcome promised that cannot be shown (rules 1, 5), and the price must not exceed the real value (see 22, statements 6 and 7).\n11. **conditional** – Required change: understanding human behaviour is used to serve the customer and describe the product truthfully, not to move a person against their own interest (rule 7).\n12. **conditional** – Wants, frustrations and willingness to pay are usable as market research (compare K1 in IDEEN.md). Required change: do not exploit acute distress; a religious obligation is not treated as a market gap (rule 11); the product must be permissible (rule 15).\n13. **usable** – Claim, unverified. Opinion about motive.\n14. **usable** – Claim, unverified; metaphor (\"money moves\").\n15. **conditional** – Required change: \"a reason to move toward you\" must be a true reason, meaning real value; no invented reasons, price anchors or scarcity (rules 1, 4).\n\nV1. **not usable** – A goal figure with no context, source or stated meaning ([unclear]); nine pictograms suggest a split across people but nothing is said. Not adopted as data or as a target (rule 1: no unsupported claims).\nV2. **not usable** – A million-dollar figure on an iceberg tip without context or source. Not adopted; it works as an unproven wealth promise if reused (rules 1, 5).\nV3. **not usable** – \"$0\" device, meaning [unclear]. Nothing to adopt.\nV4. **usable** – The picture of price against value matches [[22-price-is-never-the-problem]]; no claim of fact.\nV5. **conditional** – \"$49 solution\" is an illustration of a price; usable only as a labelled example. If a real price is shown it must be the real price (rule 4).\nV6. **not usable** – Percentages (0%, 15%, 100%) look like measurements but have no source; they must not be shown as data. Usable only as a symbolic picture (complex versus simple) if no numbers are presented as results (rules 1, 5).\n\nCounts, spoken statements (1 to 15): usable 9 (1, 2, 3, 5, 6, 7, 9, 13, 14), conditional 6 (4, 8, 10, 11, 12, 15), not usable 0.\nCounts, on-screen items (V1 to V6): usable 1 (V4), conditional 1 (V5), not usable 4 (V1, V2, V3, V6).\n\n## Links\n- [[22-price-is-never-the-problem]] – same mechanism: value as the customer perceives it decides, not price; 50 adds \"not by effort of creation\" and \"determined by the outcome\"\n- [[14-sell-water-to-the-thirsty]] – same mechanism: money moves where there is an existing reason; 50 states it generally, 14 gives the action (go where the problem is painful)\n- [[02-sell-the-after-not-the-what]] – same mechanism: the outcome is what the buyer pays for\n- [[28-same-wine-different-price-experience]] – related: value is what the buyer experiences, not the cost to make\n- [[11-you-sell-emotions-not-the-product]] – related: perceived value against perceived cost\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – related: understanding what frustrates people\n- [[51-you-dont-need-to-invent-to-become-rich]] – same theme and creator: 51 turns the principle into a way of choosing what to build\n- [[perceived-value]]\n- [[desired-outcome]]\n- [[customer-understanding]]\n- [[existing-demand]]\n"}, {"id": "51-you-dont-need-to-invent-to-become-rich", "kind": "station", "title": "51 – You don't need to invent something to become rich: make what already sells slightly better", "path": "stationen/51-you-dont-need-to-invent-to-become-rich.md", "text": "---\nid: 51\nsource: quellen/videos/51 (v26044gc0000dbeue9nog65ujf1gm370.mp4)\ncreator: \"@cryothum\"\nduration_s: 95.08\nduration_video_s: 73.43\nconcepts: [existing-demand, improve-existing-offer, trust, traffic-vs-conversion-problem]\n---\n# 51 – You don't need to invent something to become rich: make what already sells slightly better\n## Verbatim\n```text\n[00:00.00 - 00:02.88] You don't need to invent something to become rich.\n[00:02.88 - 00:06.64] Think about how many people want to start a business but never do,\n[00:06.64 - 00:11.32] simply because they can't come up with an idea that nobody has ever thought of before.\n[00:11.32 - 00:13.84] But here's what most people don't understand.\n[00:13.84 - 00:16.72] You don't need to create something completely new.\n[00:16.72 - 00:21.16] You can take something that already works and make it just 5% better.\n[00:21.16 - 00:25.36] Imagine a company selling a product that thousands of people already buy.\n[00:25.36 - 00:28.52] Instead of trying to invent a completely different product,\n[00:28.52 - 00:30.56] look at what customers complain about.\n[00:30.56 - 00:34.20] Maybe the product is too expensive, the delivery takes too long,\n[00:34.20 - 00:36.80] or the customer experience is terrible.\n[00:36.80 - 00:40.56] If you can solve even one of those problems better than the competition,\n[00:40.56 - 00:43.44] you've already given people a reason to choose you.\n[00:43.44 - 00:47.28] And the best part is that you don't have to guess whether people want the product,\n[00:47.28 - 00:49.60] because they're already spending money on it.\n[00:49.60 - 00:53.32] Of course, being slightly better doesn't guarantee success.\n[00:53.32 - 00:56.44] People still need to discover and trust your business.\n[00:56.44 - 00:57.68] But that's the point.\n[00:57.68 - 01:01.36] You don't always need to create a new market to become successful.\n[01:01.36 - 01:05.72] Sometimes the biggest opportunity is taking something people already want\n[01:05.72 - 01:09.32] and giving them a better reason to buy it from you.\n[01:09.32 - 01:13.00] The truth of the goal in my client is failing.\n[01:13.00 - 01:15.26] I refuse to bonging, too many people that make my money,\n[01:15.26 - 01:17.42] they don't trust them.\n[01:17.42 - 01:21.80] I've got this without a principalmente because I've been having kümmery butahan.\n[01:21.80 - 01:23.04] They don't have a lot of money.\n[01:23.04 - 01:23.36] Why do I grow it?\n[01:23.36 - 01:25.00] I don'tknow the answer to that.\n[01:25.00 - 01:26.44] But it gets some questions today,\n[01:26.44 - 01:29.40] you can think it goes back to the customers,\n[01:29.40 - 01:30.00] when it goes back to the consumers,\n[01:30.00 - 01:30.48] so try me to double buy it from your new market.\n[01:30.48 - 01:35.08] Maybe it's siihen again thathots can also only be a buyer Lyme,\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The audio ends at 69.32 s (\"...a better reason to buy it from you.\"); the frame at 69 s is the end card. From 69.32 s the transcript contains garbled, multilingual text (\"The truth of the goal in my client is failing.\", \"I refuse to bonging, too many people that make my money,\", \"kümmery butahan\", \"siihen again thathots can also only be a buyer Lyme,\" and similar) up to the timestamp 01:35.08 (95.08 s). The file is only 73.43 s long, so timestamps after 73.43 s lie outside the file. These lines are not coherent speech and have no on-screen counterpart; they are a Whisper artifact (the sound after 69.3 s cannot be checked by me, I cannot hear audio; the pattern is typical for noise or music). Nothing in this block is a statement and nothing from it is adopted.\n- The `duration_s` in the front matter is the last transcript timestamp as specified; the real length is `duration_video_s`.\n- On-screen figures are never spoken: \"$49\", \"+5%\", \"100%\" and \"105%\", \"12,480 people already buy\" (24 s and 27 s), \"7 days\" and \"1 day\", one star and five stars. Rated separately below (V1 to V5). The spoken \"5% better\" matches the on-screen \"+5%\" and \"105%\".\n- Spoken \"too expensive, the delivery takes too long, or the customer experience is terrible\" / On-screen at 33-36 s: \"$$$\", \"7 days\", one star with a sad face. Same three complaints as pictures; the numbers \"7 days\" and \"one star\" are the video's own illustration.\n- Spoken \"People still need to discover and trust your business\" / On-screen at 54-57 s: magnifier over the card, shield with a check mark, two stars then five stars. The five stars show a good outcome that the audio does not state.\n- Spoken \"your business\" / On-screen: the card is labelled \"you\".\n- The line spoken at 49.60-53.32 s (\"Of course, being slightly better doesn't guarantee success.\") has no visible counterpart in the sampled frames.\n\n## Visuals\n- Frame 1 (0 s): product card with a box icon and \"$49\". Frame 2 (3 s): 3 x 6 grid of person pictograms, each with a speech bubble holding a small shop icon; frames 3-4 (6 s, 9 s): grid dimmed, bubbles then show crossed-out light bulbs. Frame 7 (18 s): two cards, \"works\" at 100% and a copy \"+5%\" at 105%. Frame 9 (24 s): \"12,480 people already buy\" next to a shop card with $49. Frame 11 (30 s): speech bubbles with \"!\" among dots. Frames 12-13 (33 s, 36 s): \"$$$\", \"7 days\", one star with a sad face. Frame 14 (39 s): \"1 day\" with a check mark, second card \"you\" with \"+5%\". Frame 16 (45 s): question mark crossed out. Frame 17 (48 s): dots turn into dollar coins flowing to \"you\". Frame 19 (54 s): magnifier over \"you\", shield, two stars. Frame 20 (57 s): five stars. Frame 21 (60 s): large circle \"existing market\", a small crossed-out dashed circle \"new market\".\n- Faceless person pictograms appear in frames 2-4 only (a grid of 18); later the crowd is shown as dots. Whether pictograms count as \"drawings of living beings\" under GRUNDSATZ rule 9 is not settled by the rule text; it is a question for the owner.\n- Format: landscape 16:9, white outline icons on black, no photos, one idea per scene, a single recurring product card that the story keeps changing (copy, +5%, \"you\"), TikTok watermark, end card with search bar \"@ cryothum\". Roughly 73 s with about 22 speech segments.\n\n## Statements\n1. \"You don't need to invent something to become rich.\"\n2. \"Think about how many people want to start a business but never do, simply because they can't come up with an idea that nobody has ever thought of before.\"\n3. \"But here's what most people don't understand.\"\n4. \"You don't need to create something completely new.\"\n5. \"You can take something that already works and make it just 5% better.\"\n6. \"Imagine a company selling a product that thousands of people already buy.\"\n7. \"Instead of trying to invent a completely different product, look at what customers complain about.\"\n8. \"Maybe the product is too expensive, the delivery takes too long, or the customer experience is terrible.\"\n9. \"If you can solve even one of those problems better than the competition, you've already given people a reason to choose you.\"\n10. \"And the best part is that you don't have to guess whether people want the product, because they're already spending money on it.\"\n11. \"Of course, being slightly better doesn't guarantee success.\"\n12. \"People still need to discover and trust your business.\"\n13. \"But that's the point.\"\n14. \"You don't always need to create a new market to become successful.\"\n15. \"Sometimes the biggest opportunity is taking something people already want and giving them a better reason to buy it from you.\"\n\nOn-screen statements without a spoken counterpart (rated separately):\n- V1. \"12,480 people already buy\" (next to a shop card at \\$49) – 24 s and 27 s\n- V2. \"+5%\" / \"100%\" / \"105%\" on two product cards – 18 s and later\n- V3. \"7 days\" against \"1 day\" (delivery) – 33 s to 42 s\n- V4. Five stars under the card \"you\" after a shield with a check mark – 57 s onward\n- V5. \"\\$49\" on every card\n\n## Assessment\n1. **conditional** – The core (inventing something is not required) is usable. Required change: in own content do not promise that anything leads to riches (rules 1, 5). Whether becoming rich is adopted as a goal is not covered by a GRUNDSATZ rule; it is for the owner. Claim, unverified.\n2. **usable** – Claim, unverified: no data on why people do not start a business. Usable as a description of a belief.\n3. **usable** – Connective.\n4. **usable** – Claim, unverified. Core of the video; compare [[04-there-is-no-winning-product]] (K6 in IDEEN.md: the product does not need to be unique).\n5. **conditional** – Strategy usable. Required change: \"5% better\" is an invented measure; any \"better\" claim about our product needs a defined, checkable improvement and proof (rule 5), for example a stated delivery time or a stated price. Copying the protected work of another company (name, design, text) is a separate legal question; no GRUNDSATZ rule covers it.\n6. **usable** – Hypothetical.\n7. **usable** – Method: read real customer complaints instead of guessing; matches [[14-sell-water-to-the-thirsty]] statement 2 and the demand search in NACHFRAGE.md. No checkpoint touched.\n8. **usable** – Examples of complaints (\"Maybe\"); hypothetical.\n9. **conditional** – Required change: \"better than the competition\" is a comparative claim and needs proof (rule 5); no fake or misleading comparison (rule 4, najsh; see 26 statement 8); other known weaknesses of the offer are not hidden (rule 1). Solving one problem is a reason to choose, not a guarantee.\n10. **conditional** – Existing spending shows demand for the existing product, not for our version. Required change: it is not proof of demand for our offer; \"you don't have to guess\" is too absolute (rule 1: no claim without basis). The product must be permissible (rule 15; order of authority 1) and not a religious obligation sold as a gap (rule 11).\n11. **usable** – Honest limit on the previous claims; supports rule 1 (no promise of success).\n12. **usable** – Claim, unverified; points to traffic and trust (see 32 and 15).\n13. **usable** – Connective.\n14. **usable** – Claim, unverified.\n15. **conditional** – Required change: the \"better reason\" must be a real reason (a real improvement), not a manufactured one (rules 1, 4); what is taken must be something people want that is permissible (rule 15).\n\nV1. **not usable** – The number is invented for the picture and has no source. In own content it would be a false user number (rule 1). Usable only if clearly labelled as an example, better left out.\nV2. **conditional** – Illustration of a slight improvement. Required change: a \"+5%\" or \"105%\" that is shown must be a measured improvement of something named (rule 5).\nV3. **conditional** – The shift from \"7 days\" to \"1 day\" is an illustrated improvement. Usable only for a delivery time we really keep (rules 1, 5).\nV4. **conditional** – Five stars show a result of earning trust. Usable only with real reviews; never as a promised outcome (rules 1, 5).\nV5. **usable** – Illustrative price, same on all cards; makes no claim.\n\nCounts, spoken statements (1 to 15): usable 10 (2, 3, 4, 6, 7, 8, 11, 12, 13, 14), conditional 5 (1, 5, 9, 10, 15), not usable 0.\nCounts, on-screen items (V1 to V5): usable 1 (V5), conditional 3 (V2, V3, V4), not usable 1 (V1).\n\n## Links\n- [[14-sell-water-to-the-thirsty]] – near duplicate in substance (demand already exists, do not create it); 51 adds: look at what customers complain about, make it \"5% better\", and the caveat that slightly better does not guarantee success\n- [[04-there-is-no-winning-product]] – related: a boring or existing product can win; the difference is marketing and branding\n- [[50-understand-why-money-moves]] – same creator and theme: value and reasons to buy; 51 gives the way to choose what to build\n- [[32-conversion-problem-or-traffic-problem]] – related: \"People still need to discover and trust your business\" is the traffic and conversion problem in one sentence\n- [[15-three-questions-every-customer-asks]] – related: \"can I trust it\"\n- [[16-illusion-of-innovation]] – contrast: 16 sells the feeling of something new; 51 says do not create something new, improve what exists\n- [[19-sell-to-everyone-sell-to-no-one]] – related: after improving an existing offer the group still has to be chosen\n- [[existing-demand]]\n- [[improve-existing-offer]]\n- [[trust]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "attention", "kind": "concept", "title": "Attention", "path": "begriffe/attention.md", "text": "---\nconcept: attention\nkind: psychological mechanism\n---\n# Attention\nKind: psychological mechanism\n\n## Definition\n\"It is gained because the brain understands immediately why it should care.\" (24). Merged: relevance (24).\n\nNote: 24 and 30 differ on order (understanding first vs attention first). The comment keyword 'attention' is a separate concept: call-to-action-dm-comment.\n\n## Used in\n- [[07-marketing-and-branding-are-yin-and-yang]] – \"marketing gets attention\"\n- [[24-attention-comes-from-clarity-not-frequency]] – \"It is gained because the brain understands immediately why it should care.\"\n- [[30-content-fails-in-the-first-seconds]] – \"You gain attention first in order to build understanding later on.\"\n- [[39-people-scan-they-dont-read]] – \"people don't read, they scan\"\n- [[47-people-dont-read-they-scan]] – duplicate of 39 (same script, dark remake): \"people don't read, they scan\"\n\n## Related concepts\n- [[clarity]]\n- [[first-seconds-hook]]\n- [[marketing-vs-branding]]\n- [[social-media-content]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "awareness-stages", "kind": "concept", "title": "Awareness stages", "path": "begriffe/awareness-stages.md", "text": "---\nconcept: awareness-stages\nkind: framework\n---\n# Awareness stages\nKind: framework\n\n## Definition\n\"The famous marketer Eugene Schwartz talks about the four major ones, unaware, problem aware, solution aware, and product aware. And each stage requires different types of content.\" (40)\n\nNote: Attribution and number of stages unverified; the model is commonly described with five stages (plus 'most aware'). Check the source before naming it.\n\n## Used in\n- [[40-four-buying-stages-schwartz]] – \"you need to know what buying stage your audience is in\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[existing-demand]]\n- [[buyer-questions]]\n- [[pain-of-the-problem]]\n"}, {"id": "brand-consistency", "kind": "concept", "title": "Brand consistency", "path": "begriffe/brand-consistency.md", "text": "---\nconcept: brand-consistency\nkind: brand concept\n---\n# Brand consistency\nKind: brand concept\n\n## Definition\n\"When your brand is clear and consistent, price stops being the only factor.\" Includes touch points (03) and 'make everything look premium' (18).\n\nNote: 'Premium' appearance must match real quality.\n\n## Used in\n- [[03-your-brand-is-the-feeling-not-the-logo]] – \"you build your brand with every action every touch point and every emotion you trigger\"\n- [[09-branding-is-for-any-company]] – \"When your brand is clear and consistent, price stops being the only factor.\"\n- [[18-halo-effect]] – \"So if you want to be seen as premium, make everything look premium.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[halo-effect]]\n"}, {"id": "brand-perception", "kind": "concept", "title": "Brand perception", "path": "begriffe/brand-perception.md", "text": "---\nconcept: brand-perception\nkind: brand concept\n---\n# Brand perception\nKind: brand concept\n\n## Definition\n\"your brand is about what people think and feel about you\" (03); \"The only P branding is about is perception.\" (20). Merged synonyms: perception, brand feeling, overall presence (31).\n\nNote: Rated conditional where 'perception over reality' is read as permission to misrepresent.\n\n## Used in\n- [[03-your-brand-is-the-feeling-not-the-logo]] – \"your brand is about what people think and feel about you\"\n- [[09-branding-is-for-any-company]] – \"It's how people feel about you before they have even tried your product.\"\n- [[18-halo-effect]] – \"your product is defined by perception, not reality\"\n- [[20-branding-is-the-1p-model-perception]] – \"The only P branding is about is perception.\"\n- [[31-best-product-with-bad-branding-loses]] – \"It is the feeling that your overall presence creates.\"\n- [[46-selling-versus-storytelling]] – \"It makes your brand something people care for, not just buy from.\"\n\n## Related concepts\n- [[brand-consistency]]\n- [[halo-effect]]\n- [[memorability]]\n- [[marketing-vs-branding]]\n- [[product-vs-branding]]\n- [[perceived-value]]\n"}, {"id": "bundle-pricing", "kind": "concept", "title": "Bundle pricing", "path": "begriffe/bundle-pricing.md", "text": "---\nconcept: bundle-pricing\nkind: tactic\n---\n# Bundle pricing\nKind: tactic\n\n## Definition\n\"Instead of selling one bag and one watch for $49, say buy a bag for $49 and get a new watch for free. The second option feels like a better deal.\" (38)\n\nNote: Not usable as shown: the same total price with the main item relabelled and the second item called 'free' is a false 'free' and an artificial anchor (rules 1, 4). A bundle is allowed when it is really cheaper than the single prices and the single prices are shown.\n\n## Used in\n- [[38-framing-bundle-pricing-scarcity]] – \"buy a bag for $49 and get a new watch for free\"\n\n## Related concepts\n- [[framing-effect]]\n- [[contrast-effect]]\n- [[perceived-value]]\n- [[pain-of-paying]]\n"}, {"id": "buyer-questions", "kind": "concept", "title": "Buyer questions", "path": "begriffe/buyer-questions.md", "text": "---\nconcept: buyer-questions\nkind: framework\n---\n# Buyer questions\nKind: framework\n\n## Definition\n\"what is this, will it help me, and can I trust it?\"\n\nNote: Claim, unverified that these are the only three.\n\n## Used in\n- [[15-three-questions-every-customer-asks]] – \"what is this, will it help me, and can I trust it?\"\n\n## Related concepts\n- [[clarity]]\n- [[trust]]\n- [[feeling-understood]]\n"}, {"id": "call-to-action-dm-comment", "kind": "concept", "title": "Call to action dm comment", "path": "begriffe/call-to-action-dm-comment.md", "text": "---\nconcept: call-to-action-dm-comment\nkind: channel / tactic\n---\n# Call to action dm comment\nKind: channel / tactic\n\n## Definition\nCalls to action that ask the viewer to message or comment: \"DM me\" (05, 10, 13), \"Comment the word attention\" (24, 25, 27, 30). Merged: DM call to action, comment-keyword call to action.\n\nNote: The keyword 'attention' in these calls is not the concept attention.\n\n## Used in\n- [[05-study-what-works-particl]] – \"DM me Particle for a 14-day free trial\"\n- [[10-the-five-year-old-rule]] – \"DM me to turn your message into a story anyone can get and love.\"\n- [[13-animations-that-turn-your-message-into-a-story]] – \"DM to get started.\"\n- [[24-attention-comes-from-clarity-not-frequency]] – \"Comment the word attention if you want me to share a short training on how attention really works.\"\n- [[25-emotional-content-is-remembered]] – \"Comment the word attention if you want to learn how you make your content connect emotionally.\"\n- [[27-the-more-people-think-the-less-they-trust]] – \"Comment the word attention to learn how to design for clarity.\"\n- [[30-content-fails-in-the-first-seconds]] – \"Comment the word attention if you want to learn why content fails and why it works.\"\n- [[48-the-so-you-can-method]] – \"drop the best one in the comments\"\n\n## Related concepts\n- [[free-trial]]\n- [[social-media-content]]\n- [[storytelling]]\n"}, {"id": "certainty-over-risk", "kind": "concept", "title": "Certainty over risk", "path": "begriffe/certainty-over-risk.md", "text": "---\nconcept: certainty-over-risk\nkind: psychological mechanism\n---\n# Certainty over risk\nKind: psychological mechanism\n\n## Definition\n\"And people don't buy risk. They buy certainty.\"\n\nNote: Matches the gharar checkpoint.\n\n## Used in\n- [[27-the-more-people-think-the-less-they-trust]] – \"And people don't buy risk. They buy certainty.\"\n\n## Related concepts\n- [[clarity]]\n- [[trust]]\n- [[guarantee]]\n- [[feeling-understood]]\n"}, {"id": "clarity", "kind": "concept", "title": "Clarity", "path": "begriffe/clarity.md", "text": "---\nconcept: clarity\nkind: tactic\n---\n# Clarity\nKind: tactic\n\n## Definition\n\"This is why the clearest message always wins.\" Merged: five-year-old rule (10), simple (34), understandable (15).\n\nNote: Contradicted by 16 (complexity for curiosity) and partly by 08.\n\n## Used in\n- [[10-the-five-year-old-rule]] – \"If a five-year-old can't understand what you do, most adults won't either.\"\n- [[13-animations-that-turn-your-message-into-a-story]] – \"They simplify, clarify, and connect.\"\n- [[15-three-questions-every-customer-asks]] – \"fast and understandable\"\n- [[24-attention-comes-from-clarity-not-frequency]] – \"Clarity is what creates relevance.\"\n- [[27-the-more-people-think-the-less-they-trust]] – \"This is why the clearest message always wins.\"\n- [[34-one-message-one-offer-one-action]] – \"Because the more options, the more confusion.\"\n- [[39-people-scan-they-dont-read]] – \"make it scannable\"\n- [[47-people-dont-read-they-scan]] – duplicate of 39 (same script, dark remake): \"Therefore, while building a website, make it scannable.\"\n\n## Related concepts\n- [[certainty-over-risk]]\n- [[attention]]\n- [[single-message-focus]]\n- [[trust]]\n- [[illusion-of-innovation]]\n- [[zagarnik-effect]]\n"}, {"id": "common-enemy-effect", "kind": "concept", "title": "Common enemy effect", "path": "begriffe/common-enemy-effect.md", "text": "---\nconcept: common-enemy-effect\nkind: psychological mechanism\n---\n# Common enemy effect\nKind: psychological mechanism\n\n## Definition\n\"when we share a common enemy with someone, we feel a stronger bond with them.\" (43). Applied to brands: the brand names what its customers dislike and stands against it.\n\nNote: Conditional. The \"enemy\" may only be a problem, a condition or an idea, never a person or a group (order of authority 1); no invented threat (rule 1); stated openly (rules 6, 7).\n\n## Used in\n- [[43-the-enemy-effect-builds-loyalty]] – \"It means when we share a common enemy with someone, we feel a stronger bond with them.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[customer-understanding]]\n- [[named-brands]]\n- [[covert-influence]]\n- [[loss-aversion]]\n"}, {"id": "competitor-research", "kind": "concept", "title": "Competitor research", "path": "begriffe/competitor-research.md", "text": "---\nconcept: competitor-research\nkind: tactic\n---\n# Competitor research\nKind: tactic\n\n## Definition\n\"They study what works.\"\n\nNote: Tool promotion in 05.\n\n## Used in\n- [[05-study-what-works-particl]] – \"They study what works.\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[named-brands]]\n"}, {"id": "confirmation-bias", "kind": "concept", "title": "Confirmation bias", "path": "begriffe/confirmation-bias.md", "text": "---\nconcept: confirmation-bias\nkind: psychological mechanism\n---\n# Confirmation bias\nKind: psychological mechanism\n\n## Definition\n\"Confirmation bias is a phenomenon in which people seek information that confirms their already existing beliefs or preferences.\"\n\nNote: Rated: aim 'manipulate' not usable; method conditional.\n\n## Used in\n- [[36-confirmation-bias-say-what-people-already-think]] – \"Confirmation bias is a phenomenon in which people seek information that confirms their already existing beliefs or preferences.\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[social-proof]]\n- [[covert-influence]]\n- [[feeling-understood]]\n"}, {"id": "contrast-effect", "kind": "concept", "title": "Contrast effect", "path": "begriffe/contrast-effect.md", "text": "---\nconcept: contrast-effect\nkind: psychological mechanism\n---\n# Contrast effect\nKind: psychological mechanism\n\n## Definition\n\"Your brain can't judge value in isolation.\" Includes price anchoring: \"salespeople anchor prices high before showing you the real offer.\"\n\nNote: Anchor must be a real price (najsh). The wine example is alcohol and not reusable.\n\n## Used in\n- [[26-use-the-power-of-contrast]] – \"Your brain can't judge value in isolation.\"\n\n## Related concepts\n- [[perceived-value]]\n- [[covert-influence]]\n"}, {"id": "cost-of-inaction", "kind": "concept", "title": "Cost of inaction", "path": "begriffe/cost-of-inaction.md", "text": "---\nconcept: cost-of-inaction\nkind: tactic\n---\n# Cost of inaction\nKind: tactic\n\n## Definition\nShow the customer what they lose by not acting; \"To each goal, there is also an anti-goal.\" Merged synonyms: anti-goal (11), pain of standing still (21).\n\nNote: Rated conditional in 11 and 21: only real losses may be shown.\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"To each goal, there is also an anti-goal.\"\n- [[21-people-want-to-stop-losing]] – \"Show them what they are already losing by not acting.\"\n\n## Related concepts\n- [[loss-aversion]]\n- [[fear-of-missing-out]]\n- [[pain-of-the-problem]]\n- [[desired-outcome]]\n"}, {"id": "covert-influence", "kind": "concept", "title": "Covert influence", "path": "begriffe/covert-influence.md", "text": "---\nconcept: covert-influence\nkind: flag concept\n---\n# Covert influence\nKind: flag concept\n\n## Definition\nTechniques described as working without the customer's awareness, e.g. \"without them ever realizing it\" (06), \"subconsciously\" (12), \"manipulate your customers\" (36). Created to collect statements that touch the deception checkpoint (ghish).\n\nNote: This page is an assessment aid, not a term from the sources. It includes 26's denial: 'This isn't manipulation.'\n\n## Used in\n- [[06-priming-makes-people-buy-without-a-word]] – \"without them ever realizing it\"\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"Because people buy the emotion they want to feel subconsciously.\"\n- [[26-use-the-power-of-contrast]] – \"This isn't manipulation.\"\n- [[29-sell-the-instant-benefit]] – \"make tomorrow's benefits appear today\"\n- [[35-make-them-feel-they-found-it]] – \"Make them feel like they found it.\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"to easily manipulate your customers\"\n- [[37-sell-the-problem-first]] – \"This is how you will make people feel dumb saying no to your product.\"\n- [[43-the-enemy-effect-builds-loyalty]] – \"every cult brand is using this trick to make customers loyal to them\"\n- [[48-the-so-you-can-method]] – \"make people feel dumb saying no to your product\"\n\n## Related concepts\n- [[priming]]\n- [[emotional-contagion]]\n- [[confirmation-bias]]\n- [[own-idea-feeling]]\n- [[contrast-effect]]\n"}, {"id": "customer-as-hero", "kind": "concept", "title": "Customer as hero", "path": "begriffe/customer-as-hero.md", "text": "---\nconcept: customer-as-hero\nkind: tactic\n---\n# Customer as hero\nKind: tactic\n\n## Definition\n\"the customer becomes the hero\" - tell the customer's story, not the brand's.\n\nNote: Contradicts 25 on founder stories (see storytelling).\n\n## Used in\n- [[02-sell-the-after-not-the-what]] – \"Stop listing the benefits and instead start painting their future.\"\n- [[23-the-customer-is-the-hero-of-the-story]] – \"the customer becomes the hero\"\n\n## Related concepts\n- [[storytelling]]\n- [[customer-understanding]]\n- [[desired-outcome]]\n- [[feeling-understood]]\n"}, {"id": "customer-understanding", "kind": "concept", "title": "Customer understanding", "path": "begriffe/customer-understanding.md", "text": "---\nconcept: customer-understanding\nkind: tactic\n---\n# Customer understanding\nKind: tactic\n\n## Definition\n\"You have to get to know your customers and your target audience.\" (36); \"understand that you understood their problem, their desire, and their exact situation\" (17).\n\nNote: Practice of researching; the resulting feeling is feeling-understood.\n\n## Used in\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – \"they understand that you understood their problem, their desire, and their exact situation\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"They should feel like you understand them better than they understand themselves.\"\n- [[22-price-is-never-the-problem]] – \"Your job is to raise their understanding\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"You have to get to know your customers and your target audience.\"\n- [[40-four-buying-stages-schwartz]] – \"you need to know what buying\"\n- [[43-the-enemy-effect-builds-loyalty]] – \"you must find out what your customer hates\"\n- [[50-understand-why-money-moves]] – \"The better you understand what people want, what frustrates them, and what they're willing to pay for\"\n\n## Related concepts\n- [[feeling-understood]]\n- [[target-audience-focus]]\n- [[confirmation-bias]]\n- [[customer-as-hero]]\n"}, {"id": "desired-outcome", "kind": "concept", "title": "Desired outcome", "path": "begriffe/desired-outcome.md", "text": "---\nconcept: desired-outcome\nkind: psychological mechanism\n---\n# Desired outcome\nKind: psychological mechanism\n\n## Definition\n\"They want the better version of themselves.\" The customer buys the outcome or the 'after', not the product. Merged synonyms: desired transformation (02), goal (11), outcome (33).\n\nNote: Station 29 (instant benefit) is kept under immediate-reward-bias because it opposes 02 (long-term transformation).\n\n## Used in\n- [[02-sell-the-after-not-the-what]] – \"They want the better version of themselves.\"\n- [[11-you-sell-emotions-not-the-product]] – \"The emotion of getting closer to the desired outcome.\"\n- [[33-people-buy-the-product-they-like-best]] – \"People only care about your product if they understand the outcome.\"\n- [[42-sell-the-human-desire-behind-the-product]] – \"Sell the human desire behind it.\"\n- [[45-sell-the-outcome-not-the-product]] – \"they care about the outcome\"\n- [[48-the-so-you-can-method]] – \"you stop selling the product and start selling what your customer actually needs\"\n- [[50-understand-why-money-moves]] – \"how valuable the outcome is to the person paying for it\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[customer-as-hero]]\n- [[cost-of-inaction]]\n- [[immediate-reward-bias]]\n- [[problem-first-selling]]\n"}, {"id": "emotion-selling", "kind": "concept", "title": "Emotion selling", "path": "begriffe/emotion-selling.md", "text": "---\nconcept: emotion-selling\nkind: psychological mechanism\n---\n# Emotion selling\nKind: psychological mechanism\n\n## Definition\n\"You don't sell the product, you sell emotions.\" Merged synonyms: sell the feeling first (12), emotional content (25), people buy the product they like best (33).\n\nNote: Conditional wherever emotions are produced by untrue content.\n\n## Used in\n- [[02-sell-the-after-not-the-what]] – \"They buy the confidence boost and compliments they will be getting.\"\n- [[11-you-sell-emotions-not-the-product]] – \"You don't sell the product, you sell emotions.\"\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"sell the feeling first and the product second\"\n- [[25-emotional-content-is-remembered]] – \"If people don't feel something, they won't remember anything.\"\n- [[33-people-buy-the-product-they-like-best]] – \"Make people like you best and that's when your product automatically becomes the best product for them.\"\n- [[42-sell-the-human-desire-behind-the-product]] – \"people don't want the product\"\n- [[45-sell-the-outcome-not-the-product]] – \"they're buying a good night's sleep and better mornings\"\n- [[46-selling-versus-storytelling]] – \"Storytelling competes on meaning and emotion.\"\n- [[48-the-so-you-can-method]] – \"a home alarm system so you can feel safe at night\"\n\n## Related concepts\n- [[emotion-then-logic]]\n- [[emotional-contagion]]\n- [[desired-outcome]]\n- [[memorability]]\n- [[fear-of-missing-out]]\n- [[covert-influence]]\n"}, {"id": "emotion-then-logic", "kind": "concept", "title": "Emotion then logic", "path": "begriffe/emotion-then-logic.md", "text": "---\nconcept: emotion-then-logic\nkind: psychological mechanism\n---\n# Emotion then logic\nKind: psychological mechanism\n\n## Definition\n\"People buy emotions and justify with logic.\"\n\nNote: Claim, unverified.\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"People buy emotions and justify with logic.\"\n- [[35-make-them-feel-they-found-it]] – \"buying feels like the obvious, logical, and personal decision\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"This provides factual evidence that logically reinforces customers' beliefs in your brand.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[social-proof]]\n- [[perceived-value]]\n"}, {"id": "emotional-contagion", "kind": "concept", "title": "Emotional contagion", "path": "begriffe/emotional-contagion.md", "text": "---\nconcept: emotional-contagion\nkind: psychological mechanism\n---\n# Emotional contagion\nKind: psychological mechanism\n\n## Definition\n\"Humans literally catch emotions from others.\"\n\nNote: Authenticity condition in 12.\n\n## Used in\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"Humans literally catch emotions from others.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[priming]]\n- [[covert-influence]]\n- [[memorability]]\n"}, {"id": "existing-demand", "kind": "concept", "title": "Existing demand", "path": "begriffe/existing-demand.md", "text": "---\nconcept: existing-demand\nkind: tactic\n---\n# Existing demand\nKind: tactic\n\n## Definition\n\"Most marketing fails because it tries to create demand.\"\n\nNote: Contradicted in effect by 16.\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"Most marketing fails because it tries to create demand.\"\n- [[40-four-buying-stages-schwartz]] – \"Next, you'll go onto Google and search how to improve gut health.\"\n- [[50-understand-why-money-moves]] – \"Every successful business exists because it gives customers a reason to spend their money.\"\n- [[51-you-dont-need-to-invent-to-become-rich]] – \"they're already spending money on it\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[relief-framing]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "fear-of-missing-out", "kind": "concept", "title": "Fear of missing out", "path": "begriffe/fear-of-missing-out.md", "text": "---\nconcept: fear-of-missing-out\nkind: psychological mechanism\n---\n# Fear of missing out\nKind: psychological mechanism\n\n## Definition\n\"Picture it and make your customers feel the emotion so that they fear missing out.\"\n\nNote: Fabricated urgency or scarcity is excluded by GRUNDSATZ (ghish, najsh).\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"so that they fear missing out\"\n- [[38-framing-bundle-pricing-scarcity]] – \"The fear of missing out motivates people to act fast.\"\n\n## Related concepts\n- [[loss-aversion]]\n- [[cost-of-inaction]]\n- [[emotion-selling]]\n"}, {"id": "feeling-understood", "kind": "concept", "title": "Feeling understood", "path": "begriffe/feeling-understood.md", "text": "---\nconcept: feeling-understood\nkind: psychological mechanism\n---\n# Feeling understood\nKind: psychological mechanism\n\n## Definition\n\"They decide when they feel understood and safe about their choice.\" Merged: feel seen (19).\n\nNote: Feigned understanding is excluded.\n\n## Used in\n- [[15-three-questions-every-customer-asks]] – \"They decide when they feel understood and safe about their choice.\"\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – \"Prove that you understand your customers, and they will buy.\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Because people listen when they feel seen.\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"make them feel understood\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[trust]]\n- [[target-audience-focus]]\n- [[certainty-over-risk]]\n"}, {"id": "first-seconds-hook", "kind": "concept", "title": "First seconds hook", "path": "begriffe/first-seconds-hook.md", "text": "---\nconcept: first-seconds-hook\nkind: tactic\n---\n# First seconds hook\nKind: tactic\n\n## Definition\n\"Most content fails in the first seconds, not at the end.\"\n\n## Used in\n- [[13-animations-that-turn-your-message-into-a-story]] – \"a good video is what makes people stop, feel something, and want to know more, all within a few seconds\"\n- [[30-content-fails-in-the-first-seconds]] – \"Most content fails in the first seconds, not at the end.\"\n\n## Related concepts\n- [[attention]]\n- [[clarity]]\n- [[social-media-content]]\n"}, {"id": "framing-effect", "kind": "concept", "title": "Framing effect", "path": "begriffe/framing-effect.md", "text": "---\nconcept: framing-effect\nkind: psychological mechanism\n---\n# Framing effect\nKind: psychological mechanism\n\n## Definition\n\"A yogurt that says 20% fat is the same as one that says 80% fat free, but the second version sounds more appealing.\" / \"People buy based on how information is framed.\" (38)\n\nNote: Usable only when both wordings state the same true fact and nothing is left out (rules 1, 3, 7). Claim, unverified in the video.\n\n## Used in\n- [[38-framing-bundle-pricing-scarcity]] – \"People buy based on how information is framed.\"\n\n## Related concepts\n- [[bundle-pricing]]\n- [[contrast-effect]]\n- [[perceived-value]]\n- [[covert-influence]]\n"}, {"id": "free-trial", "kind": "concept", "title": "Free trial", "path": "begriffe/free-trial.md", "text": "---\nconcept: free-trial\nkind: tactic\n---\n# Free trial\nKind: tactic\n\n## Definition\n\"or free trials\" to reduce the pain of paying; concrete offer in 05: \"a 14-day free trial\".\n\nNote: Conditional: trial terms stated (gharar).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"or free trials\"\n- [[05-study-what-works-particl]] – \"DM me Particle for a 14-day free trial\"\n- [[44-social-proof-reciprocity-branding]] – \"give away a free trial, free sample, or free resource\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[guarantee]]\n- [[simple-checkout]]\n- [[call-to-action-dm-comment]]\n"}, {"id": "guarantee", "kind": "concept", "title": "Guarantee", "path": "begriffe/guarantee.md", "text": "---\nconcept: guarantee\nkind: tactic\n---\n# Guarantee\nKind: tactic\n\n## Definition\n\"use guarantees\" to reduce the pain of paying.\n\nNote: Conditional: real, clearly worded, honored (gharar).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"use guarantees\"\n- [[41-say-the-negative-first]] – \"You'll get your money back if you don't see the results you want.\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[free-trial]]\n- [[certainty-over-risk]]\n- [[trust]]\n"}, {"id": "halo-effect", "kind": "concept", "title": "Halo effect", "path": "begriffe/halo-effect.md", "text": "---\nconcept: halo-effect\nkind: psychological mechanism\n---\n# Halo effect\nKind: psychological mechanism\n\n## Definition\n\"One strong impression, good or bad, influences directly everything that follows.\"\n\nNote: Named effect, no source.\n\n## Used in\n- [[18-halo-effect]] – \"This is what's called the halo effect.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[brand-consistency]]\n- [[product-vs-branding]]\n"}, {"id": "illusion-of-innovation", "kind": "concept", "title": "Illusion of innovation", "path": "begriffe/illusion-of-innovation.md", "text": "---\nconcept: illusion-of-innovation\nkind: psychological mechanism\n---\n# Illusion of innovation\nKind: psychological mechanism\n\n## Definition\n\"That's the illusion of innovation.\" - new-sounding names sell because they feel new.\n\nNote: Rated not usable in 16 (deception).\n\n## Used in\n- [[16-illusion-of-innovation]] – \"That's the illusion of innovation.\"\n\n## Related concepts\n- [[clarity]]\n- [[attention]]\n- [[brand-perception]]\n"}, {"id": "immediate-reward-bias", "kind": "concept", "title": "Immediate reward bias", "path": "begriffe/immediate-reward-bias.md", "text": "---\nconcept: immediate-reward-bias\nkind: psychological mechanism\n---\n# Immediate reward bias\nKind: psychological mechanism\n\n## Definition\n\"By nature, we want immediate rewards.\"\n\nNote: Unsubstantiated result promises are excluded (29: 'Lose weight in 30 days').\n\n## Used in\n- [[29-sell-the-instant-benefit]] – \"By nature, we want immediate rewards.\"\n\n## Related concepts\n- [[desired-outcome]]\n- [[loss-aversion]]\n"}, {"id": "improve-existing-offer", "kind": "concept", "title": "Improve an existing offer", "path": "begriffe/improve-existing-offer.md", "text": "---\nconcept: improve-existing-offer\nkind: tactic\n---\n# Improve an existing offer\nKind: tactic\n\n## Definition\n\"You can take something that already works and make it just 5% better.\" (51) Method: pick a product people already buy, read what customers complain about (price, delivery time, customer experience), solve at least one complaint better than the competition.\n\nNote: Existing spending is demand for the incumbent, not proof of demand for the new offer. The video itself says \"being slightly better doesn't guarantee success\"; the offer still has to be found and trusted.\n\n## Used in\n- [[51-you-dont-need-to-invent-to-become-rich]] – \"look at what customers complain about\"\n\n## Related concepts\n- [[existing-demand]]\n- [[pain-of-the-problem]]\n- [[trust]]\n- [[traffic-vs-conversion-problem]]\n- [[competitor-research]]\n"}, {"id": "loss-aversion", "kind": "concept", "title": "Loss aversion", "path": "begriffe/loss-aversion.md", "text": "---\nconcept: loss-aversion\nkind: psychological mechanism\n---\n# Loss aversion\nKind: psychological mechanism\n\n## Definition\n\"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n\nNote: Factor 'twice' is not sourced in the video.\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"the less it feels like a loss\"\n- [[21-people-want-to-stop-losing]] – \"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n\n## Related concepts\n- [[cost-of-inaction]]\n- [[pain-of-paying]]\n- [[fear-of-missing-out]]\n"}, {"id": "marketing-vs-branding", "kind": "concept", "title": "Marketing vs branding", "path": "begriffe/marketing-vs-branding.md", "text": "---\nconcept: marketing-vs-branding\nkind: brand concept\n---\n# Marketing vs branding\nKind: brand concept\n\n## Definition\n\"marketing is what you say and branding is what people think when you stop saying it\"; 4P model vs \"The 1P model\".\n\n## Used in\n- [[07-marketing-and-branding-are-yin-and-yang]] – \"marketing gets attention and branding makes people remember\"\n- [[20-branding-is-the-1p-model-perception]] – \"In marketing, everyone knows the 4P model.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[attention]]\n- [[memorability]]\n"}, {"id": "memorability", "kind": "concept", "title": "Memorability", "path": "begriffe/memorability.md", "text": "---\nconcept: memorability\nkind: psychological mechanism\n---\n# Memorability\nKind: psychological mechanism\n\n## Definition\n\"Logical content doesn't necessarily create memory.\" Emotion and story are said to create memory; branding \"makes people remember\" (07).\n\nNote: Claims, unverified.\n\n## Used in\n- [[03-your-brand-is-the-feeling-not-the-logo]] – \"it's the gut feeling they get when they see you\"\n- [[07-marketing-and-branding-are-yin-and-yang]] – \"branding makes people remember\"\n- [[08-open-a-loop-zagarnik-effect]] – \"If you want people to remember your brand, don't close the story too soon.\"\n- [[23-the-customer-is-the-hero-of-the-story]] – \"the story they see themselves in, is the one they remember\"\n- [[25-emotional-content-is-remembered]] – \"Logical content doesn't necessarily create memory.\"\n- [[34-one-message-one-offer-one-action]] – \"If you want people to remember you, keep it simple.\"\n- [[41-say-the-negative-first]] – \"people remember the last thing you say most\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[storytelling]]\n- [[brand-perception]]\n- [[marketing-vs-branding]]\n- [[zagarnik-effect]]\n"}, {"id": "named-brands", "kind": "concept", "title": "Named brands", "path": "begriffe/named-brands.md", "text": "---\nconcept: named-brands\nkind: reference list\n---\n# Named brands\nKind: reference list\n\n## Definition\nBrands and companies named in the sources as examples.\n\nNote: Named without data; examples involving alcohol (26, 28) are not reusable.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"Dollar Shave Club sells razors. Liquid Death sells water.\"\n- [[05-study-what-works-particl]] – \"companies like Skims, Gymshark, and Lululemon\"\n- [[08-open-a-loop-zagarnik-effect]] – \"Have you ever started a Netflix show and suddenly had to finish the whole season?\"\n- [[09-branding-is-for-any-company]] – \"Outline apple logo.\"\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"If you see someone feeling happy to drink a Coke\"\n- [[16-illusion-of-innovation]] – \"Hydraactive Complex or a BioLift Pro Repair\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Pepsi fans will never choose Coca-Cola over it.\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Samsung fans will never own an Apple product.\"\n- [[28-same-wine-different-price-experience]] – \"Option 1 costs \\$7 and you can buy it at Walmart.\"\n- [[34-one-message-one-offer-one-action]] – \"Think about Apple.\"\n- [[43-the-enemy-effect-builds-loyalty]] – \"Nike's enemy is laziness.\"\n- [[46-selling-versus-storytelling]] – \"Nike doesn't just sell shoes.\"\n- [[49-five-words-to-swap-in-marketing]] – image only, not spoken: sign \"BLOCKBUSTER\" on a burning store\n\n## Related concepts\n- [[product-vs-branding]]\n- [[brand-perception]]\n"}, {"id": "negative-first-ordering", "kind": "concept", "title": "Negative first ordering", "path": "begriffe/negative-first-ordering.md", "text": "---\nconcept: negative-first-ordering\nkind: tactic\n---\n# Negative first ordering\nKind: tactic\n\n## Definition\n\"Start with the negative and end with the positive, because people remember the last thing you say most.\" (41) Examples: \"our product is really expensive, but it is the best in the world\"; \"if you don't see the results you want, you'll get your money back\".\n\nNote: The negative must be a real, fully stated fact (price, conditions); the positive must be true (rules 1, 3, 5, 7). Contradicted in emphasis by station 30 (the beginning matters more than the end).\n\n## Used in\n- [[41-say-the-negative-first]] – \"Start with the negative and end with the positive\"\n\n## Related concepts\n- [[memorability]]\n- [[guarantee]]\n- [[perceived-value]]\n- [[first-seconds-hook]]\n"}, {"id": "own-idea-feeling", "kind": "concept", "title": "Own idea feeling", "path": "begriffe/own-idea-feeling.md", "text": "---\nconcept: own-idea-feeling\nkind: psychological mechanism\n---\n# Own idea feeling\nKind: psychological mechanism\n\n## Definition\n\"When it feels like your idea, you want to have it.\" (35); \"the sale feels like their own idea\" (06).\n\nNote: Conditional: sales intent not concealed.\n\n## Used in\n- [[06-priming-makes-people-buy-without-a-word]] – \"the sale feels like their own idea\"\n- [[35-make-them-feel-they-found-it]] – \"When it feels like your idea, you want to have it.\"\n\n## Related concepts\n- [[priming]]\n- [[covert-influence]]\n- [[relief-framing]]\n"}, {"id": "pain-of-paying", "kind": "concept", "title": "Pain of paying", "path": "begriffe/pain-of-paying.md", "text": "---\nconcept: pain-of-paying\nkind: psychological mechanism\n---\n# Pain of paying\nKind: psychological mechanism\n\n## Definition\nThe act of committing to buy is felt as a small pain; \"The pain of paying actually lights up the same brain regions as physical pain.\"\n\nNote: Distinct from pain-of-the-problem: this is the pain of the payment itself, not the pain of the unsolved problem. Claim, unverified in the source (no study named).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"The pain of paying actually lights up the same brain regions as physical pain.\"\n\n## Related concepts\n- [[loss-aversion]]\n- [[simple-checkout]]\n- [[guarantee]]\n- [[free-trial]]\n- [[perceived-value]]\n- [[pain-of-the-problem]]\n"}, {"id": "pain-of-the-problem", "kind": "concept", "title": "Pain of the problem", "path": "begriffe/pain-of-the-problem.md", "text": "---\nconcept: pain-of-the-problem\nkind: psychological mechanism\n---\n# Pain of the problem\nKind: psychological mechanism\n\n## Definition\n\"Make them really feel the pain.\" (37); \"the problem is already painful enough\" (14); \"the pain of standing still\" (21).\n\nNote: Distinct from pain-of-paying.\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"go where the problem is already painful enough and where people need a solution for it\"\n- [[21-people-want-to-stop-losing]] – \"the pain of standing still is the most underused trigger in marketing\"\n- [[37-sell-the-problem-first]] – \"Make them really feel the pain.\"\n- [[43-the-enemy-effect-builds-loyalty]] – \"Then, make it your enemy.\"\n\n## Related concepts\n- [[problem-first-selling]]\n- [[relief-framing]]\n- [[cost-of-inaction]]\n- [[pain-of-paying]]\n"}, {"id": "perceived-value", "kind": "concept", "title": "Perceived value", "path": "begriffe/perceived-value.md", "text": "---\nconcept: perceived-value\nkind: psychological mechanism\n---\n# Perceived value\nKind: psychological mechanism\n\n## Definition\n\"the perceived value of experiencing this emotion has to be greater than the perceived costs to experience the emotion\" (11); price objection is \"about the value they perceive from it\" (22). Synonym: perceived quality (28).\n\nNote: Costs and terms must be disclosed so perceived costs are accurate (gharar).\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"the perceived value of experiencing this emotion has to be greater than the perceived costs to experience the emotion\"\n- [[22-price-is-never-the-problem]] – \"it's about the value they perceive from it\"\n- [[26-use-the-power-of-contrast]] – \"Control the comparison, and you control how expensive or cheap your product feels.\"\n- [[28-same-wine-different-price-experience]] – \"to many people that experience is worth the extra money\"\n- [[38-framing-bundle-pricing-scarcity]] – \"The second option feels like a better deal.\"\n- [[44-social-proof-reciprocity-branding]] – \"paying five times more for the same thing\"\n- [[50-understand-why-money-moves]] – \"It changes hands when people believe they're receiving something worth paying for\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[contrast-effect]]\n- [[brand-perception]]\n- [[emotion-then-logic]]\n"}, {"id": "priming", "kind": "concept", "title": "Priming", "path": "begriffe/priming.md", "text": "---\nconcept: priming\nkind: psychological mechanism\n---\n# Priming\nKind: psychological mechanism\n\n## Definition\n\"Tiny hints in what people see, hear, or feel can shift their mood and decisions without them ever realizing it.\"\n\nNote: Only station 06 names it.\n\n## Used in\n- [[06-priming-makes-people-buy-without-a-word]] – \"The method is called priming, and it is the reason why brands exist.\"\n\n## Related concepts\n- [[covert-influence]]\n- [[own-idea-feeling]]\n- [[emotional-contagion]]\n"}, {"id": "problem-first-selling", "kind": "concept", "title": "Problem first selling", "path": "begriffe/problem-first-selling.md", "text": "---\nconcept: problem-first-selling\nkind: tactic\n---\n# Problem first selling\nKind: tactic\n\n## Definition\n\"So sell the problem first, and the product sells itself.\" (37); \"a problem well explained is a solution half sold\" (17).\n\n## Used in\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – \"a problem well explained is a solution half sold\"\n- [[37-sell-the-problem-first]] – \"So sell the problem first, and the product sells itself.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[relief-framing]]\n- [[customer-understanding]]\n"}, {"id": "product-vs-branding", "kind": "concept", "title": "Product vs branding", "path": "begriffe/product-vs-branding.md", "text": "---\nconcept: product-vs-branding\nkind: brand concept\n---\n# Product vs branding\nKind: brand concept\n\n## Definition\n\"The idea of finding the one winning product is an illusion sold by coaches.\" Synonym group: no winning product (04), best product loses (31), people like best (33), same product different perception (28).\n\nNote: Absolute claims, unverified.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"The idea of finding the one winning product is an illusion sold by coaches.\"\n- [[28-same-wine-different-price-experience]] – \"What creates this difference is not the product itself.\"\n- [[31-best-product-with-bad-branding-loses]] – \"the best product with bad branding will be outperformed by a worse product with good branding\"\n- [[33-people-buy-the-product-they-like-best]] – \"People don't buy the best product. They buy the product they like best.\"\n- [[44-social-proof-reciprocity-branding]] – \"Lastly, branding is everything.\"\n- [[45-sell-the-outcome-not-the-product]] – \"Position your brand to sell the outcome\"\n\n## Related concepts\n- [[brand-perception]]\n- [[halo-effect]]\n- [[emotion-selling]]\n- [[perceived-value]]\n- [[named-brands]]\n"}, {"id": "reciprocity", "kind": "concept", "title": "Reciprocity", "path": "begriffe/reciprocity.md", "text": "---\nconcept: reciprocity\nkind: psychological mechanism\n---\n# Reciprocity\nKind: psychological mechanism\n\n## Definition\n\"People are more likely to buy when they receive value first.\" (44). Give a free trial, free sample or free resource before selling.\n\nNote: Conditional. The gift must really be free, trial terms stated (rule 3), no hidden obligation or data collection (rules 6, 7).\n\n## Used in\n- [[44-social-proof-reciprocity-branding]] – \"Before you sell anything, give away a free trial, free sample, or free resource.\"\n\n## Related concepts\n- [[free-trial]]\n- [[social-proof]]\n- [[trust]]\n- [[pain-of-paying]]\n"}, {"id": "relief-framing", "kind": "concept", "title": "Relief framing", "path": "begriffe/relief-framing.md", "text": "---\nconcept: relief-framing\nkind: tactic\n---\n# Relief framing\nKind: tactic\n\n## Definition\n\"People don't buy solutions. They buy relief.\" (37); \"your offer will feel like relief, not like persuasion\" (14).\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"your offer will feel like relief, not like persuasion\"\n- [[37-sell-the-problem-first]] – \"People don't buy solutions. They buy relief.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[problem-first-selling]]\n- [[existing-demand]]\n- [[own-idea-feeling]]\n"}, {"id": "scannable-content", "kind": "concept", "title": "Scannable content", "path": "begriffe/scannable-content.md", "text": "---\nconcept: scannable-content\nkind: tactic\n---\n# Scannable content\nKind: tactic\n\n## Definition\n\"People don't read, they scan.\" Websites and ads are built so that the eye finds the point along an F or Z shaped path. (39)\n\nNote: F and Z patterns named without a source. The 'misspelled text is still understood' claim is shown only with swapped inner letters and is not a licence for spelling errors.\n\n## Used in\n- [[39-people-scan-they-dont-read]] – \"while building a website, make it scannable\"\n- [[47-people-dont-read-they-scan]] – duplicate of 39 (same script, dark remake): \"Therefore, while building a website, make it scannable.\"\n\n## Related concepts\n- [[clarity]]\n- [[attention]]\n- [[first-seconds-hook]]\n- [[social-media-content]]\n"}, {"id": "scarcity-effect", "kind": "concept", "title": "Scarcity effect", "path": "begriffe/scarcity-effect.md", "text": "---\nconcept: scarcity-effect\nkind: psychological mechanism\n---\n# Scarcity effect\nKind: psychological mechanism\n\n## Definition\n\"A button that says buy now doesn't feel urgent. But if you say only a few left in stock, people feel more eager to buy.\" (38) The effect on screen: a red badge \"only 5 in stock!\" next to a \"buy now\" button.\n\nNote: Usable only when the stock or limit is real and current; invented, reset or permanent stock text is deception (rules 1, 4). The felt effect is described as fear of missing out: see [[fear-of-missing-out]].\n\n## Used in\n- [[38-framing-bundle-pricing-scarcity]] – \"only a few left in stock\"\n\n## Related concepts\n- [[fear-of-missing-out]]\n- [[loss-aversion]]\n- [[cost-of-inaction]]\n"}, {"id": "simple-checkout", "kind": "concept", "title": "Simple checkout", "path": "begriffe/simple-checkout.md", "text": "---\nconcept: simple-checkout\nkind: tactic\n---\n# Simple checkout\nKind: tactic\n\n## Definition\n\"Use a simple checkout\" to reduce the pain of paying.\n\nNote: Only station 01 names it.\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"Use a simple checkout\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[guarantee]]\n- [[free-trial]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "single-message-focus", "kind": "concept", "title": "Single message focus", "path": "begriffe/single-message-focus.md", "text": "---\nconcept: single-message-focus\nkind: tactic\n---\n# Single message focus\nKind: tactic\n\n## Definition\n\"It's one message, one offer, one clear action.\"\n\nNote: One reason to buy must not omit terms.\n\n## Used in\n- [[34-one-message-one-offer-one-action]] – \"It's one message, one offer, one clear action.\"\n\n## Related concepts\n- [[clarity]]\n- [[target-audience-focus]]\n"}, {"id": "so-you-can-method", "kind": "concept", "title": "So you can method", "path": "begriffe/so-you-can-method.md", "text": "---\nconcept: so-you-can-method\nkind: tactic\n---\n# So you can method\nKind: tactic\n\n## Definition\n\"You take your product or feature, add So You Can, and then finish with the outcome.\" (48). Examples: \"a home alarm system so you can feel safe at night\"; \"noise-canceling headphones so you can get your work done with no distractions\".\n\nNote: The outcome named must be what the product really delivers (rules 1, 5). Same direction as desired-outcome, but a concrete sentence formula.\n\n## Used in\n- [[48-the-so-you-can-method]] – \"You take your product or feature, add So You Can, and then finish with the outcome.\"\n\n## Related concepts\n- [[desired-outcome]]\n- [[emotion-selling]]\n- [[clarity]]\n"}, {"id": "social-media-content", "kind": "concept", "title": "Social media content", "path": "begriffe/social-media-content.md", "text": "---\nconcept: social-media-content\nkind: channel\n---\n# Social media content\nKind: channel\n\n## Definition\nShort-form content as channel: \"Most content fails for one reason.\" (25); \"scroll-stopping story\" (13).\n\nNote: All 37 sources are TikToks; this concept lists only statements that treat content as the object.\n\n## Used in\n- [[13-animations-that-turn-your-message-into-a-story]] – \"scroll-stopping story\"\n- [[24-attention-comes-from-clarity-not-frequency]] – \"But the solution is not that you have to post more.\"\n- [[25-emotional-content-is-remembered]] – \"Most content fails for one reason.\"\n- [[30-content-fails-in-the-first-seconds]] – \"If the brain doesn't immediately know what your content is about, it won't stay long enough to find out.\"\n- [[39-people-scan-they-dont-read]] – \"while making an ad, make it scannable too\"\n- [[40-four-buying-stages-schwartz]] – \"each stage requires different types of content\"\n\n## Related concepts\n- [[first-seconds-hook]]\n- [[attention]]\n- [[call-to-action-dm-comment]]\n- [[storytelling]]\n"}, {"id": "social-proof", "kind": "concept", "title": "Social proof", "path": "begriffe/social-proof.md", "text": "---\nconcept: social-proof\nkind: tactic\n---\n# Social proof\nKind: tactic\n\n## Definition\n\"testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand\"; data, statistics, studies (36).\n\nNote: Fabricated social proof is excluded (GRUNDSATZ: reviews, user numbers).\n\n## Used in\n- [[36-confirmation-bias-say-what-people-already-think]] – \"Then, use testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand.\"\n- [[44-social-proof-reciprocity-branding]] – \"if you show five-star reviews, people are more likely to buy\"\n\n## Related concepts\n- [[confirmation-bias]]\n- [[trust]]\n- [[emotion-then-logic]]\n"}, {"id": "storytelling", "kind": "concept", "title": "Storytelling", "path": "begriffe/storytelling.md", "text": "---\nconcept: storytelling\nkind: tactic\n---\n# Storytelling\nKind: tactic\n\n## Definition\n\"Most brands don't understand storytelling.\" Merged: story, scroll-stopping story, founder story.\n\nNote: 23 says tell the customer's story; 25 says people love founder stories; 04 says tell a story about the product.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"the story you tell about it\"\n- [[10-the-five-year-old-rule]] – \"DM me to turn your message into a story anyone can get and love.\"\n- [[13-animations-that-turn-your-message-into-a-story]] – \"we will help you turn your message into a scroll-stopping story\"\n- [[23-the-customer-is-the-hero-of-the-story]] – \"Most brands don't understand storytelling.\"\n- [[25-emotional-content-is-remembered]] – \"That's why people love founder stories, or stories with personal background.\"\n- [[46-selling-versus-storytelling]] – \"Storytelling focuses on transformation.\"\n\n## Related concepts\n- [[customer-as-hero]]\n- [[memorability]]\n- [[zagarnik-effect]]\n- [[emotion-selling]]\n"}, {"id": "target-audience-focus", "kind": "concept", "title": "Target audience focus", "path": "begriffe/target-audience-focus.md", "text": "---\nconcept: target-audience-focus\nkind: tactic\n---\n# Target audience focus\nKind: tactic\n\n## Definition\n\"Focus on one group of people and make it your target audience.\"\n\n## Used in\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Focus on one group of people and make it your target audience.\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"You have to get to know your customers and your target audience.\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[single-message-focus]]\n- [[feeling-understood]]\n"}, {"id": "traffic-vs-conversion-problem", "kind": "concept", "title": "Traffic vs conversion problem", "path": "begriffe/traffic-vs-conversion-problem.md", "text": "---\nconcept: traffic-vs-conversion-problem\nkind: framework\n---\n# Traffic vs conversion problem\nKind: framework\n\n## Definition\n\"You either have a conversion problem or a traffic problem.\"\n\nNote: Metric terms used in the sources without numbers; no rates are given.\n\n## Used in\n- [[32-conversion-problem-or-traffic-problem]] – \"You either have a conversion problem or a traffic problem.\"\n- [[51-you-dont-need-to-invent-to-become-rich]] – \"People still need to discover and trust your business.\"\n\n## Related concepts\n- [[attention]]\n- [[simple-checkout]]\n- [[existing-demand]]\n"}, {"id": "trust", "kind": "concept", "title": "Trust", "path": "begriffe/trust.md", "text": "---\nconcept: trust\nkind: psychological mechanism\n---\n# Trust\nKind: psychological mechanism\n\n## Definition\n\"The more people have to think, the less they trust you.\" (27); \"This will build trust and increase your sales.\" (19); \"can I trust it\" (15).\n\n## Used in\n- [[15-three-questions-every-customer-asks]] – \"can I trust it\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"This will build trust and increase your sales.\"\n- [[27-the-more-people-think-the-less-they-trust]] – \"The more people have to think, the less they trust you.\"\n- [[51-you-dont-need-to-invent-to-become-rich]] – \"People still need to discover and trust your business.\"\n\n## Related concepts\n- [[certainty-over-risk]]\n- [[feeling-understood]]\n- [[social-proof]]\n- [[guarantee]]\n- [[clarity]]\n"}, {"id": "word-choice", "kind": "concept", "title": "Word choice", "path": "begriffe/word-choice.md", "text": "---\nconcept: word-choice\nkind: tactic\n---\n# Word choice\nKind: tactic\n\n## Definition\nReplacing single words or phrases in marketing text with others that sound better: \"Sign up\" to \"Start now\", \"Best\" to \"Top rated\", \"Only here\" to \"Exclusive\", \"Sale\" to \"Special offer\", \"Must have\" to \"Essential\" (49).\n\nNote: A swap changes the sound, not the claim. The claim behind the new word must be true (rules 1, 4, 5); a swap that only softens an untrue claim is deception.\n\n## Used in\n- [[49-five-words-to-swap-in-marketing]] – \"Don't say sale. Instead, say special offer.\"\n\n## Related concepts\n- [[illusion-of-innovation]]\n- [[clarity]]\n- [[call-to-action-dm-comment]]\n"}, {"id": "zagarnik-effect", "kind": "concept", "title": "Zagarnik effect", "path": "begriffe/zagarnik-effect.md", "text": "---\nconcept: zagarnik-effect\nkind: psychological mechanism\n---\n# Zagarnik effect\nKind: psychological mechanism\n\n## Definition\n\"It's called the Zagarnik effect. Your mind simply hates unfinished stories.\" (source spelling kept). Synonym used in the source: open a loop.\n\nNote: Withholding is conditional: no withheld terms (gharar).\n\n## Used in\n- [[08-open-a-loop-zagarnik-effect]] – \"It's called the Zagarnik effect. Your mind simply hates unfinished stories.\"\n\n## Related concepts\n- [[clarity]]\n- [[attention]]\n- [[memorability]]\n- [[storytelling]]\n"}], "links": [{"source": "01-reduce-the-pain-of-paying", "target": "05-study-what-works-particl"}, {"source": "01-reduce-the-pain-of-paying", "target": "11-you-sell-emotions-not-the-product"}, {"source": "01-reduce-the-pain-of-paying", "target": "15-three-questions-every-customer-asks"}, {"source": "01-reduce-the-pain-of-paying", "target": "21-people-want-to-stop-losing"}, {"source": "01-reduce-the-pain-of-paying", "target": "27-the-more-people-think-the-l const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const svg = d3.select("#graph"), g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 5]).on("zoom", e => g.attr("transform", e.transform)));
const deg = {}; DATA.links.forEach(l => { deg[l.source] = (deg[l.source]||0)+1; deg[l.target] = (deg[l.target]||0)+1; });
const color = n => n.kind === "station" ? "var(--station)" : "var(--concept)";
const r = n => 4 + Math.sqrt(deg[n.id] || 0) * 2;

const sim = d3.forceSimulation(DATA.nodes)
  .force("link", d3.forceLink(DATA.links).id(d => d.id).distance(60))
  .force("charge", d3.forceManyBody().strength(-120))
  .force("center", d3.forceCenter())
  .force("collide", d3.forceCollide(d => r(d) + 2));

const link = g.append("g").selectAll("line").data(DATA.links).join("line").attr("stroke", "var(--edge)");
const node = g.append("g").selectAll("circle").data(DATA.nodes).join("circle")
  .attr("r", r).attr("fill", color).style("cursor", "pointer")
  .on("click", (e, d) => show(d.id))
  .call(d3.drag().on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));
const label = g.append("g").selectAll("text").data(DATA.nodes).join("text").text(d => d.kind === "station" ? d.id.slice(0, 2) : d.id).attr("dx", 8).attr("dy", 3);

function resize() { const b = svg.node().getBoundingClientRect(); svg.attr("viewBox", [-b.width/2, -b.height/2, b.width, b.height]); }
resize(); addEventListener("resize", resize);
sim.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("cx", d => d.x).attr("cy", d => d.y); label.attr("x", d => d.x).attr("y", d => d.y);
});

function neighbors(id) { const s = new Set([id]); DATA.links.forEach(l => { if (l.source.id === id) s.add(l.target.id); if (l.target.id === id) s.add(l.source.id); }); return s; }
function highlight(set) {
  node.attr("opacity", d => !set || set.has(d.id) ? 1 : 0.15);
  label.attr("opacity", d => !set || set.has(d.id) ? 1 : 0.1);
  link.attr("stroke", l => set && set.has(l.source.id) && set.has(l.target.id) ? "var(--hi)" : "var(--edge)");
}
function show(id) {
  const n = byId[id]; if (!n) return;
  const md = n.text.replace(/^---[\s\S]*?---\n/, "").replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, t, a) => `<a data-id="${t.trim()}">${a || t}</a>`);
  const note = document.getElementById("note");
  note.innerHTML = `<p class="empty">${n.path}</p>` + marked.parse(md);
  note.querySelectorAll("a[data-id]").forEach(a => a.onclick = () => show(a.dataset.id));
  note.scrollTop = 0; highlight(neighbors(id));
}
document.getElementById("q").oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  highlight(q ? new Set(DATA.nodes.filter(n => n.text.toLowerCase().includes(q)).map(n => n.id)) : null);
};
document.getElementById("showConcepts").onchange = e => {
  const on = e.target.checked;
  node.attr("display", d => on || d.kind === "station" ? null : "none");
  label.attr("display", d => on || d.kind === "station" ? null : "none");
  link.attr("display", l => on || (l.source.kind === "station" && l.target.kind === "station") ? null : "none");
};
