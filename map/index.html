th \"-\" signs on the left half.\n\n## Statements\n1. \"As a business, you need to understand, people don't want to gain something.\"\n2. \"They want to stop losing.\"\n3. \"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n4. \"This is not a theory.\"\n5. \"It's simply how our brain works.\"\n6. \"So if your business only shows what people can get, you're missing half the equation.\"\n7. \"Show them what they are already losing by not acting.\"\n8. \"Because the pain of standing still is the most underused trigger in marketing.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified: no study, author or year named; the factor 'twice' is not sourced.\n4. **usable** – Assertion without support; claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified.\n7. **conditional** – Only real, demonstrable losses; no invented loss, deadline or scarcity (ghish, najsh). Required change: each loss shown must be factual.\n8. **conditional** – Claim, unverified. Use of fear as 'trigger' is conditional on the same truthfulness condition as statement 7.\n\n## Links\n- [[11-you-sell-emotions-not-the-product]] – same mechanism: anti-goal, how life is if the goal is not reached\n- [[01-reduce-the-pain-of-paying]] – same family of mechanism: loss felt as pain; 01 reduces the felt loss at checkout\n- [[37-sell-the-problem-first]] – related: make them feel the pain of the problem\n- [[29-sell-the-instant-benefit]] – contrast: 29 uses immediacy, 21 uses loss framing\n- [[14-sell-water-to-the-thirsty]] – related: problem already painful\n- [[cost-of-inaction]]\n- [[loss-aversion]]\n- [[pain-of-the-problem]]\n"}, {"id": "22-price-is-never-the-problem", "kind": "station", "title": "22 – Price is never the problem, perceived value is", "path": "stationen/22-price-is-never-the-problem.md", "text": "---\nid: 22\nsource: quellen/videos/22 (v26044gc0000d77patfog65neb1c54k0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 35.48\nduration_video_s: 39.92\nconcepts: [customer-understanding, perceived-value]\n---\n# 22 – Price is never the problem, perceived value is\n## Verbatim\n```text\n[00:00.00 - 00:07.36] Price is never the problem. If people say your product is too expensive, it's not about price.\n[00:07.68 - 00:13.96] Instead, it's about the value they perceive from it. Do they really want to exchange their hard\n[00:13.96 - 00:19.44] earned money with your product? The truth is, they just don't see why it's worth it.\n[00:20.14 - 00:26.50] So your job isn't to lower your price. Your job is to raise their understanding and therefore\n[00:26.50 - 00:32.46] increase the perceived value. Because when people understand the real value, price becomes\n[00:32.46 - 00:35.48] only a detail, not the showstopper.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The last spoken line ends at 35.48 s; the file is 39.92 s long.\n\n## Visuals\n- Frame 1 (0 s): white cube with a small \"FREE\" tag and seven dots around it (no matching audio). Frame 3 (6 s): grey circle with a \"\\$\" sign and a diagonal strike line, caption \"It's not about price.\". Frames 4, 10, 11: battery icons (a line path ending at a battery, six batteries with lightning bolts, a phone with a battery inside) used as value/energy graphic. Frame 5 (12 s): stacked silver coins. Frame 7 (18 s): three bars topped with diamonds.\n\n## Statements\n1. \"Price is never the problem.\"\n2. \"If people say your product is too expensive, it's not about price.\"\n3. \"Instead, it's about the value they perceive from it.\"\n4. \"Do they really want to exchange their hard earned money with your product?\"\n5. \"The truth is, they just don't see why it's worth it.\"\n6. \"So your job isn't to lower your price.\"\n7. \"Your job is to raise their understanding and therefore increase the perceived value.\"\n8. \"Because when people understand the real value, price becomes only a detail, not the showstopper.\"\n\n## Assessment\n1. **usable** – Claim, unverified; 'never' absolute. Genuine inability to pay is not covered.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Rhetorical question.\n5. **usable** – Claim, unverified.\n6. **conditional** – Usable. Required change: if the product is in fact overpriced for its value, the price is corrected, not defended (ghish).\n7. **conditional** – Usable if understanding is raised with true information. Required change: no inflated value claims (ghish).\n8. **usable** – Supports transparency: 'real value'. Claim, unverified.\n\n## Links\n- [[11-you-sell-emotions-not-the-product]] – same mechanism: perceived value must exceed perceived cost\n- [[26-use-the-power-of-contrast]] – extends: 26 shows how comparison changes the price feeling\n- [[28-same-wine-different-price-experience]] – example of: same wine, different perceived value by experience\n- [[09-branding-is-for-any-company]] – same claim: price stops being the only factor\n- [[20-branding-is-the-1p-model-perception]] – same claim: not the price but the meaning matters\n- [[customer-understanding]]\n- [[perceived-value]]\n"}, {"id": "23-the-customer-is-the-hero-of-the-story", "kind": "station", "title": "23 – The customer is the hero: tell their story, not yours", "path": "stationen/23-the-customer-is-the-hero-of-the-story.md", "text": "---\nid: 23\nsource: quellen/videos/23 (v26044gc0000d7bn16nog65o4hcs62f0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 33.40\nduration_video_s: 37.60\nconcepts: [customer-as-hero, memorability, storytelling]\n---\n# 23 – The customer is the hero: tell their story, not yours\n## Verbatim\n```text\n[00:00.00 - 00:02.00] Most brands don't understand storytelling.\n[00:02.70 - 00:05.90] The problem is, they confuse it with telling their own story.\n[00:06.50 - 00:10.10] They talk about how they started, what they built, and why they are different.\n[00:10.70 - 00:12.70] But your customer doesn't care about your story.\n[00:13.00 - 00:14.70] They only care about their story.\n[00:15.30 - 00:19.00] The moment your brand gets into the background, and the customer becomes the hero,\n[00:19.20 - 00:20.40] everything changes.\n[00:20.80 - 00:23.70] Your product is not the destination, it's the tool.\n[00:24.20 - 00:27.80] Stop telling your journey, and start telling your customer's story.\n[00:27.80 - 00:32.00] Because the story they see themselves in, is the one they remember.\n[00:32.40 - 00:33.40] And that's why.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with 'And that's why.' (32.40-33.40 s); the file is 37.60 s long.\n- On-screen at 15 s: a graphic labelled \"Your Brand\" (rectangle above three circles) while the caption says \"gets into the background\".\n\n## Visuals\n- Frame 6 (15 s): rectangle labelled \"Your Brand\" above three outline circles. Frame 8 (21 s): map pin with ellipse base, caption \"the destination\". Frame 9 (24 s): dashed S-shaped path with two small circles, caption \"Stop telling your journey\".\n\n## Statements\n1. \"Most brands don't understand storytelling.\"\n2. \"The problem is, they confuse it with telling their own story.\"\n3. \"They talk about how they started, what they built, and why they are different.\"\n4. \"But your customer doesn't care about your story.\"\n5. \"They only care about their story.\"\n6. \"The moment your brand gets into the background, and the customer becomes the hero, everything changes.\"\n7. \"Your product is not the destination, it's the tool.\"\n8. \"Stop telling your journey, and start telling your customer's story.\"\n9. \"Because the story they see themselves in, is the one they remember.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Description.\n4. **usable** – Claim, unverified; contradicted in part by 25.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified; 'everything changes' unspecified.\n7. **usable** – No checkpoint touched.\n8. **conditional** – Customer stories must be real; no invented customers or testimonials (ghish).\n9. **usable** – Claim, unverified.\n\n## Links\n- [[25-emotional-content-is-remembered]] – contradicts: 25 says people love founder stories and personal-background stories\n- [[02-sell-the-after-not-the-what]] – same mechanism: the customer's future/transformation is the subject\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – same mechanism: show you understood the customer\n- [[19-sell-to-everyone-sell-to-no-one]] – same mechanism: people listen when they feel seen\n- [[04-there-is-no-winning-product]] – related: story told about the product\n- [[customer-as-hero]]\n- [[memorability]]\n- [[storytelling]]\n"}, {"id": "24-attention-comes-from-clarity-not-frequency", "kind": "station", "title": "24 – Attention comes from clarity, not from posting more", "path": "stationen/24-attention-comes-from-clarity-not-frequency.md", "text": "---\nid: 24\nsource: quellen/videos/24 (v26044gc0000d7dsflnog65rmp3ktin0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 34.74\nduration_video_s: 39.54\nconcepts: [attention, call-to-action-dm-comment, clarity, social-media-content]\n---\n# 24 – Attention comes from clarity, not from posting more\n## Verbatim\n```text\n[00:00.00 - 00:01.72] Your business has an attention problem.\n[00:02.56 - 00:04.74] But the solution is not that you have to post more.\n[00:05.70 - 00:07.92] Attention is not gained only because of frequency.\n[00:08.68 - 00:12.40] It is gained because the brain understands immediately why it should care.\n[00:13.38 - 00:17.60] When content feels unclear, the brain automatically treats it as irrelevant.\n[00:18.70 - 00:20.66] That's why posting more often doesn't help.\n[00:21.36 - 00:22.94] It simply multiplies confusion.\n[00:24.14 - 00:26.08] Clarity is what creates relevance.\n[00:27.06 - 00:28.48] Relevance creates attention.\n[00:28.48 - 00:34.74] Comment the word attention if you want me to share a short training on how attention really works.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- On-screen at 30 s: the word \"Attention\" appears as separate grey text next to \"if you want me\" (audio: 'Comment the word attention if you want me to share...').\n- The file is 39.54 s long; the last spoken line ends at 34.74 s.\n\n## Visuals\n- Frame 2 (3 s): scattered play-button circles. Frame 8 (21 s): dashed ring of squares with a blurred dot, caption \"multiplies confusion\". Frame 11 (30 s): grey text \"Attention\".\n\n## Statements\n1. \"Your business has an attention problem.\"\n2. \"But the solution is not that you have to post more.\"\n3. \"Attention is not gained only because of frequency.\"\n4. \"It is gained because the brain understands immediately why it should care.\"\n5. \"When content feels unclear, the brain automatically treats it as irrelevant.\"\n6. \"That's why posting more often doesn't help.\"\n7. \"It simply multiplies confusion.\"\n8. \"Clarity is what creates relevance.\"\n9. \"Relevance creates attention.\"\n10. \"Comment the word attention if you want me to share a short training on how attention really works.\"\n\n## Assessment\n1. **usable** – Assumption about the viewer's business; claim, unverified.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified; absolute.\n7. **usable** – No checkpoint touched.\n8. **usable** – No checkpoint touched.\n9. **usable** – No checkpoint touched.\n10. **conditional** – Call to action for a lead (comment keyword). Required change: state what the 'training' is and what is done with contact data; no hidden sales funnel (gharar).\n\n## Links\n- [[30-content-fails-in-the-first-seconds]] – extends: 30 says attention first, understanding later; order differs (24: understanding first creates attention)\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: unclear content is distrusted, clarity wins\n- [[25-emotional-content-is-remembered]] – same call to action ('Comment the word attention')\n- [[07-marketing-and-branding-are-yin-and-yang]] – related: marketing gets attention\n- [[10-the-five-year-old-rule]] – related: complexity reduces conversion\n- [[attention]]\n- [[call-to-action-dm-comment]]\n- [[clarity]]\n- [[social-media-content]]\n"}, {"id": "25-emotional-content-is-remembered", "kind": "station", "title": "25 – Emotional content is remembered, logical content is not", "path": "stationen/25-emotional-content-is-remembered.md", "text": "---\nid: 25\nsource: quellen/videos/25 (v26044gc0000d7j472vog65jsldhpmk0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 32.98\nduration_video_s: 38.37\nconcepts: [call-to-action-dm-comment, emotion-selling, memorability, social-media-content, storytelling]\n---\n# 25 – Emotional content is remembered, logical content is not\n## Verbatim\n```text\n[00:00.00 - 00:01.62] Most content fails for one reason.\n[00:02.50 - 00:04.58] It never enters the emotional side of the brain.\n[00:05.64 - 00:07.76] Businesses often focus on logical content.\n[00:08.12 - 00:11.18] They post what they do, what people can buy from them, and about their team.\n[00:12.06 - 00:14.38] Logical content doesn't necessarily create memory.\n[00:15.34 - 00:16.86] But emotional content does.\n[00:17.32 - 00:20.84] That's why people love founder stories, or stories with personal background.\n[00:21.62 - 00:24.26] If people don't feel something, they won't remember anything.\n[00:25.00 - 00:27.96] And if they don't remember you, nothing else matters.\n[00:27.96 - 00:32.98] Comment the word attention if you want to learn how you make your content connect emotionally.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The last spoken line ends at 32.98 s; the file is 38.37 s long.\n\n## Visuals\n- Frame 3 (6 s): gear outline with a dot, caption \"on Logical content\". Frame 6 (15 s): smiley face outline, caption \"But Emotional content does\". Frame 7 (18 s): grid of rectangles with a head and tie, caption \"or stories\". Frame 12 (33 s): TikTok logo, no search bar.\n\n## Statements\n1. \"Most content fails for one reason.\"\n2. \"It never enters the emotional side of the brain.\"\n3. \"Businesses often focus on logical content.\"\n4. \"They post what they do, what people can buy from them, and about their team.\"\n5. \"Logical content doesn't necessarily create memory.\"\n6. \"But emotional content does.\"\n7. \"That's why people love founder stories, or stories with personal background.\"\n8. \"If people don't feel something, they won't remember anything.\"\n9. \"And if they don't remember you, nothing else matters.\"\n10. \"Comment the word attention if you want to learn how you make your content connect emotionally.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – No checkpoint touched.\n4. **usable** – Description.\n5. **usable** – Claim, unverified.\n6. **conditional** – Claim, unverified. Emotion must be truthful, not manufactured (ghish).\n7. **conditional** – Usable if the story is true and privacy of others respected. Claim, unverified.\n8. **usable** – Claim, unverified; absolute.\n9. **usable** – Claim, unverified; absolute.\n10. **conditional** – Same condition as in 24: state what is offered and what happens to the contact (gharar).\n\n## Links\n- [[23-the-customer-is-the-hero-of-the-story]] – contradicts: 23 says the customer does not care about your story\n- [[24-attention-comes-from-clarity-not-frequency]] – same call to action keyword\n- [[11-you-sell-emotions-not-the-product]] – same mechanism: emotions drive purchase and memory\n- [[12-emotions-are-caught-sell-the-feeling-first]] – same mechanism: emotion first\n- [[03-your-brand-is-the-feeling-not-the-logo]] – related: the emotion evoked by a brand\n- [[call-to-action-dm-comment]]\n- [[emotion-selling]]\n- [[memorability]]\n- [[social-media-content]]\n- [[storytelling]]\n"}, {"id": "26-use-the-power-of-contrast", "kind": "station", "title": "26 – Use the power of contrast: control the comparison", "path": "stationen/26-use-the-power-of-contrast.md", "text": "---\nid: 26\nsource: quellen/videos/26 (v26044gc0000d7kdsuvog65v1s9r1mr0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.54\nduration_video_s: 35.07\nconcepts: [contrast-effect, covert-influence, perceived-value]\n---\n# 26 – Use the power of contrast: control the comparison\n## Verbatim\n```text\n[00:00.00 - 00:03.60] Use the power of contrast to increase your sales.\n[00:03.60 - 00:06.40] Your brain can't judge value in isolation.\n[00:06.40 - 00:08.96] It always needs something to compare it to.\n[00:08.96 - 00:12.50] A $50 bottle of wine feels expensive\n[00:12.50 - 00:15.52] until it sits next to a $200 bottle.\n[00:15.52 - 00:17.64] That's why salespeople anchor prices high\n[00:17.64 - 00:19.66] before showing you the real offer.\n[00:19.66 - 00:21.60] This isn't manipulation.\n[00:21.60 - 00:24.58] It is simply using how the human brain works.\n[00:24.58 - 00:26.12] Control the comparison,\n[00:26.12 - 00:29.16] and you control how expensive or cheap\n[00:29.16 - 00:30.54] your product feels.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'until it sits next to a \\$200 bottle' / On-screen: bottle graphics at 9-12 s show \"\\$50\" (pill label and \"\\$50\" below one bottle, a star label on the second bottle); no \"\\$200\" appears in the sampled frames.\n- On-screen at 18 s (frame f_007): salesperson icon beside two price tags \"\\$150\" and \"\\$80\" joined by a vertical arrow. Audio at this point: 'That's why salespeople anchor prices high before showing you the real offer.' The figures \\$150 and \\$80 are not spoken.\n- Transcript: 'how expensive or cheap your product feels' / On-screen at 27 s: \"or \"cheap\"\" (with quotation marks).\n\n## Visuals\n- Frame 4 (9 s): wine bottle with \"\\$50\" below. Frame 5 (12 s): two wine bottles, left with \"\\$50\" pill label and \"\\$50\", right with a star label. Frame 6-7 (15-18 s): white person icon with tie, then beside price tags \"\\$150\" and \"\\$80\" with an arrow. Frame 10 (27 s): dashed circle containing a \"\\$\" coin.\n\n## Statements\n1. \"Use the power of contrast to increase your sales.\"\n2. \"Your brain can't judge value in isolation.\"\n3. \"It always needs something to compare it to.\"\n4. \"A \\$50 bottle of wine feels expensive until it sits next to a \\$200 bottle.\"\n5. \"That's why salespeople anchor prices high before showing you the real offer.\"\n6. \"This isn't manipulation.\"\n7. \"It is simply using how the human brain works.\"\n8. \"Control the comparison, and you control how expensive or cheap your product feels.\"\n\n## Assessment\n1. **conditional** – Usable with truthful comparison; see statements 5-8.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified; 'always'.\n4. **conditional** – Mechanism usable; example product is wine (alcohol): do not reuse the example (order of authority 1: alcohol is forbidden). Replace with a permissible product.\n5. **conditional** – Anchoring is usable only if the high price is a real price the item or a comparable item is actually sold at. A decoy or reference price that was never charged is najsh and ghish. Required change: the anchor must be genuine and disclosed as such.\n6. **conditional** – The denial does not change the assessment; the technique is judged by statements 4 and 5. Claim, unverified.\n7. **usable** – Claim, unverified.\n8. **conditional** – Comparison must consist of true alternatives; no fake comparison offers (najsh).\n\n## Links\n- [[22-price-is-never-the-problem]] – extends: 22 says perceived value decides the price objection; 26 shows how to change the reference point\n- [[28-same-wine-different-price-experience]] – example of: same wine, \\$7 vs \\$150\n- [[36-confirmation-bias-say-what-people-already-think]] – contradicts in wording: 26 says 'this isn't manipulation', 36 says 'manipulate your customers'\n- [[11-you-sell-emotions-not-the-product]] – related: perceived value vs perceived cost\n- [[29-sell-the-instant-benefit]] – related: framing of the same product by reference\n- [[contrast-effect]]\n- [[covert-influence]]\n- [[perceived-value]]\n"}, {"id": "27-the-more-people-think-the-less-they-trust", "kind": "station", "title": "27 – The more people have to think, the less they trust you: the clearest message wins", "path": "stationen/27-the-more-people-think-the-less-they-trust.md", "text": "---\nid: 27\nsource: quellen/videos/27 (v26044gc0000d7uhivnog65ru14fd34g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 37.56\nduration_video_s: 42.57\nconcepts: [call-to-action-dm-comment, certainty-over-risk, clarity, trust]\n---\n# 27 – The more people have to think, the less they trust you: the clearest message wins\n## Verbatim\n```text\n[00:00.00 - 00:02.38] In marketing, you need to understand this one thing.\n[00:03.02 - 00:06.12] The more people have to think, the less they trust you.\n[00:06.68 - 00:10.90] Not because they're lazy, but because the brain links confusion with risk.\n[00:11.54 - 00:15.40] If your message takes effort to understand, your offer feels risky.\n[00:16.08 - 00:17.84] And people don't buy risk.\n[00:18.48 - 00:19.32] They buy certainty.\n[00:20.08 - 00:22.72] This is why the clearest message always wins.\n[00:23.14 - 00:27.34] Not the most creative, not the most detailed, the clearest.\n[00:27.34 - 00:30.62] Because clarity is not just about words.\n[00:31.22 - 00:33.90] It is the feeling that you know exactly what you're doing.\n[00:34.42 - 00:37.56] Comment the word attention to learn how to design for clarity.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The last spoken line ends at 37.56 s; the file is 42.57 s long.\n\n## Visuals\n- Frame 2 (3 s): glowing triangle with a white person icon and \"?\" inside. Frame 4 (9 s): brain outline with four \"?\" marks, caption \"confusion with risk\". Frame 7 (18 s): circle with filled check mark, caption \"they buy certainty\". Frame 8 (21 s): ribbon badge with the number \"1\".\n\n## Statements\n1. \"In marketing, you need to understand this one thing.\"\n2. \"The more people have to think, the less they trust you.\"\n3. \"Not because they're lazy, but because the brain links confusion with risk.\"\n4. \"If your message takes effort to understand, your offer feels risky.\"\n5. \"And people don't buy risk.\"\n6. \"They buy certainty.\"\n7. \"This is why the clearest message always wins.\"\n8. \"Not the most creative, not the most detailed, the clearest.\"\n9. \"Because clarity is not just about words.\"\n10. \"It is the feeling that you know exactly what you're doing.\"\n11. \"Comment the word attention to learn how to design for clarity.\"\n\n## Assessment\n1. **usable** – No checkpoint touched.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Consistent with the gharar checkpoint.\n7. **usable** – Claim, unverified; 'always'.\n8. **usable** – No checkpoint touched.\n9. **usable** – No checkpoint touched.\n10. **conditional** – Required change: the feeling of competence must be backed by actual competence (ghish).\n11. **conditional** – Same condition as in 24: state what is offered and what happens to the contact (gharar).\n\n## Links\n- [[10-the-five-year-old-rule]] – same mechanism: complexity reduces conversion\n- [[15-three-questions-every-customer-asks]] – same mechanism: people don't decide when unsure\n- [[34-one-message-one-offer-one-action]] – same mechanism: more options, more confusion\n- [[16-illusion-of-innovation]] – contradicts: 16 recommends complexity to create curiosity\n- [[08-open-a-loop-zagarnik-effect]] – contradicts in emphasis: 08 leaves gaps on purpose\n- [[24-attention-comes-from-clarity-not-frequency]] – same call to action keyword and same claim that unclear content is ignored\n- [[call-to-action-dm-comment]]\n- [[certainty-over-risk]]\n- [[clarity]]\n- [[trust]]\n"}, {"id": "28-same-wine-different-price-experience", "kind": "station", "title": "28 – Same wine, \\$7 versus \\$150: the experience creates the perceived quality", "path": "stationen/28-same-wine-different-price-experience.md", "text": "---\nid: 28\nsource: quellen/videos/28 (v26044gc0000d87p9v7og65rs2f75950.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 62.72\nduration_video_s: 61.70\nconcepts: [named-brands, perceived-value, product-vs-branding]\n---\n# 28 – Same wine, \\$7 versus \\$150: the experience creates the perceived quality\n## Verbatim\n```text\n[00:00.00 - 00:03.12] Let's play a game to see if you really understand marketing and branding.\n[00:03.98 - 00:05.66] Here are two bottles of red wine.\n[00:06.50 - 00:10.14] Option 1 costs $7 and you can buy it at Walmart.\n[00:11.08 - 00:16.30] Option 2 costs $150 and is only sold in selected stores.\n[00:17.24 - 00:19.42] The first bottle looks like every other wine on the shelf.\n[00:20.34 - 00:23.58] The second bottle has a thinner shape and comes in a wooden box.\n[00:24.48 - 00:27.68] Now be honest, which one would you assume is higher quality?\n[00:27.68 - 00:31.38] The answer is, they are equal.\n[00:32.26 - 00:35.88] It's the same wine that comes from the same company produced from the same grapes.\n[00:36.50 - 00:39.32] What creates this difference is not the product itself.\n[00:40.28 - 00:47.50] It's the experience and the feeling that lets the $150 wine appear to be of better quality and value.\n[00:48.34 - 00:51.54] And even though in reality the wine itself has the same quality,\n[00:52.52 - 00:56.08] to many people that experience is worth the extra money.\n[00:56.08 - 00:57.72] So...\n[00:57.72 - 00:58.08] So...\n[00:58.08 - 01:00.08] So...\n[01:00.08 - 01:01.08] So...\n[01:01.08 - 01:02.08] So...\n[01:02.08 - 01:02.72] So...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Option 1 costs \\$7 and you can buy it at Walmart.' / On-screen at 9 s: \"at Walmart\" and a bold \"Walmart\" lettering in the graphic (partly covered by the bottle).\n- Audio after 'So...' (56.08 s): the line 'So...' is repeated six times with timestamps 56.08-57.72, 57.72-58.08, 58.08-1:00.08, 1:00.08-1:01.08, 1:01.08-1:02.08, 1:02.08-1:02.72 (file length 61.70 s). The repetition is a Whisper artifact; no further content.\n- The transcript and the on-screen text agree on \\$7 and \\$150.\n\n## Visuals\n- Frames 3-8 (6-21 s): two outline wine bottles in rounded rectangles; left bottle labelled by caption \"costs \\$7\", then \"at Walmart\"; right \"costs \\$150\", then storefront with awning and a bottle (\"in selected stores\"). Frame 13 (36 s): dark bottle silhouette above a storefront. Frames 15-19 (42-54 s): bottle in dotted circle, sparkling burst, spotlight cone, three stars above a bottle.\n\n## Statements\n1. \"Let's play a game to see if you really understand marketing and branding.\"\n2. \"Here are two bottles of red wine.\"\n3. \"Option 1 costs \\$7 and you can buy it at Walmart.\"\n4. \"Option 2 costs \\$150 and is only sold in selected stores.\"\n5. \"The first bottle looks like every other wine on the shelf.\"\n6. \"The second bottle has a thinner shape and comes in a wooden box.\"\n7. \"Now be honest, which one would you assume is higher quality?\"\n8. \"The answer is, they are equal.\"\n9. \"It's the same wine that comes from the same company produced from the same grapes.\"\n10. \"What creates this difference is not the product itself.\"\n11. \"It's the experience and the feeling that lets the \\$150 wine appear to be of better quality and value.\"\n12. \"And even though in reality the wine itself has the same quality, to many people that experience is worth the extra money.\"\n\n## Assessment\n1. **usable** – Framing.\n2. **conditional** – Example product is wine (alcohol): do not reuse the example (order of authority 1: alcohol is forbidden); the mechanism is rated separately in statements 10-12.\n3. **conditional** – Same example condition. Named brand: Walmart. Prices hypothetical, claim, unverified.\n4. **conditional** – Same example condition. 'Only sold in selected stores' is an exclusivity claim; usable only if true (rule 1: no false scarcity claims).\n5. **conditional** – Same example condition.\n6. **conditional** – Same example condition.\n7. **usable** – Rhetorical question.\n8. **conditional** – Hypothetical; claim, unverified. Same example condition.\n9. **conditional** – Hypothetical; claim, unverified. Same example condition. Selling an identical product at 21 times the price as a different product is deception (ghish) unless the difference is stated.\n10. **usable** – Observation about perceived quality; claim, unverified.\n11. **not usable** – Making an identical product appear to be of better quality and value is deception (ghish, najsh). Usable only if the difference (packaging, experience, exclusivity) is named honestly as the difference and quality is not implied.\n12. **conditional** – Charging for a real, honestly described experience is usable. Required change: the experience is real, disclosed, and the buyer is not led to believe in better product quality. Claim, unverified.\n\n## Links\n- [[18-halo-effect]] – same mechanism: perception over reality, halo of presentation\n- [[26-use-the-power-of-contrast]] – example of: wine price comparison, \\$50 and \\$200 / \\$150 and \\$80\n- [[22-price-is-never-the-problem]] – example of: perceived value decides whether price is accepted\n- [[04-there-is-no-winning-product]] – related: branding and story make an ordinary product succeed\n- [[31-best-product-with-bad-branding-loses]] – related: product is not decisive, the feeling is\n- [[named-brands]]\n- [[perceived-value]]\n- [[product-vs-branding]]\n"}, {"id": "29-sell-the-instant-benefit", "kind": "station", "title": "29 – Sell the instant benefit, not the long-term outcome", "path": "stationen/29-sell-the-instant-benefit.md", "text": "---\nid: 29\nsource: quellen/videos/29 (v26044gc0000d8ec0r7og65mup493khg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 36.08\nduration_video_s: 40.03\nconcepts: [covert-influence, immediate-reward-bias]\n---\n# 29 – Sell the instant benefit, not the long-term outcome\n## Verbatim\n```text\n[00:00.00 - 00:01.96] We humans are absolutely impatient.\n[00:03.06 - 00:04.94] By nature, we want immediate rewards.\n[00:05.68 - 00:08.06] Instead of waiting for future, even bigger rewards.\n[00:09.02 - 00:10.46] Do you want $1 million now?\n[00:10.76 - 00:12.52] Or $10 million when you are 70?\n[00:13.20 - 00:15.72] The majority of us will go with the immediate reward.\n[00:16.66 - 00:18.88] That's the same principle most brands use on us,\n[00:19.08 - 00:20.98] and what you can use for your business too.\n[00:21.92 - 00:25.42] Sell the instant benefit, not the long-term outcome.\n[00:26.24 - 00:28.88] Lose weight in 30 days sounds better than\n[00:28.88 - 00:31.00] avoid health issues in 20 years.\n[00:31.20 - 00:34.70] If you want more sales, make tomorrow's benefits appear today,\n[00:35.04 - 00:36.08] because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Do you want \\$1 million now?' / On-screen at 9 s: \"\\$1000000 now\" (a blurred, faded \"\\$999,112\" is visible mid-transition in the same sample).\n- Transcript: 'Or \\$10 million when you are 70?' / On-screen at 12 s: \"\\$ 10,000,000\"; the phrase 'when you are 70' has no on-screen text.\n- On-screen at 15 s: \"\\$ 1\" (faint); no spoken counterpart.\n- Transcript: 'Lose weight in 30 days' / On-screen at 27 s: a box with a dial and the number \"30\".\n- Audio ends with the fragment 'because...' (35.04-36.08 s); the file is 40.03 s long.\n\n## Visuals\n- Frame 2 (3 s): two toggle switches, one on and one off. Frame 3 (6 s): three progress bars with white knobs and an outline star. Frame 9 (24 s): staircase of bars rising to the upper right. Frame 12 (33 s): square containing a star over a starburst field.\n\n## Statements\n1. \"We humans are absolutely impatient.\"\n2. \"By nature, we want immediate rewards.\"\n3. \"Instead of waiting for future, even bigger rewards.\"\n4. \"Do you want \\$1 million now?\"\n5. \"Or \\$10 million when you are 70?\"\n6. \"The majority of us will go with the immediate reward.\"\n7. \"That's the same principle most brands use on us, and what you can use for your business too.\"\n8. \"Sell the instant benefit, not the long-term outcome.\"\n9. \"Lose weight in 30 days sounds better than avoid health issues in 20 years.\"\n10. \"If you want more sales, make tomorrow's benefits appear today,\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Hypothetical question.\n5. **usable** – Hypothetical question; no time value or risk specified.\n6. **usable** – Claim, unverified: no study.\n7. **usable** – Claim, unverified.\n8. **conditional** – Usable if the instant benefit is real and the long-term outcome is not misrepresented. Required change: no omission of the long-term cost or consequence (gharar).\n9. **not usable** – Presented as the example slogan: a '30 days' weight-loss promise is a result promise without substantiation (ghish). Not usable as a claim unless proven for the product.\n10. **conditional** – Usable only if the benefits actually reach the customer earlier (e.g. first result in the first session). Making a benefit 'appear' that is not delivered is deception (ghish).\n\n## Links\n- [[02-sell-the-after-not-the-what]] – contrast: 02 sells the future transformation, 29 the immediate benefit\n- [[01-reduce-the-pain-of-paying]] – related: trial and low-friction start give an immediate experience\n- [[11-you-sell-emotions-not-the-product]] – related: perceived value vs cost over time\n- [[21-people-want-to-stop-losing]] – related: loss framing for non-action\n- [[37-sell-the-problem-first]] – related: relief now\n- [[covert-influence]]\n- [[immediate-reward-bias]]\n"}, {"id": "30-content-fails-in-the-first-seconds", "kind": "station", "title": "30 – Content fails in the first seconds, not at the end", "path": "stationen/30-content-fails-in-the-first-seconds.md", "text": "---\nid: 30\nsource: quellen/videos/30 (v26044gc0000d8m0tv7og65huudslogg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 21.10\nduration_video_s: 27.20\nconcepts: [attention, call-to-action-dm-comment, first-seconds-hook, social-media-content]\n---\n# 30 – Content fails in the first seconds, not at the end\n## Verbatim\n```text\n[00:00.00 - 00:03.24] Most content fails in the first seconds, not at the end.\n[00:03.76 - 00:09.00] If the brain doesn't immediately know what your content is about, it won't stay long enough to find out.\n[00:09.76 - 00:12.06] That's why the beginning matters even more than the end.\n[00:13.18 - 00:16.56] You gain attention first in order to build understanding later on.\n[00:16.96 - 00:21.10] Comment the word attention if you want to learn why content fails and why it works.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The last spoken line ends at 21.10 s; the file is 27.20 s long.\n\n## Visuals\n- Frame 1 (0 s): horizontal glowing line with a bright dot. Frame 8 (21 s): check mark, play icon and X icon joined by lines, caption \"and why it works\".\n\n## Statements\n1. \"Most content fails in the first seconds, not at the end.\"\n2. \"If the brain doesn't immediately know what your content is about, it won't stay long enough to find out.\"\n3. \"That's why the beginning matters even more than the end.\"\n4. \"You gain attention first in order to build understanding later on.\"\n5. \"Comment the word attention if you want to learn why content fails and why it works.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified; order differs from 24.\n5. **conditional** – Same condition as in 24: state what is offered and what happens to the contact (gharar).\n\n## Links\n- [[24-attention-comes-from-clarity-not-frequency]] – contradicts in order: 24 says attention follows from immediate understanding; 30 says attention first, understanding later\n- [[13-animations-that-turn-your-message-into-a-story]] – same claim: stop people within a few seconds\n- [[25-emotional-content-is-remembered]] – same call to action keyword\n- [[08-open-a-loop-zagarnik-effect]] – related: leaving a gap works only if the first seconds are clear\n- [[attention]]\n- [[call-to-action-dm-comment]]\n- [[first-seconds-hook]]\n- [[social-media-content]]\n"}, {"id": "31-best-product-with-bad-branding-loses", "kind": "station", "title": "31 – The best product with bad branding is outperformed by a worse product with good branding", "path": "stationen/31-best-product-with-bad-branding-loses.md", "text": "---\nid: 31\nsource: quellen/videos/31 (v26044gc0000d8s4jlnog65t7dg69q60.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 58.76\nduration_video_s: 33.04\nconcepts: [brand-perception, product-vs-branding]\n---\n# 31 – The best product with bad branding is outperformed by a worse product with good branding\n## Verbatim\n```text\n[00:00.00 - 00:02.04] This is the reason most businesses fail.\n[00:03.04 - 00:05.56] Most businesses think the best product wins.\n[00:06.30 - 00:08.44] It sounds logical, but the reality is different.\n[00:09.34 - 00:11.58] Instead, it is not the product or the price.\n[00:12.30 - 00:15.04] It is the feeling that your overall presence creates.\n[00:16.20 - 00:18.14] This is why the best product with bad branding\n[00:18.14 - 00:20.88] will be outperformed by a worse product with good branding.\n[00:22.00 - 00:24.04] Yes, focus on your product.\n[00:24.52 - 00:26.78] But more importantly, focus on your branding.\n[00:28.70 - 00:29.22] Because...\n[00:30.00 - 00:36.84] ...\n[00:36.84 - 00:38.84] ...\n[00:38.84 - 00:42.84] ...\n[00:42.84 - 00:44.84] ...\n[00:44.84 - 00:48.86] ...\n[00:48.86 - 00:52.86] ...\n[00:52.86 - 00:58.76] ...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with 'Because...' (28.70-29.22 s). The transcript then contains seven lines of '...' with timestamps 30.00-58.76 s; the video file is 33.04 s long. These entries are Whisper artifacts and carry no speech.\n- duration_s in the front matter is the last transcript timestamp, as specified; the real file length is in duration_video_s.\n\n## Visuals\n- Frame 7 (18 s): outline diamond and an outline tag with a star, caption \"will be outperformed\". Frame 8-9 (21-24 s): the diamond and tag again, larger in frame 9. Frame 10 (27 s): small glowing star, caption \"Because\".\n\n## Statements\n1. \"This is the reason most businesses fail.\"\n2. \"Most businesses think the best product wins.\"\n3. \"It sounds logical, but the reality is different.\"\n4. \"Instead, it is not the product or the price.\"\n5. \"It is the feeling that your overall presence creates.\"\n6. \"This is why the best product with bad branding will be outperformed by a worse product with good branding.\"\n7. \"Yes, focus on your product.\"\n8. \"But more importantly, focus on your branding.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified.\n3. **usable** – Claim, unverified.\n4. **usable** – Claim, unverified; absolute.\n5. **usable** – No checkpoint touched.\n6. **conditional** – Claim, unverified; no case data. Required change: 'good branding' must not be used to sell a worse product under a false claim of quality (ghish).\n7. **usable** – No checkpoint touched.\n8. **usable** – Claim, unverified; ranking of importance.\n\n## Links\n- [[04-there-is-no-winning-product]] – same claim: no winning product, branding decides\n- [[33-people-buy-the-product-they-like-best]] – same claim: people buy the product they like best\n- [[28-same-wine-different-price-experience]] – example of: same product, different perception\n- [[18-halo-effect]] – related: impression colours the whole offer\n- [[09-branding-is-for-any-company]] – related: branding as the main advantage\n- [[brand-perception]]\n- [[product-vs-branding]]\n"}, {"id": "32-conversion-problem-or-traffic-problem", "kind": "station", "title": "32 – You either have a conversion problem or a traffic problem", "path": "stationen/32-conversion-problem-or-traffic-problem.md", "text": "---\nid: 32\nsource: quellen/videos/32 (v26044gc0000d92frj7og65le8301j6g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 51.00\nduration_video_s: 32.03\nconcepts: [traffic-vs-conversion-problem]\n---\n# 32 – You either have a conversion problem or a traffic problem\n## Verbatim\n```text\n[00:00.00 - 00:02.64] 99% of businesses solve the wrong problem.\n[00:03.54 - 00:04.52] You need to keep it simple.\n[00:05.58 - 00:08.64] You either have a conversion problem or a traffic problem.\n[00:09.56 - 00:13.50] People are either not seeing you and you therefore get not enough sales.\n[00:14.32 - 00:19.04] Or people are seeing you and something else is missing so that they don't buy from you.\n[00:19.66 - 00:22.26] Focus on solving traffic and conversion problems.\n[00:23.00 - 00:25.12] Because other problems are no problems.\n[00:25.12 - 00:27.12] Because...\n[00:30.00 - 00:31.00] ...\n[00:31.00 - 00:33.00] ...\n[00:33.00 - 00:35.00] ...\n[00:35.00 - 00:36.88] ...\n[00:36.88 - 00:41.00] ...\n[00:41.02 - 00:43.02] ...\n[00:43.02 - 00:47.00] ...\n[00:47.00 - 00:51.00] ...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends with 'Because...' (25.12-27.12 s). The transcript then contains eight lines of '...' with timestamps 30.00-51.00 s; the video file is 32.03 s long. These entries are Whisper artifacts and carry no speech.\n- duration_s in the front matter is the last transcript timestamp, as specified; the real file length is in duration_video_s.\n\n## Visuals\n- Frame 1 (0 s): six dots in a grid with a cursor arrow over one dot and a circle with an X at the lower right. Frame 8 (21 s): dashed line that becomes a solid line, caption \"and conversion problems\". Frame 9 (24 s): circle with scattered short dashes, caption \"are no problems\".\n\n## Statements\n1. \"99% of businesses solve the wrong problem.\"\n2. \"You need to keep it simple.\"\n3. \"You either have a conversion problem or a traffic problem.\"\n4. \"People are either not seeing you and you therefore get not enough sales.\"\n5. \"Or people are seeing you and something else is missing so that they don't buy from you.\"\n6. \"Focus on solving traffic and conversion problems.\"\n7. \"Because other problems are no problems.\"\n\n## Assessment\n1. **usable** – Claim, unverified: no source for '99%'.\n2. **usable** – No checkpoint touched.\n3. **usable** – Claim as simplification.\n4. **usable** – Definition of the traffic problem.\n5. **usable** – Definition of the conversion problem; 'something else' unspecified.\n6. **usable** – No checkpoint touched.\n7. **conditional** – Claim, unverified; absolute. Required change: legal, ethical and product-quality problems are not dismissed.\n\n## Links\n- [[14-sell-water-to-the-thirsty]] – related: find people who are already looking (traffic) and whose problem is painful\n- [[01-reduce-the-pain-of-paying]] – example of: checkout friction is a conversion problem\n- [[24-attention-comes-from-clarity-not-frequency]] – related: attention (traffic) is not solved by posting more\n- [[15-three-questions-every-customer-asks]] – related: conversion depends on answering what/help/trust\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – related: conversion depends on proving understanding\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "33-people-buy-the-product-they-like-best", "kind": "station", "title": "33 – People don't buy the best product, they buy the product they like best", "path": "stationen/33-people-buy-the-product-they-like-best.md", "text": "---\nid: 33\nsource: quellen/videos/33 (v26044gc0000d9hu69nog65hitdfvhq0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 30.92\nduration_video_s: 34.03\nconcepts: [desired-outcome, emotion-selling, product-vs-branding]\n---\n# 33 – People don't buy the best product, they buy the product they like best\n## Verbatim\n```text\n[00:00.00 - 00:05.80] People don't buy the best product. They buy the product they like best. If you don't understand\n[00:05.80 - 00:11.82] this and you don't focus on the right messaging, your business is preconditioned to fail. People\n[00:11.82 - 00:17.16] only care about your product if they understand the outcome. People don't buy the drill to have\n[00:17.16 - 00:22.74] it in the wall, but to hang the beautiful family painting that they will daily see and be proud\n[00:22.74 - 00:28.30] and happy about it. Make people like you best and that's when your product automatically becomes the\n[00:28.30 - 00:30.92] best product for them.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The last spoken line ends at 30.92 s; the file is 34.03 s long. bild.md lists cell 12 as blank.\n\n## Visuals\n- Frame 6-7 (15-18 s): small drill-shaped icon, caption \"People don't buy the drill\"; then circle and drill icon, caption \"the beautiful family\". Frame 8 (21 s): screen showing people, on wheels, caption \"and be proud\".\n\n## Statements\n1. \"People don't buy the best product. They buy the product they like best.\"\n2. \"If you don't understand this and you don't focus on the right messaging, your business is preconditioned to fail.\"\n3. \"People only care about your product if they understand the outcome.\"\n4. \"People don't buy the drill to have it in the wall, but to hang the beautiful family painting that they will daily see and be proud and happy about it.\"\n5. \"Make people like you best and that's when your product automatically becomes the best product for them.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – Claim, unverified; absolute.\n3. **usable** – Claim, unverified.\n4. **usable** – Example of selling the outcome; permissible product and outcome.\n5. **conditional** – Liking must be earned by true communication. Required change: 'best product for them' only if it actually fits their need; no misleading claim of fit (ghish).\n\n## Links\n- [[31-best-product-with-bad-branding-loses]] – same claim: product is not decisive, perceived feeling is\n- [[02-sell-the-after-not-the-what]] – same mechanism: sell the outcome (the 'after')\n- [[04-there-is-no-winning-product]] – same claim: no winning product\n- [[20-branding-is-the-1p-model-perception]] – contradicts in part: 20 says the product itself 'doesn't matter at all'; 33 says people care about the product when the outcome is understood\n- [[11-you-sell-emotions-not-the-product]] – related: emotion of the goal\n- [[desired-outcome]]\n- [[emotion-selling]]\n- [[product-vs-branding]]\n"}, {"id": "34-one-message-one-offer-one-action", "kind": "station", "title": "34 – One message, one offer, one clear action", "path": "stationen/34-one-message-one-offer-one-action.md", "text": "---\nid: 34\nsource: quellen/videos/34 (v26044gc0000d9nm4nnog65o6sjup3qg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 34.00\nduration_video_s: 37.03\nconcepts: [clarity, memorability, named-brands, single-message-focus]\n---\n# 34 – One message, one offer, one clear action\n## Verbatim\n```text\n[00:00.00 - 00:02.00] Most brands make the same mistake.\n[00:02.00 - 00:06.00] They try to say too much at once.\n[00:06.00 - 00:08.00] Stop and focus.\n[00:08.00 - 00:12.00] It's one message, one offer, one clear action.\n[00:12.00 - 00:16.00] Think about Apple. Their ads don't list 100 features.\n[00:16.00 - 00:18.00] They highlight one powerful benefit.\n[00:18.00 - 00:22.00] Because the more options, the more confusion.\n[00:22.00 - 00:24.00] And confusion kills sales.\n[00:24.00 - 00:28.00] If you want people to remember you, keep it simple.\n[00:28.00 - 00:32.00] One product, one message, and one reason to buy.\n[00:32.00 - 00:34.00] Because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- The transcript timestamps are whole seconds (00:00-00:02, 00:02-00:06 ...); they are given as in transkript.txt.\n- Audio ends with 'Because...' (32.00-34.00 s).\n\n## Visuals\n- Frame 5 (12 s): grey outline Apple logo, caption \"Think about Apple\". Frame 6 (15 s): stack of white horizontal lines, caption \"don't list 100 features\". Frame 8 (21 s): circles containing icons (letter-like shape, play symbol, circular arc, an \"E\" shape). Frame 11 (30 s): circle containing a lightbulb, an envelope and a small box icon.\n\n## Statements\n1. \"Most brands make the same mistake.\"\n2. \"They try to say too much at once.\"\n3. \"Stop and focus.\"\n4. \"It's one message, one offer, one clear action.\"\n5. \"Think about Apple.\"\n6. \"Their ads don't list 100 features.\"\n7. \"They highlight one powerful benefit.\"\n8. \"Because the more options, the more confusion.\"\n9. \"And confusion kills sales.\"\n10. \"If you want people to remember you, keep it simple.\"\n11. \"One product, one message, and one reason to buy.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – No checkpoint touched.\n3. **usable** – No checkpoint touched.\n4. **usable** – No checkpoint touched.\n5. **usable** – Named brand: Apple.\n6. **usable** – Claim, unverified.\n7. **usable** – Claim, unverified.\n8. **usable** – Claim, unverified.\n9. **usable** – Claim, unverified.\n10. **usable** – No checkpoint touched.\n11. **conditional** – 'One reason to buy' must not mean omitting terms, price or conditions (gharar). Required change: one message in the ad, full terms available before purchase.\n\n## Links\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: clarity, effort creates risk\n- [[10-the-five-year-old-rule]] – same mechanism: simplicity converts\n- [[16-illusion-of-innovation]] – contradicts: 16 recommends complexity to create curiosity\n- [[19-sell-to-everyone-sell-to-no-one]] – same mechanism: narrow focus\n- [[08-open-a-loop-zagarnik-effect]] – contrast: 08 leaves a gap on purpose\n- [[clarity]]\n- [[memorability]]\n- [[named-brands]]\n- [[single-message-focus]]\n"}, {"id": "35-make-them-feel-they-found-it", "kind": "station", "title": "35 – Make them feel like they found it, not like you sold it", "path": "stationen/35-make-them-feel-they-found-it.md", "text": "---\nid: 35\nsource: quellen/videos/35 (v26044gc0000d9sob8fog65lnhhiudb0.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 32.24\nduration_video_s: 36.03\nconcepts: [covert-influence, emotion-then-logic, own-idea-feeling]\n---\n# 35 – Make them feel like they found it, not like you sold it\n## Verbatim\n```text\n[00:00.00 - 00:03.28] Nobody wakes up and thinks, I want someone to sell me something today.\n[00:03.72 - 00:06.02] But people buy things every single day.\n[00:06.70 - 00:08.20] The difference here is simple.\n[00:08.84 - 00:12.00] When it feels like your idea, you want to have it.\n[00:12.50 - 00:15.86] But when it feels like their idea, you resist it.\n[00:16.60 - 00:19.48] This is why the best marketers don't push aggressively.\n[00:20.58 - 00:25.78] Instead, they create the conditions where buying feels like the obvious, logical, and personal decision.\n[00:26.52 - 00:28.24] Make them feel like they found it.\n[00:28.24 - 00:30.00] Not like you sold it.\n[00:30.94 - 00:32.24] Because...\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Verified against single frames f_001-f_012: captions match bild.md and the transcript wording (\"and thinks\", \"But people buy things\", \"The difference here\", \"your idea\", \"But when it feels like\", \"aggressively\", \"where buying\", \"and personal decision\", \"Because\"); frames at 15 s and 27 s carry no caption. No wording discrepancy.\n- Audio ends with 'Because...' (30.94-32.24 s); on-screen at 30 s: \"Because\".\n\n## Visuals\n- Frame 1 (0 s): person outline with \"z\" sleep marks. Frame 2 (3 s): person with a speech bubble containing a shopping cart. Frame 4-5 (9-12 s): circle surrounded by outline diamonds, triangles, squares and circles; the same ring with some shapes filled. Frame 8 (21 s): circle containing a shopping cart. Frame 10 (27 s): outline cube.\n\n## Statements\n1. \"Nobody wakes up and thinks, I want someone to sell me something today.\"\n2. \"But people buy things every single day.\"\n3. \"The difference here is simple.\"\n4. \"When it feels like your idea, you want to have it.\"\n5. \"But when it feels like their idea, you resist it.\"\n6. \"This is why the best marketers don't push aggressively.\"\n7. \"Instead, they create the conditions where buying feels like the obvious, logical, and personal decision.\"\n8. \"Make them feel like they found it.\"\n9. \"Not like you sold it.\"\n\n## Assessment\n1. **usable** – Claim, unverified.\n2. **usable** – No checkpoint touched.\n3. **usable** – No checkpoint touched.\n4. **usable** – Claim, unverified.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified. Consistent with avoiding pressure.\n7. **conditional** – Usable via honest information and relevance. Required change: the conditions must not be built from false claims or hidden terms (ghish, gharar).\n8. **conditional** – Usable as content-led discovery. Required change: commercial intent is not hidden (no disguised advertising); the customer's decision is informed.\n9. **conditional** – Same condition as statement 8: the sale is not concealed; ease of discovery is allowed, concealment of the offer is not (ghish).\n\n## Links\n- [[06-priming-makes-people-buy-without-a-word]] – same mechanism: the sale feels like the customer's own idea\n- [[14-sell-water-to-the-thirsty]] – same mechanism: offer feels like relief, not like persuasion\n- [[12-emotions-are-caught-sell-the-feeling-first]] – related: subconscious purchase emotions\n- [[36-confirmation-bias-say-what-people-already-think]] – related: tailoring to existing beliefs to make a message feel natural\n- [[37-sell-the-problem-first]] – contrast: 37 makes the customer feel the pain; 35 avoids pushing\n- [[covert-influence]]\n- [[emotion-then-logic]]\n- [[own-idea-feeling]]\n"}, {"id": "36-confirmation-bias-say-what-people-already-think", "kind": "station", "title": "36 – Confirmation bias: say what people already think", "path": "stationen/36-confirmation-bias-say-what-people-already-think.md", "text": "---\nid: 36\nsource: quellen/videos/36 (v26044gc0000da1in7nog65mm3qbkm1g.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 91.58\nduration_video_s: 90.63\nconcepts: [confirmation-bias, covert-influence, customer-understanding, emotion-then-logic, feeling-understood, social-proof, target-audience-focus]\n---\n# 36 – Confirmation bias: say what people already think\n## Verbatim\n```text\n[00:00.00 - 00:03.84] Use confirmation bias in your marketing to easily manipulate your customers.\n[00:04.96 - 00:07.72] To be simple, say what people already think.\n[00:08.68 - 00:09.84] But let me explain further.\n[00:10.80 - 00:17.24] Confirmation bias is a phenomenon in which people seek information that confirms their already existing beliefs or preferences.\n[00:17.96 - 00:25.04] In marketing, this means tailoring your messages to perfectly match what your customers already believe.\n[00:26.12 - 00:29.44] The first step in incorporating this into your marketing is the most important.\n[00:30.00 - 00:33.12] You have to get to know your customers and your target audience.\n[00:33.84 - 00:37.32] After all, business is about real relationships with real people.\n[00:38.42 - 00:41.94] So, understand their views, their thoughts, and their interests.\n[00:42.90 - 00:45.84] Simply understand what they already believe and how they see the world.\n[00:47.08 - 00:50.22] Next, show how your product aligns with their existing preferences.\n[00:51.14 - 00:55.22] Use familiar language, talk about the same issues, and make them feel understood.\n[00:55.22 - 01:03.36] Then, use testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand.\n[01:04.72 - 01:07.48] This reinforces customers' existing beliefs about your product.\n[01:08.34 - 01:13.48] Finally, present some data, statistics, or studies that support the effectiveness or benefits of your product.\n[01:13.48 - 01:18.68] This provides factual evidence that logically reinforces customers' beliefs in your brand.\n[01:19.40 - 01:24.38] By incorporating confirmation bias into your marketing, you will finally watch your business explode.\n[01:24.38 - 01:26.38] So...\n[01:26.38 - 01:29.38] So...\n[01:29.38 - 01:29.62] I'll see you next time.\n[01:29.62 - 01:30.44] I'll see you next time.\n[01:30.44 - 01:31.58] I'll see you next time.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Verified against all 30 single frames (f_001-f_030). bild.md covers cells 1-24 only; frames 25-30 (72-87 s) read: f_025 \"that support the effectiveness or benefits of your product.\", f_026 \"that logically reinforces customers beliefs in your brand\" (no apostrophe), f_027 no caption (database/chart/document-check graphic with a box), f_028 \"You will finally watch your business explode.\", f_029 no caption (field of specks), f_030 end card with search field \"@ conversion.doc\".\n- Transcript: 'Use confirmation bias in your marketing to easily manipulate your customers.' / On-screen at 0 s: \"in your marketing to easily manipulate your customers.\" (the words 'Use confirmation bias' are not visible in the sampled frame).\n- Transcript: 'To be simple, say what people already think.' / On-screen at 6 s: \"\"Say what people already think.\"\" (quotation marks, 'To be simple' not shown).\n- Transcript: 'This provides factual evidence that logically reinforces customers' beliefs in your brand.' / On-screen at f_026: \"that logically reinforces customers beliefs in your brand\" (apostrophe missing).\n- Transcript: 'By incorporating confirmation bias into your marketing, you will finally watch your business explode.' / On-screen at f_028: \"You will finally watch your business explode.\" (first half not shown).\n- Transcript: 'Next, show how your product aligns with their existing preferences.' / On-screen at 48 s: \"how your product aligns with their existing preferences.\" (without 'Next, show').\n- Audio ends 'So...' (1:24.38-1:26.38, 1:26.38-1:29.38) followed by 'I'll see you next time.' repeated three times (1:29.38-1:29.62, 1:29.62-1:30.44, 1:30.44-1:31.58). The repetition is a Whisper artifact; the video file is 90.63 s long, the last entry ends 0.95 s after the file end. There is no spoken sign-off on screen; f_029 and f_030 carry no caption.\n\n## Visuals\n- The only video with a caption track in small subtitle text at the bottom; frames 1-2: eye with a brain-like iris, eye with a spiral iris. Frame 5-6: Venn diagram of two circles, left with an open book, overlap with a check mark, right with a head and lightbulb. Frame 7: dashboard with bar, donut and line charts and a hand with a magnifier. Frame 8: gavel striking an anvil. Frame 11-12: grid of fifteen head outlines. Frame 13: rows of handshakes and heads. Frames 14-23: head profiles with brain and eye, then two facing heads with concentric arcs. Frames 24-27: database icon linked to a bar chart and a document-check icon above two heads with a box between them. Frame 28: a box with a dashboard drawing and a gavel above.\n\n## Statements\n1. \"Use confirmation bias in your marketing to easily manipulate your customers.\"\n2. \"To be simple, say what people already think.\"\n3. \"But let me explain further.\"\n4. \"Confirmation bias is a phenomenon in which people seek information that confirms their already existing beliefs or preferences.\"\n5. \"In marketing, this means tailoring your messages to perfectly match what your customers already believe.\"\n6. \"The first step in incorporating this into your marketing is the most important.\"\n7. \"You have to get to know your customers and your target audience.\"\n8. \"After all, business is about real relationships with real people.\"\n9. \"So, understand their views, their thoughts, and their interests.\"\n10. \"Simply understand what they already believe and how they see the world.\"\n11. \"Next, show how your product aligns with their existing preferences.\"\n12. \"Use familiar language, talk about the same issues, and make them feel understood.\"\n13. \"Then, use testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand.\"\n14. \"This reinforces customers' existing beliefs about your product.\"\n15. \"Finally, present some data, statistics, or studies that support the effectiveness or benefits of your product.\"\n16. \"This provides factual evidence that logically reinforces customers' beliefs in your brand.\"\n17. \"By incorporating confirmation bias into your marketing, you will finally watch your business explode.\"\n18. \"I'll see you next time.\"\n\n## Assessment\n1. **not usable** – The stated aim is to manipulate customers. Rule 7: the aim is to move a person against their own interest. The technique's usable parts are rated individually in statements 5-17.\n2. **conditional** – Only true statements. Required change: do not reinforce false beliefs held by customers; do not present a falsehood because people already think it.\n3. **usable** – No checkpoint touched.\n4. **usable** – Definition of a named phenomenon; no source cited.\n5. **conditional** – Usable where the belief is true or neutral. Required change: no tailoring to false beliefs; the message to different groups must not contradict itself.\n6. **usable** – No checkpoint touched.\n7. **usable** – Data about customers is collected lawfully and with consent.\n8. **usable** – No checkpoint touched.\n9. **usable** – No checkpoint touched.\n10. **usable** – No checkpoint touched.\n11. **conditional** – Alignment must be real. Required change: only claim a fit that exists (ghish).\n12. **conditional** – Required change: 'make them feel understood' only through real understanding, not feigned empathy.\n13. **conditional** – Testimonials, case studies and reviews must be genuine, verifiable and used with consent; no fabricated or purchased ones; no selective omission that misleads (fabricated social proof, ghish, najsh).\n14. **usable** – Claim, unverified.\n15. **conditional** – Data must be real, cited and not cherry-picked; no study may be cited that does not exist or does not say this (ghish). Claim, unverified.\n16. **conditional** – Holds only if the data are factual (see statement 15).\n17. **conditional** – Result promise; claim, unverified. Required change: remove as a promise (ghish).\n18. **usable** – Sign-off; repeated in the transcript (Whisper artifact).\n\n## Links\n- [[26-use-the-power-of-contrast]] – contradicts in wording: 26 says 'this isn't manipulation', 36 says 'manipulate your customers'\n- [[19-sell-to-everyone-sell-to-no-one]] – same mechanism: mirror the audience, make them feel seen\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – extends: 36 gives the steps to understand customers\n- [[06-priming-makes-people-buy-without-a-word]] – same family: covert influence on beliefs and preferences\n- [[15-three-questions-every-customer-asks]] – same claim: answer 'can I trust it' with evidence\n- [[35-make-them-feel-they-found-it]] – related: make the message feel like the customer's own conclusion\n- [[confirmation-bias]]\n- [[covert-influence]]\n- [[customer-understanding]]\n- [[emotion-then-logic]]\n- [[feeling-understood]]\n- [[social-proof]]\n- [[target-audience-focus]]\n"}, {"id": "37-sell-the-problem-first", "kind": "station", "title": "37 – Sell the problem first and the product sells itself", "path": "stationen/37-sell-the-problem-first.md", "text": "---\nid: 37\nsource: quellen/videos/37 (v26044gc0000dahc7tnog65sgofssecg.MP4)\ncreator: \"@conversion.doc\"\nduration_s: 59.98\nduration_video_s: 30.03\nconcepts: [covert-influence, pain-of-the-problem, problem-first-selling, relief-framing]\n---\n# 37 – Sell the problem first and the product sells itself\n## Verbatim\n```text\n[00:00.00 - 00:03.04] This is how you will make people feel dumb saying no to your product.\n[00:03.76 - 00:06.78] People don't buy solutions. They buy relief.\n[00:07.86 - 00:11.58] First, show them the problem. Make them really feel the pain.\n[00:12.48 - 00:16.40] Then, show how your product solves it without them having to move a finger.\n[00:17.20 - 00:20.50] Because if they don't see the problem, they won't see the value.\n[00:21.16 - 00:24.66] So sell the problem first, and the product sells itself.\n[00:30.00 - 00:59.98] Thank you.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends at 24.66 s; the transcript then contains a line 'Thank you.' with timestamps 30.00-59.98 s; the video file is 30.03 s long. This entry is a Whisper artifact (no speech in the frame range).\n- duration_s in the front matter is the last transcript timestamp, as specified; the real file length is in duration_video_s.\n\n## Visuals\n- Frame 1 (0 s): person outline with a circle above and a circle at right, caption \"people feel dumb\". Frame 4 (9 s): spiral of thin arcs and circles, caption \"Make them\". Frame 5 (12 s): spiky ring with grey and white dots, caption \"show how\".\n\n## Statements\n1. \"This is how you will make people feel dumb saying no to your product.\"\n2. \"People don't buy solutions. They buy relief.\"\n3. \"First, show them the problem.\"\n4. \"Make them really feel the pain.\"\n5. \"Then, show how your product solves it without them having to move a finger.\"\n6. \"Because if they don't see the problem, they won't see the value.\"\n7. \"So sell the problem first, and the product sells itself.\"\n\n## Assessment\n1. **not usable** – The stated aim is to make the customer feel dumb for declining: shaming and pressure. Rule 7: the aim is to move a person against their own interest (shaming and pressure); also order of authority 1 (no humiliation of people, no coercion into a purchase).\n2. **usable** – Claim, unverified.\n3. **conditional** – The problem must be real and relevant to this customer (ghish).\n4. **conditional** – Required change: no exaggeration or fear beyond the real size of the problem (ghish); no use of distress.\n5. **conditional** – 'Without them having to move a finger' is a claim of zero effort. Required change: true only if no effort or hidden cost exists (gharar).\n6. **usable** – Claim, unverified.\n7. **conditional** – Claim, unverified. Required change: no promise that the product 'sells itself' as a guarantee; the problem sold must be real.\n\n## Links\n- [[14-sell-water-to-the-thirsty]] – same mechanism: customers buy relief from an already painful problem\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – same mechanism: a problem well explained is a solution half sold\n- [[21-people-want-to-stop-losing]] – same mechanism: show the pain of standing still\n- [[11-you-sell-emotions-not-the-product]] – related: anti-goal, the emotion of not reaching the goal\n- [[35-make-them-feel-they-found-it]] – contrast: 35 avoids pushing; 37 pushes through pain\n- [[covert-influence]]\n- [[pain-of-the-problem]]\n- [[problem-first-selling]]\n- [[relief-framing]]\n"}, {"id": "38-framing-bundle-pricing-scarcity", "kind": "station", "title": "38 – How to sell anything to anyone: framing, bundle pricing, scarcity", "path": "stationen/38-framing-bundle-pricing-scarcity.md", "text": "---\nid: 38\nsource: quellen/videos/38 (v24044gl0000d5frmg7og65ut01ov6k0.mp4)\ncreator: \"@profaura_\"\nduration_s: 37.50\nduration_video_s: 41.89\nconcepts: [bundle-pricing, fear-of-missing-out, framing-effect, perceived-value, scarcity-effect]\n---\n# 38 – How to sell anything to anyone: framing, bundle pricing, scarcity\n## Verbatim\n```text\n[00:00.00 - 00:01.46] How to sell anything to anyone.\n[00:02.14 - 00:03.38] First, use the framing effect.\n[00:03.88 - 00:08.26] A yogurt that says 20% fat is the same as one that says 80% fat free,\n[00:08.78 - 00:10.42] but the second version sounds more appealing.\n[00:11.12 - 00:13.38] People buy based on how information is framed.\n[00:14.02 - 00:15.76] Second, use bundle pricing.\n[00:16.22 - 00:18.70] Instead of selling one bag and one watch for $49,\n[00:19.34 - 00:22.54] say buy a bag for $49 and get a new watch for free.\n[00:22.94 - 00:24.80] The second option feels like a better deal.\n[00:25.50 - 00:27.54] Lastly, use the scarcity effect.\n[00:27.54 - 00:30.42] A button that says buy now doesn't feel urgent.\n[00:30.88 - 00:32.86] But if you say only a few left in stock,\n[00:33.30 - 00:34.44] people feel more eager to buy.\n[00:35.04 - 00:37.50] The fear of missing out motivates people to act fast.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'one bag and one watch for $49' and 'buy a bag for $49' / On-screen at 18 s and 21 s: \"$30\" (backpack) + \"$19.99\" (watch) \"= $49.99\"; right side \"$49.99\" under the backpack, \"FREE\" under the watch. Audio and screen differ by one cent; the audio also says 'bag', the picture shows a backpack and a smartwatch. The screen shows the backpack priced at $30 in the first version and at $49.99 in the second version.\n- Transcript: 'only a few left in stock' / On-screen at 30 s to 36 s: red badge \"only 5 in stock!\". The number 5 is not spoken.\n- On-screen at 0 s: green bar with \"$ 18,364\" and \"sales\", caption \"anyone\". Not in the audio; the figure has no source or explanation on screen. Not an own claim of the video that can be checked [unclear].\n- On-screen at 24 s: \"3.\" The audio says 'Lastly' at 25.50 s; \"1.\" and \"2.\" are not shown in the sampled cells.\n- On-screen caption at 12 s \"People buy based on how information is framed.\" and at 36 s \"The fear of missing out motivates people to act fast.\" match the audio (11.12-13.38 s and 35.04-37.50 s). No other sentence of the audio is shown as caption text.\n- The audio has no 'Thank you' or other artifact lines. The file is 41.89 s long; speech ends at 37.50 s; the end card is shown from about 39 s.\n\n## Visuals\n- Frame 3 (6 s): two drawn yogurt cups, \"20% fat\" and \"80% fat-free\". Frame 4 (9 s): the left cup is dimmed, the right cup glows.\n- Frame 8 (21 s): split screen, left backpack \"$30\" plus watch \"$19.99\" \"= $49.99\", right backpack \"$49.99\" plus watch \"FREE\" \"= $49.99\".\n- Frame 11 (30 s): drawn browser window with a sneaker, \"$100\", \"buy now\", a red badge \"only 5 in stock!\" grows over the sneaker; frame 12 (33 s): badge small, cursor on \"buy now\".\n- No people. Drawn objects, dark background, TikTok watermark \"@ profaura_\".\n\n## Statements\n1. \"How to sell anything to anyone.\"\n2. \"First, use the framing effect.\"\n3. \"A yogurt that says 20% fat is the same as one that says 80% fat free,\"\n4. \"but the second version sounds more appealing.\"\n5. \"People buy based on how information is framed.\"\n6. \"Second, use bundle pricing.\"\n7. \"Instead of selling one bag and one watch for \\$49,\"\n8. \"say buy a bag for \\$49 and get a new watch for free.\"\n9. \"The second option feels like a better deal.\"\n10. \"Lastly, use the scarcity effect.\"\n11. \"A button that says buy now doesn't feel urgent.\"\n12. \"But if you say only a few left in stock,\"\n13. \"people feel more eager to buy.\"\n14. \"The fear of missing out motivates people to act fast.\"\n\n## Assessment\n1. **conditional** – 'Anything to anyone' is an absolute promise (rule 5, exaggeration) and ignores the limit of the product. Required change: only halal products (order of authority 1, rule 15: selling to everyone is allowed as long as the product is halal); no promise that a technique sells anything.\n2. **usable** – Names a technique. The use is judged in statements 3-5.\n3. **usable** – The two wordings state the same fact (20% fat = 80% fat free), so both are true. Claim about the equivalence is arithmetic. Usable as long as both frames state the same true fact.\n4. **usable** – Claim, unverified: no study named. Consistent with rule 7 only while both wordings are true.\n5. **conditional** – Claim, unverified. Required change: framing may choose the positive wording only when the fact is identical and nothing is hidden (rule 7, rule 1 deception, rule 3 gharar); no frame that leaves out a cost, a limit or a risk.\n6. **usable** – Names a technique. The use is judged in statements 7-9.\n7. **usable** – Describes selling two items together for one price; no checkpoint touched. Note: audio $49, screen $49.99.\n8. **not usable** – As shown, the offer is the same price (screen: $49.99 = $49.99), the bag is relabelled from $30 to $49.99 and the watch is called \"free\" although it is paid inside that price. 'Free' for something included in the price is a false claim (rule 1, ghish) and an artificial price anchor (rule 4, najsh); the real price of the bag is hidden (rule 3). A permissible bundle says: bag and watch together for the real bundle price, with the real single prices shown, if the bundle is really cheaper. Only a watch that truly costs nothing extra may be called free.\n9. **conditional** – Claim, unverified. Usable only if the second option is a better deal in fact. Required change: the saving must be real and stated with the real single prices (rule 4, rule 1). Making an identical offer 'feel' better by relabelling is not allowed (rule 7: not against the customer's interest; rule 1).\n10. **conditional** – Names a technique. Required change: scarcity may be used only when real (rule 1, rule 4); see statements 12-14.\n11. **usable** – Claim, unverified.\n12. **conditional** – Required change: 'only a few left' only when it is true and current; the number shown (\"only 5\") must be the real stock, no counters that are invented, reset or permanent (rule 1, rule 4, rule 6: nothing concealed). No countdown or stock text as a pressure tool without a basis.\n13. **conditional** – Claim, unverified. Same condition as statement 12: the eagerness may only follow from real scarcity (rule 1, rule 7).\n14. **conditional** – Claim, unverified. Fear of missing out is acceptable only about real, verifiable limits (rule 1, rule 4, rule 7: not to move a person against their own interest). Not allowed for decisions that need time or a clear trial and price (rule 3, gharar). See [[fear-of-missing-out]].\n\n## Links\n- [[11-you-sell-emotions-not-the-product]] – same claim: fear of missing out; 11 names it as an effect of picturing the goal, 38 ties it to stock text\n- [[26-use-the-power-of-contrast]] – same mechanism: reference prices; the bundle example uses a changed price for the same bag, which 26 allows only if the anchor is real (rule 4)\n- [[21-people-want-to-stop-losing]] – related: loss framing, here a missed chance as the loss\n- [[01-reduce-the-pain-of-paying]] – related: how a price or offer is presented changes the felt cost\n- [[22-price-is-never-the-problem]] – related: perceived value decides, here presented as 'feels like a better deal'\n- [[29-sell-the-instant-benefit]] – related: the same product framed differently\n- [[36-confirmation-bias-say-what-people-already-think]] – related: techniques that work through presentation, with the same ghish checkpoint\n- [[bundle-pricing]]\n- [[fear-of-missing-out]]\n- [[framing-effect]]\n- [[perceived-value]]\n- [[scarcity-effect]]\n"}, {"id": "39-people-scan-they-dont-read", "kind": "station", "title": "39 – People don't read, they scan: make websites and ads scannable", "path": "stationen/39-people-scan-they-dont-read.md", "text": "---\nid: 39\nsource: quellen/videos/39 (v14044g50000d0urtonog65g9hiuanq0.mp4)\ncreator: \"@oktocreative\"\nduration_s: 19.86\nduration_video_s: 24.22\nconcepts: [attention, clarity, scannable-content, social-media-content]\n---\n# 39 – People don't read, they scan: make websites and ads scannable\n## Verbatim\n```text\n[00:00.00 - 00:03.96] A marketing secret you must never ignore is that people don't read, they scan.\n[00:04.42 - 00:06.86] Most people read in the F and Z shaped patterns.\n[00:07.32 - 00:11.10] Your eyes go from 1 to 2 to 3 to 4 and finally to 5.\n[00:11.50 - 00:14.60] The words in your text don't have to be spelled correctly to be understood.\n[00:15.16 - 00:17.46] Therefore, while building a website, make it scannable.\n[00:17.76 - 00:19.86] And while making an ad, make it scannable too.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'Your eyes go from 1 to 2 to 3 to 4 and finally to 5.' / On-screen: the \"F\" diagram has five numbered points (1 to 5); the \"Z\" image (18 s) has only four numbered points (1 to 4). The numbering 1 to 5 fits the F, not the Z.\n- Transcript: 'The words in your text don't have to be spelled correctly to be understood.' / On-screen at 12 s: the same sentence in jumbled spelling: \"The wrods in yuor txet dno't hvae to be sepelld corecrtly to be unedsrtood.\" The first and last letter of each word are in place, inner letters are swapped. The on-screen sentence has the same words as the audio.\n- On-screen at 0 s: \"You Must / Never Ignore\" is the tail of the audio sentence; the start ('A marketing secret') is not shown in the sampled cell. The watermark overlaps the left edge of the first word, which is partly [unclear].\n- On-screen at 3 s: \"Most\" with a crowd icon; the audio has 'Most people read in the F and Z shaped patterns' at 4.42 s. The caption words in the cells (your, finally, spelled, website, scannable) are single words from the audio.\n- On-screen shop page at 15 s is a third-party web page (Apple store); its text is partly [unclear] (small print). No audio statement refers to it directly; the audio says 'while building a website, make it scannable'.\n- The audio has no artifact lines. File length 24.22 s, speech ends at 19.86 s, end card from about 21 s.\n\n## Visuals\n- Frame 2 (3 s): crowd of grey person icons. Frames 3 and 4 (6 s and 9 s): an F drawn with five numbered circles and arrows.\n- Frame 5 (12 s): large jumbled-spelling sentence. Frame 6 (15 s): shop web page screenshot. Frame 7 (18 s): gaze heat map on an image with a Z path through four numbered points.\n- White background with black text, in contrast to the dark background of the stations 38, 40, 41, 42. TikTok watermark \"@ oktocreative\".\n\n## Statements\n1. \"A marketing secret you must never ignore is that people don't read, they scan.\"\n2. \"Most people read in the F and Z shaped patterns.\"\n3. \"Your eyes go from 1 to 2 to 3 to 4 and finally to 5.\"\n4. \"The words in your text don't have to be spelled correctly to be understood.\"\n5. \"Therefore, while building a website, make it scannable.\"\n6. \"And while making an ad, make it scannable too.\"\n\n## Assessment\n1. **usable** – Claim, unverified; a generalisation ('people don't read'). No checkpoint touched.\n2. **usable** – Claim, unverified: no study or source named; F and Z are named as patterns without further proof. Treat as a tendency, not a law.\n3. **conditional** – The sequence 1 to 5 is true only of the drawn F; the Z image has four points. Claim, unverified. Required change: describe the pattern as a tendency, not as an exact path of five stops.\n4. **conditional** – Claim, unverified and shown with inner letters swapped only, not with real m
