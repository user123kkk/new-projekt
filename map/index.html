isspelling; the video gives no study. Required change: do not take this as permission for spelling errors in own texts; use it, if at all, as a demonstration that fast readers cope with small errors. No GRUNDSATZ rule is touched; the change concerns the accuracy of the claim and trust (see [[27-the-more-people-think-the-less-they-trust]]).\n5. **usable** – Instruction; no checkpoint touched.\n6. **usable** – Instruction; running ads on platforms is allowed (rule 12); no checkpoint touched.\n\n## Links\n- [[24-attention-comes-from-clarity-not-frequency]] – same mechanism: attention follows what is understood immediately\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: less effort for the reader, more trust\n- [[10-the-five-year-old-rule]] – same mechanism: simple, quickly understood messages convert\n- [[30-content-fails-in-the-first-seconds]] – related: readers and viewers decide in the first seconds\n- [[34-one-message-one-offer-one-action]] – related: one clear point per page or ad\n- [[13-animations-that-turn-your-message-into-a-story]] – related: visual structure for fast understanding\n- [[attention]]\n- [[clarity]]\n- [[scannable-content]]\n- [[social-media-content]]\n"}, {"id": "40-four-buying-stages-schwartz", "kind": "station", "title": "40 – Know the buying stage of your audience: unaware, problem aware, solution aware, product aware", "path": "stationen/40-four-buying-stages-schwartz.md", "text": "---\nid: 40\nsource: quellen/videos/40 (v24044gl0000d7igdn7og65jo27gb1m0.mp4)\ncreator: \"@profaura_\"\nduration_s: 64.84\nduration_video_s: 56.45\nconcepts: [awareness-stages, customer-understanding, existing-demand, social-media-content]\n---\n# 40 – Know the buying stage of your audience: unaware, problem aware, solution aware, product aware\n## Verbatim\n```text\n[00:00.00 - 00:03.78] If you want to make content that makes you loads of money, you need to know what buying\n[00:03.78 - 00:05.50] stage your audience is in.\n[00:05.50 - 00:10.40] The famous marketer Eugene Schwartz talks about the four major ones, unaware, problem\n[00:10.40 - 00:13.52] aware, solution aware, and product aware.\n[00:13.52 - 00:16.40] And each stage requires different types of content.\n[00:16.40 - 00:20.46] For example, unaware would be you having a stomach ache, but not knowing why.\n[00:20.46 - 00:24.18] So you go onto YouTube and search, why do I have a stomach ache?\n[00:24.18 - 00:30.18] And in the video, it says, you have an unhealthy gut, so now you're aware of the problem.\n[00:30.18 - 00:34.10] Next, you'll go onto Google and search how to improve gut health.\n[00:34.10 - 00:36.68] And in that video, it will show you solutions.\n[00:36.68 - 00:38.18] So now you're solution aware.\n[00:38.18 - 00:41.56] Then you'll start looking at products that improve gut health.\n[00:41.56 - 00:43.36] Now you're product aware.\n[00:43.36 - 00:46.80] As you can see, each stage requires different types of content.\n[00:46.80 - 00:51.14] Your job is to identify what stage your audience is in, so you can make content that converts\n[00:51.14 - 00:53.14] them into paying clients.\n[00:54.18 - 00:55.68] Thank you very much.\n[00:55.68 - 00:56.68] Thank you.\n[00:56.68 - 00:59.68] Thank you.\n[00:59.68 - 01:00.76] Thank you.\n[01:00.76 - 01:04.70] Thank you.\n[01:04.70 - 01:04.84] Thank you.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends at 53.14 s ('...paying clients.'). The lines 'Thank you very much.' and 'Thank you.' (54.18-01:04.84, six entries) are a Whisper artifact (no speech inferable; the screen shows the end card from about 51 s). The file is 56.45 s long; duration_s in the front matter is the last transcript timestamp, as specified.\n- The sentence 'so you can make content that converts them into paying clients' (about 51-53 s) is spoken over the end card (cells 18 and 19): no on-screen text for it.\n- Transcript: 'Eugene Schwartz' / On-screen at 6 s to 12 s: \"Eugence schwartz\" (misspelled, lower-case s).\n- Transcript: 'you having a stomach ache, but not knowing why' / On-screen at 18 s: \"you having a stomach ache but not known\".\n- Transcript: 'the four major ones, unaware, problem aware, solution aware, and product aware' / On-screen at 12 s and 42 s: the same four names. Note outside the video, to be checked before any attribution: Schwartz's model is commonly described with five stages (the fifth is 'most aware'). The video says four.\n- Transcript: after the video the person is 'aware of the problem', then 'go onto Google and search how to improve gut health', video 'will show you solutions', then 'looking at products that improve gut health'. On-screen at 39 s: Google search bar \"Foods that improve gut healt\" (cut off) under the caption \"gut health\". On-screen table at 45 s: each stage is paired with a search: Unaware \"Why do i have a stomach ache?\", Problem aware \"How can i imrpove gut health?\", Solution aware \"Foods that improve gut health?\", Product aware \"Where to buy organic berries?\" (misspelled \"imrpove\" on screen). The table pairs the query with the stage the person is in; the audio narrates the search that leads to the next stage. 'Organic berries' is not in the audio.\n- Transcript: 'And in the video, it says, you have an unhealthy gut' / On-screen at 24 s and 33 s: only a blank video placeholder, no text.\n- On-screen at 0 s: blurred grey objects on white [unclear]; the audio says 'make content that makes you loads of money'.\n\n## Visuals\n- Frame 3 (6 s): black-and-white photo of a real man in an office chair, caption \"Eugence schwartz\". Frames 4 and 5 (9 s and 12 s): the four stages appear as a list under the photo.\n- Frames 8 to 14 (21 s to 39 s): YouTube logo with search bar, video placeholder with play button, \"problem aware\", Google logo with search bar, blank video placeholder, \"solution aware\", Google search with typed text.\n- Frames 15 and 16 (42 s and 45 s): table of the four stages with arrows to four search bars. Frame 17 (48 s): white screen \"your audience is in\".\n- Dark background, white text, teal accents, TikTok watermark \"@ profaura_\", end card from about 51 s.\n\n## Statements\n1. \"If you want to make content that makes you loads of money, you need to know what buying stage your audience is in.\"\n2. \"The famous marketer Eugene Schwartz talks about the four major ones, unaware, problem aware, solution aware, and product aware.\"\n3. \"And each stage requires different types of content.\"\n4. \"For example, unaware would be you having a stomach ache, but not knowing why.\"\n5. \"So you go onto YouTube and search, why do I have a stomach ache?\"\n6. \"And in the video, it says, you have an unhealthy gut, so now you're aware of the problem.\"\n7. \"Next, you'll go onto Google and search how to improve gut health.\"\n8. \"And in that video, it will show you solutions.\"\n9. \"So now you're solution aware.\"\n10. \"Then you'll start looking at products that improve gut health.\"\n11. \"Now you're product aware.\"\n12. \"As you can see, each stage requires different types of content.\"\n13. \"Your job is to identify what stage your audience is in, so you can make content that converts them into paying clients.\"\n\n## Assessment\n1. **conditional** – 'Content that makes you loads of money' is an earnings promise without proof (rule 1, rule 5). Required change: not used as a promise to customers; the core (know the audience's stage before making content) is usable.\n2. **conditional** – Attribution to a named person: claim, unverified. Required change: check the model and the number of stages against the original source before naming it (the video says four, the model is commonly described with five); name the source correctly; the photograph of the real person is not reused (rule 9).\n3. **usable** – Claim, unverified; no checkpoint touched.\n4. **usable** – Example describing a stage; no checkpoint touched. For reuse choose a non-medical example, no diagnosis or health claim (rule 1, rule 5).\n5. **usable** – Hypothetical example; names the platform YouTube.\n6. **conditional** – The hypothetical video diagnoses 'an unhealthy gut' from a stomach ache. Required change: not reused as a statement of fact or advice; use a non-medical example or mark it as invented (rule 1).\n7. **usable** – Hypothetical example; names the platform Google.\n8. **usable** – Claim, unverified.\n9. **usable** – Names a stage; no checkpoint touched.\n10. **usable** – Names a stage; no checkpoint touched. For reuse with health products, claims about effects only when proven (rule 1, rule 5).\n11. **usable** – Names a stage; no checkpoint touched.\n12. **usable** – Repeats statement 3.\n13. **conditional** – 'Identify the stage' is usable. Required change: the stage is found by real research on the audience, not assumed (see [[customer-understanding]]); no guarantee of conversion; content moves people by true information and a clear offer with price and terms, not against their interest (rule 7, rule 3).\n\n## Links\n- [[14-sell-water-to-the-thirsty]] – extends: 14 says go to people who already look for a solution; 40 adds the stage in which they look. Contradicts in part: 14 says most marketing fails because it tries to create demand; the 'unaware' stage of 40 is an audience without demand yet that content should still address\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – same mechanism: the 'problem aware' stage is the one in which a well-explained problem helps\n- [[37-sell-the-problem-first]] – related: showing the problem moves people from unaware to problem aware\n- [[15-three-questions-every-customer-asks]] – related: 'what is this, will it help me, can I trust it' fits the later stages\n- [[36-confirmation-bias-say-what-people-already-think]] – related: know the target audience before choosing the message\n- [[19-sell-to-everyone-sell-to-no-one]] – related: one audience with one situation\n- [[32-conversion-problem-or-traffic-problem]] – related: content that converts, matched to the stage\n- [[awareness-stages]]\n- [[customer-understanding]]\n- [[existing-demand]]\n- [[social-media-content]]\n"}, {"id": "41-say-the-negative-first", "kind": "station", "title": "41 – Say the negative first and end with the positive", "path": "stationen/41-say-the-negative-first.md", "text": "---\nid: 41\nsource: quellen/videos/41 (v24044gl0000d799e2fog65picsbnk8g.mp4)\ncreator: \"@profaura_\"\nduration_s: 30.04\nduration_video_s: 34.34\nconcepts: [guarantee, memorability, negative-first-ordering]\n---\n# 41 – Say the negative first and end with the positive\n## Verbatim\n```text\n[00:00.00 - 00:03.80] Psychology says if you want more sales, you should say the negative first.\n[00:04.40 - 00:06.80] For example, notice the difference when I say,\n[00:07.24 - 00:10.34] our product is the best in the world, but it's really expensive,\n[00:10.88 - 00:15.78] versus when I say, our product is really expensive, but it is the best in the world.\n[00:16.42 - 00:17.34] Here's another example.\n[00:18.10 - 00:20.62] You'll get your money back if you don't see the results you want.\n[00:21.28 - 00:24.46] Or, if you don't see the results you want, you'll get your money back.\n[00:25.00 - 00:27.16] Start with the negative and end with the positive,\n[00:27.16 - 00:30.04] because people remember the last thing you say most.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'our product is the best in the world, but it's really expensive' / On-screen at 9 s: \"our product is the best in the world / but it's expensive\" ('really' is not on screen).\n- Transcript: 'our product is really expensive, but it is the best in the world' / On-screen at 15 s: \"our product is expensive, / but it's the best in the world\" ('really' and 'it is' differ).\n- Transcript: 'You'll get your money back if you don't see the results you want.' / On-screen at 21 s: \"you'll get your money back / if you dont see the result you want\" ('don't' without apostrophe, 'result' singular).\n- Transcript: 'Or, if you don't see the results you want, you'll get your money back.' / On-screen at 21 s: only \"if you dont\" is typed in the sampled cell; the rest of the second wording is [unclear] (not shown in any sampled cell).\n- Transcript: 'Start with the negative and end with the positive' / On-screen at 24 s: \"postive first\" (sic) on the left and \"negative last\" on the right, with a line between, dimmed grey. This reads as the opposite order of the audio. One sampled cell only; it may be a fading or transition state [unclear]. Not corrected.\n- On-screen \"remember\" at 27 s matches 'people remember the last thing you say most'.\n- The audio has no artifact lines. File length 34.34 s, speech ends at 30.04 s, end card from about 30 s.\n- The prohibition icon is shown next to the first wording of each pair and the green check next to the second wording (15 s); the audio does not say 'bad' or 'good'.\n\n## Visuals\n- Frame 3 (6 s): framed dark box, text typing. Frame 4 (9 s): red prohibition icon above \"our product is the best in the world / but it's expensive\". Frame 6 (15 s): both wordings, prohibition icon over the first, green check over the second.\n- Frames 7 and 8 (18 s and 21 s): money-back wording typing, prohibition icon over the first wording. Frame 9 (24 s): \"postive first\" and \"negative last\". Frame 10 (27 s): \"remember\".\n- Black background with white text, white background in the first cell, no people, TikTok watermark \"@ profaura_\".\n\n## Statements\n1. \"Psychology says if you want more sales, you should say the negative first.\"\n2. \"For example, notice the difference when I say, our product is the best in the world, but it's really expensive,\"\n3. \"versus when I say, our product is really expensive, but it is the best in the world.\"\n4. \"Here's another example.\"\n5. \"You'll get your money back if you don't see the results you want.\"\n6. \"Or, if you don't see the results you want, you'll get your money back.\"\n7. \"Start with the negative and end with the positive,\"\n8. \"because people remember the last thing you say most.\"\n\n## Assessment\n1. **conditional** – 'Psychology says' names no source; claim, unverified. Required change: the negative is a real fact (price, limit, risk) that is stated completely, not a rhetorical device to cover something else (rule 3, gharar; rule 7).\n2. **conditional** – The ordering is the example. 'The best in the world' is a superlative that needs proof (rule 5). Required change: replace it with a claim that can be proven.\n3. **conditional** – Same as statement 2: ordering usable; 'the best in the world' only with proof (rule 5). 'Really expensive' states the price honestly, which is usable (rule 3).\n4. **usable** – Announces the next example; no checkpoint touched.\n5. **conditional** – Core is a money-back guarantee (see [[guarantee]]). Required change: the guarantee must be real, honoured, with plain conditions: period, what counts as 'the results you want', how to claim and how fast the refund comes (rule 1, rule 3, gharar). 'Results you want' is subjective; define it.\n6. **conditional** – Same promise in a different order; same condition as statement 5.\n7. **conditional** – Usable as an order for true information. Required change: the negative (price, conditions, limits) is stated fully and clearly and is not drowned by a positive ending; the positive ending is true (rule 3, rule 7, rule 1).\n8. **usable** – Claim, unverified (no study named): the last thing said is remembered most. Note: contradicts [[30-content-fails-in-the-first-seconds]] ('the beginning matters even more than the end').\n\n## Links\n- [[01-reduce-the-pain-of-paying]] – extends: 01 names guarantees; 41 gives the wording of a money-back guarantee\n- [[30-content-fails-in-the-first-seconds]] – contradicts: 30 says the beginning matters more than the end, 41 says the last thing said is remembered most\n- [[25-emotional-content-is-remembered]] – related: what is remembered\n- [[22-price-is-never-the-problem]] – related: 'really expensive' is named openly, then answered with value\n- [[27-the-more-people-think-the-less-they-trust]] – related: naming the negative first can reduce uncertainty (not said in the video)\n- [[26-use-the-power-of-contrast]] – related: the same two facts compared in a different order\n- [[37-sell-the-problem-first]] – related: the negative comes first there as well, but as a customer problem\n- [[guarantee]]\n- [[memorability]]\n- [[negative-first-ordering]]\n"}, {"id": "42-sell-the-human-desire-behind-the-product", "kind": "station", "title": "42 – Don't sell the product, sell the human desire behind it", "path": "stationen/42-sell-the-human-desire-behind-the-product.md", "text": "---\nid: 42\nsource: quellen/videos/42 (v24044gl0000d762p8nog65tpfj01bb0.mp4)\ncreator: \"@profaura_\"\nduration_s: 61.24\nduration_video_s: 52.71\nconcepts: [desired-outcome, emotion-selling]\n---\n# 42 – Don't sell the product, sell the human desire behind it\n## Verbatim\n```text\n[00:00.00 - 00:01.76] This video is selling a cutting board.\n[00:01.96 - 00:05.00] These are the nicest cutting boards I have ever owned in my life.\n[00:05.06 - 00:10.18] It got 900 views, while this video is selling the human desire to take care of our loved ones.\n[00:11.00 - 00:12.16] You see these flakes?\n[00:12.38 - 00:13.88] This is going in your family's food.\n[00:14.04 - 00:15.40] These are microplastics.\n[00:15.54 - 00:16.72] Seriously, what are we doing to ourselves?\n[00:16.92 - 00:18.34] It got 29 million views.\n[00:18.72 - 00:20.16] This video is selling tank tops.\n[00:20.38 - 00:21.50] That's what let me get behind.\n[00:21.70 - 00:22.74] I am that guy for real.\n[00:22.78 - 00:23.62] Must I remind you?\n[00:23.68 - 00:28.28] It got 500 views, while this video is selling the human desire for social approval.\n[00:28.28 - 00:28.92] Not good.\n[00:29.02 - 00:29.56] This is good.\n[00:29.56 - 00:30.16] Not good.\n[00:30.22 - 00:30.78] This is good.\n[00:30.86 - 00:31.32] Not good.\n[00:31.40 - 00:31.92] This is good.\n[00:32.04 - 00:33.26] This is how your white beater should fit.\n[00:33.34 - 00:35.64] Because anytime you see somebody that actually looks good in a white beater.\n[00:35.78 - 00:37.06] Got 7 million views.\n[00:37.34 - 00:40.08] As crazy as it sounds, people don't want the product.\n[00:40.36 - 00:42.56] They just want to satisfy their basic human needs.\n[00:43.02 - 00:45.36] And your product is the vehicle to get them there.\n[00:45.66 - 00:46.76] So don't sell the product.\n[00:47.12 - 00:48.62] Sell the human desire behind it.\n[00:48.62 - 00:48.76] So don't sell it.\n[00:48.76 - 00:54.00] This is how your wife'll get them there.\n[00:54.00 - 00:54.24] So don't you?\n[00:54.24 - 00:55.44] Tell us all about me.\n[00:55.44 - 00:56.06] I can try it.\n[00:56.06 - 00:56.86] Bye.\n[00:56.86 - 00:57.38] So thank you.\n[00:57.38 - 00:59.14] What are these emotions, guys?\n[00:59.14 - 01:00.96] I want you to win.\n[01:00.96 - 01:01.24] Arrange tonight.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Voices: the transcript mixes the narrator and the speech of four embedded third-party clips. On screen, plain captions are the narrator; captions in quotation marks and italics are clip speech (\"owned\", \"in your families food\", \"to ourselves\", \"not good\", \"this is good\", \"that actually looks good\"). The assignment of the other lines is by content and is [unclear] for these: 'You see these flakes?', 'These are microplastics.', 'Seriously, what are we doing to ourselves?' (clip 2); 'That's what let me get behind.', 'I am that guy for real.', 'Must I remind you?' (clip 3, [unclear], probably transcription errors); 'This is how your white beater should fit.', 'Because anytime you see somebody that actually looks good in a white beater.' (clip 4).\n- Transcript: 'the nicest cutting boards I have ever owned in my life' / On-screen at 3 s: clip subtitle \"OWNED IN MY LIFE\".\n- Transcript: 'This is going in your family's food.' / On-screen at 12 s: \"in your families food\" (no apostrophe).\n- On-screen at 6 s to 12 s inside the clip: \"You're eating plastic?!\" with emojis. Not in the transcript (not spoken or not recognised) [unclear].\n- Transcript: 'Not good. This is good.' three times (28.92-31.92 s) / On-screen at 27 s, 30 s, 33 s: \"not good\", \"this is good\", \"that actually looks good\".\n- On-screen at 21 s: \"(music playing)\" is a burned-in subtitle of the clip, i.e. that clip has music. The narrator audio has no such label.\n- The numbers 900, 29 million, 500 and 7 million are only in the audio; no sampled cell shows a view count. Source and platform of the numbers are not stated.\n- Artifact: after 'Sell the human desire behind it.' (47.12-48.62 s) the transcript has garbled lines from 48.62 s to 01:01.24 ('So don't sell it.', 'This is how your wife'll get them there.', 'So don't you?', 'Tell us all about me.', 'I can try it.', 'Bye.', 'So thank you.', 'What are these emotions, guys?', 'I want you to win.', 'Arrange tonight.'). They do not match anything on screen (cells 17 and 18 are the end card from about 48 s) and are taken as Whisper artifacts. The file is 52.71 s long; duration_s in the front matter is the last transcript timestamp, as specified.\n- On-screen at 45 s: \"sell\" above, \"product\" below with a red strike-through over \"pro\" only (animation mid-state, [unclear]). The audio says 'So don't sell the product.'\n- The sentence 'Sell the human desire behind it.' (47.12-48.62 s) has no caption text in the sampled cells (cell 17 at 48 s shows the logo only) [unclear].\n- Heading on every content cell: \"selling the product vs. selling human desire\". It is not spoken in the audio in these words.\n\n## Visuals\n- Frames 1 and 2 (0 s and 3 s): phone-format clip of wooden cutting boards on a counter. Frames 3 to 6 (6 s to 15 s): bearded man in a cap cutting a red plastic board, holding up a scrap with white flakes.\n- Frames 7 and 8 (18 s and 21 s): man in a white sleeveless shirt lifting the shirt, then standing. Frames 9 to 12 (24 s to 33 s): curly-haired tattooed man in a white sleeveless shirt, close-up and half figure, with two small inset photos of other men.\n- Frames 14 to 16 (39 s to 45 s): black screens with \"they\", \"your product\" and \"sell product\" with strike-through.\n- Real people in all clip cells. Dark background, heading with teal tag \"vs.\", TikTok watermark \"@ profaura_\", end card from about 48 s.\n\n## Statements\n1. \"This video is selling a cutting board.\"\n2. \"These are the nicest cutting boards I have ever owned in my life.\" [clip speech]\n3. \"It got 900 views, while this video is selling the human desire to take care of our loved ones.\"\n4. \"You see these flakes?\" [clip speech]\n5. \"This is going in your family's food.\" [clip speech]\n6. \"These are microplastics.\" [clip speech]\n7. \"Seriously, what are we doing to ourselves?\" [clip speech]\n8. \"It got 29 million views.\"\n9. \"This video is selling tank tops.\"\n10. \"That's what let me get behind.\" [clip speech, [unclear]]\n11. \"I am that guy for real.\" [clip speech]\n12. \"Must I remind you?\" [clip speech]\n13. \"It got 500 views, while this video is selling the human desire for social approval.\"\n14. \"Not good.\" [clip speech, said three times]\n15. \"This is good.\" [clip speech, said three times]\n16. \"This is how your white beater should fit.\" [clip speech]\n17. \"Because anytime you see somebody that actually looks good in a white beater.\" [clip speech]\n18. \"Got 7 million views.\"\n19. \"As crazy as it sounds, people don't want the product.\"\n20. \"They just want to satisfy their basic human needs.\"\n21. \"And your product is the vehicle to get them there.\"\n22. \"So don't sell the product.\"\n23. \"Sell the human desire behind it.\"\n\n## Assessment\n1. **usable** – Describes a third-party video; no checkpoint touched.\n2. **conditional** – Third-party testimonial with a superlative ('nicest ever'). Required change: reusable only as a real customer's statement with consent; superlatives only with proof (rule 5, rule 1: no invented reviews).\n3. **conditional** – Claim, unverified: view numbers have no source, and the two videos differ in creator, audience and topic, so the numbers do not prove the cause. Required change: not used as proof of the technique; only own, verified data (rule 1, rule 5). The desire named (to look after one's family) is legitimate.\n4. **conditional** – Demonstration. Required change: any demonstration must be real and shown as it is (rule 1).\n5. **conditional** – A health fear aimed at the family, claim unverified. Required change: usable only when the harm is real, proven and stated in its real size; no fear beyond the facts (rule 1, rule 7: not to move a person against their own interest).\n6. **conditional** – Factual claim, unverified. Required change: only if the shown flakes are actually microplastics and the claim can be backed with a source (rule 1, rule 5).\n7. **conditional** – Rhetorical question that puts guilt on the viewer. Required change: no shaming or guilt as a sales lever (rule 7; compare station 37, statement 1).\n8. **conditional** – Claim, unverified; same condition as statement 3 (rule 1, rule 5).\n9. **usable** – Describes a third-party video; no checkpoint touched.\n10. **not usable** – Fragment of a third-party clip, probably a transcription error, content [unclear]; not an own statement and cannot be assessed.\n11. **not usable** – Personal claim of a clip creator, unverified; no content that can be taken over.\n12. **not usable** – Rhetorical phrase of a clip creator; no content that can be taken over.\n13. **conditional** – Claim, unverified (numbers without source). The desire named is social approval. Required change: usable only if the product really delivers what is shown (fit, quality) and no approval or status is promised; no use of insecurity about one's body or looks (rule 7, rule 1); no persons shown (rule 9, rule 10).\n14. **conditional** – The concept is a visible contrast between a bad and a good case. Required change: show the garment or product itself (flat, on a hanger, graphics), not a person wearing it (rule 9, rule 10).\n15. **conditional** – Same as statement 14.\n16. **conditional** – Product fit instruction of a clip creator. Required change: if reused, as the own shop's real fit guidance, without showing a person (rule 9, rule 10).\n17. **conditional** – Same as statement 16.\n18. **conditional** – Claim, unverified; same condition as statement 3 (rule 1, rule 5).\n19. **conditional** – Absolute claim ('people don't want the product'), unverified; same as station 11: usable as framing. Required change: the product's real function, price and terms stay stated (rule 3, gharar); no exaggeration (rule 5).\n20. **usable** – Claim, unverified; no source for 'basic human needs'.\n21. **conditional** – Metaphor of the product as a vehicle. Required change: the product must really serve the need named (rule 1).\n22. **conditional** – Same as station 11, statement 2: usable as framing, product facts and terms still stated (rule 3, gharar).\n23. **conditional** – Usable if the desire is one the product truly meets. Required change: no invented or inflated desire, no use of insecurity (rule 7, rule 1); religious obligations are not treated as a market gap (rule 11); images by shapes, text, icons or objects, no people and no music in own content (rule 8, rule 9, rule 10).\n\n## Links\n- [[11-you-sell-emotions-not-the-product]] – near duplicate: same core claim 'you don't sell the product, you sell emotions'; 42 adds two worked examples with view numbers and names the desires (looking after loved ones, social approval)\n- [[02-sell-the-after-not-the-what]] – same mechanism: sell the outcome, not the object\n- [[33-people-buy-the-product-they-like-best]] – same mechanism: people care about the outcome, not the product\n- [[12-emotions-are-caught-sell-the-feeling-first]] – related: feeling first, product second\n- [[37-sell-the-problem-first]] – related: the microplastics example works through fear for the family, like the pain of the problem in 37\n- [[14-sell-water-to-the-thirsty]] – related: an existing need is addressed\n- [[21-people-want-to-stop-losing]] – related: fear for the family as a loss\n- [[25-emotional-content-is-remembered]] – related: emotion carries content\n- [[desired-outcome]]\n- [[emotion-selling]]\n"}, {"id": "43-the-enemy-effect-builds-loyalty", "kind": "station", "title": "43 – The enemy effect: a shared enemy makes customers loyal", "path": "stationen/43-the-enemy-effect-builds-loyalty.md", "text": "---\nid: 43\nsource: quellen/videos/43 (v24044gl0000d6s2gb7og65u53a8hpk0.mp4)\ncreator: \"@profaura_\"\nduration_s: 41.68\nduration_video_s: 45.98\nconcepts: [common-enemy-effect, customer-understanding, named-brands, pain-of-the-problem]\n---\n# 43 – The enemy effect: a shared enemy makes customers loyal\n## Verbatim\n```text\n[00:00.00 - 00:04.28] Psychology says the reason your brand gets ignored is because you haven't made any enemies.\n[00:04.98 - 00:05.58] Picture this.\n[00:06.20 - 00:09.00] Have you ever been to a social event and got talking to a stranger?\n[00:09.42 - 00:13.04] You're getting on okay, but then you find out you both hate the same person.\n[00:13.58 - 00:16.42] Suddenly, you and that stranger like each other a lot more.\n[00:16.98 - 00:18.18] This is called the enemy effect.\n[00:18.56 - 00:22.60] It means when we share a common enemy with someone, we feel a stronger bond with them.\n[00:22.84 - 00:26.50] And every cult brand is using this trick to make customers loyal to them.\n[00:26.98 - 00:28.38] Nike's enemy is laziness.\n[00:28.98 - 00:30.22] Red Bulls is being average.\n[00:30.72 - 00:32.56] Teslas is cars that use gas.\n[00:33.10 - 00:37.44] The lesson is, if you want to build a cult brand, you must find out what your customer hates.\n[00:37.78 - 00:38.92] Then, make it your enemy.\n[00:39.46 - 00:41.68] That, how you build a loyal customer base.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript: 'find out what your customer hates' / On-screen at 36 s: \"find out what you customer hates\" (word \"your\" shown as \"you\"). Spelling error on screen; audio is not corrected here.\n- Last line 'That, how you build a loyal customer base.' (39.46-41.68 s) is the transcript as written; the sentence is incomplete as transcribed (\"That's how\" is probable but the audio was not heard): [unclear].\n- 'Red Bulls' and 'Teslas' are the transcript spelling; the on-screen text reads \"Tesla's enemy = gas cars\". No Red Bull card is in the 3-second samples: [unclear].\n- On-screen at 39 s: bar graphic \"customer loyalty 87%\". The figure is not spoken anywhere in the transcript and has no source on screen.\n- The term \"enemy effect\" is spoken (18.56 s) but is not on screen in any sampled frame.\n- On-screen cells show single words (\"a\", \"them\", \"okay\", \"more\") that are fragments of the spoken phrases; nothing in the captions contradicts the audio.\n- Audio ends at 41.68 s; the file is 45.98 s long; the last sampled frame (42 s) is the end card.\n- No transcript artifacts such as repeated 'Thank you'.\n\n## Visuals\n- Frame 1 (0 s): blurred smartphone mock-up of a social profile \"webbright\", caption \"your brand\". Frame 2 (3 s): \"you haven't made any enemies\" with \"enemies\" large in teal. Frames 3-4, 6 (6, 9, 15 s): one clip of women in a club, with a third woman in a pink dress (4) and wine glasses (6); generator mark \"MINIMAX | Hailuo AI\" in frame 3. Frames 7-8 (18, 21 s): person icons, one red among two white. Frames 10-11 (27, 30 s): overweight boy jogging for \"Nike's enemy = laziness\"; grey electric SUV in desert for \"Tesla's enemy = gas cars\". Frame 14 (39 s): teal bar \"customer loyalty 87%\". Frame 15 (42 s): end card.\n- Visual assessment: the women (frames 3, 4, 6) are not usable (rules 9 and 10: no depiction of women in marketing; living beings only where there is a real need). The wine glasses (frame 6) are not usable (alcohol, order of authority 1). The boy as the picture of \"laziness\" (frame 10) is not usable: a real person shown as the embodiment of a vice is mockery of a body type (order of authority 1) and a living being without need (rule 9). The 87% bar is not usable (statement 15). Person icons, plain text, teal accent and the red-versus-white icon trick (7-8) are usable as abstract graphics (rule 9: shapes and icons are allowed).\n- Full capture: `quellen/videos/43/bild.md`.\n\n## Statements\n1. \"Psychology says the reason your brand gets ignored is because you haven't made any enemies.\"\n2. \"Picture this.\"\n3. \"Have you ever been to a social event and got talking to a stranger?\"\n4. \"You're getting on okay, but then you find out you both hate the same person.\"\n5. \"Suddenly, you and that stranger like each other a lot more.\"\n6. \"This is called the enemy effect.\"\n7. \"It means when we share a common enemy with someone, we feel a stronger bond with them.\"\n8. \"And every cult brand is using this trick to make customers loyal to them.\"\n9. \"Nike's enemy is laziness.\"\n10. \"Red Bulls is being average.\"\n11. \"Teslas is cars that use gas.\"\n12. \"The lesson is, if you want to build a cult brand, you must find out what your customer hates.\"\n13. \"Then, make it your enemy.\"\n14. \"That, how you build a loyal customer base.\"\n15. [on-screen only, 39 s] \"customer loyalty 87%\"\n\n## Assessment\n1. **conditional** – \"Psychology says\" has no named source and \"the reason\" is a single-cause absolute: claim, unverified. Required change: the \"enemy\" must never be a person or a group of people (order of authority 1: enmity and hatred of people is no basis for a brand); it may only be a problem or a condition. Rule 7 (mechanism allowed when true and nothing concealed) and rule 1 (the named problem must be real).\n2. **usable** – Framing.\n3. **usable** – Rhetorical question; the setting is only a setting.\n4. **conditional** – Describes people bonding by shared hatred of a person: that is backbiting and enmity (order of authority 1). Required change: do not reuse this scene as the example; show the bond over a shared problem instead (e.g. both are annoyed by the same wasted time). Rule 7.\n5. **conditional** – Claim, unverified. Same change as 4: usable only for a bond that does not rest on hatred of a person.\n6. **usable** – Names the mechanism; whether \"enemy effect\" is an established term is unverified.\n7. **conditional** – Claim, unverified. The mechanism (shared opposition creates closeness) is usable when the shared \"enemy\" is a problem, an idea or a condition, never a person, group or the customers of a competitor. Rule 7: nothing concealed; the brand states openly what it stands against.\n8. **conditional** – \"Every cult brand\" is an unproven absolute. \"Trick\" and \"cult\" frame loyalty as something produced without the customer noticing and as blind devotion. Required change: say openly what the brand is against (rule 6: anything that would have to be concealed falls under ghish; rule 7); aim for loyalty from real value, not for devotion. Claim, unverified.\n9. **usable** – Example about a named brand; claim, unverified. The \"enemy\" is a state (laziness), which is the permitted form of an enemy.\n10. **usable** – Example about a named brand; claim, unverified; transcript spelling \"Red Bulls\" kept.\n11. **usable** – Example about a named brand; claim, unverified; transcript spelling \"Teslas\" kept.\n12. **conditional** – Finding out what the customer dislikes or struggles with is usable (customer research). Required change: \"hates\" is read as the real problem or frustration, never hatred of a person; \"must\" and \"cult brand\" are unproven; the goal is loyal customers, not a cult. Claim, unverified.\n13. **conditional** – Required change: the \"enemy\" is a real problem the customer has, named truthfully and in its real size, with no invented threat and no pressure through fear (rule 1, rule 7; compare station 37 statement 4); never a person, a group or a competitor's people.\n14. **conditional** – Claim, unverified: loyalty through a shared enemy. Same conditions as 12 and 13. Sentence is incomplete as transcribed.\n15. **not usable** – A figure shown as a measured result with no source, no sample and no context. Rule 1 (no false claims about user numbers or reviews) and rule 5 (proof for strong claims). Usable only with real, measured data from our own users and the source shown.\n\n## Links\n- [[37-sell-the-problem-first]] – same mechanism: the customer's pain or problem is the lever; 37 also needs the pain real and not exaggerated\n- [[11-you-sell-emotions-not-the-product]] – related: the anti-goal as an emotion; the enemy is the anti-goal turned into an opponent\n- [[21-people-want-to-stop-losing]] – related: motive is avoiding something unwanted\n- [[19-sell-to-everyone-sell-to-no-one]] – related: taking a clear side and being for some people and not for all\n- [[14-sell-water-to-the-thirsty]] – related: start from what the customer already feels\n- [[36-confirmation-bias-say-what-people-already-think]] – related: say what people already think and feel; both can read as covert influence\n- [[12-emotions-are-caught-sell-the-feeling-first]] – related: shared feeling between people\n- [[named-brands]]\n- [[customer-understanding]]\n- [[pain-of-the-problem]]\n- [[common-enemy-effect]]\n- [[covert-influence]]\n\n## Duplicate check\n- No existing station teaches the enemy effect. Nearest: 37 (sell the pain), 19 (take a side). New in 43: the shared-enemy bond and the named-brand examples (Nike, Red Bull, Tesla). Stations 38-42 did not exist as files when this station was made.\n"}, {"id": "44-social-proof-reciprocity-branding", "kind": "station", "title": "44 – How to sell anything to anyone: social proof, reciprocity, branding", "path": "stationen/44-social-proof-reciprocity-branding.md", "text": "---\nid: 44\nsource: quellen/videos/44 (v24044gl0000d6hlqvnog65vbireb7kg.mp4)\ncreator: \"@profaura_\"\nduration_s: 59.98\nduration_video_s: 33.09\nconcepts: [free-trial, perceived-value, product-vs-branding, reciprocity, social-proof]\n---\n# 44 – How to sell anything to anyone: social proof, reciprocity, branding\n## Verbatim\n```text\n[00:00.00 - 00:01.46] How to sell anything to anyone.\n[00:02.10 - 00:03.86] First, use social proof.\n[00:04.32 - 00:06.92] A product with no reviews scares buyers away.\n[00:07.46 - 00:11.08] But if you show five-star reviews, people are more likely to buy.\n[00:11.78 - 00:13.88] Second, use the reciprocity effect.\n[00:14.32 - 00:18.16] Before you sell anything, give away a free trial, free sample, or free resource.\n[00:18.76 - 00:21.46] People are more likely to buy when they receive value first.\n[00:22.14 - 00:23.66] Lastly, branding is everything.\n[00:24.18 - 00:28.22] It's a great way of making people feel better, paying five times more for the same thing.\n[00:30.00 - 00:59.98] Thank you.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Audio ends at 28.22 s; the transcript then contains a line 'Thank you.' with timestamps 30.00-59.98 s; the video file is 33.09 s long. This entry is a Whisper artifact (no speech in the frame range), the same as in station 37.\n- duration_s in the front matter is the last transcript timestamp, as specified; the real file length is in duration_video_s.\n- On-screen at 0 s: \"$ 14,808 sales to anyone\". The figure is not in the transcript and has no source on screen. It may be an animated counter; the final value is not captured.\n- On-screen at 18 s: \"People are mo\" (word cut off); the audio says 'People are more likely to buy when they receive value first.' The end of the on-screen line is [unclear] in the sampled frame.\n- On-screen at 21 s: \"3.\" before the spoken 'Lastly' (22.14 s). Items \"1.\" and \"2.\" are not in the samples.\n- On-screen at 24-27 s: \"$5\" and \"$25\" shirt prices; the audio says 'five times more'. Consistent (5 x 5 = 25).\n- Opening line 'How to sell anything to anyone.' is word for word the opening of video [[38-framing-bundle-pricing-scarcity]] (framing, bundle pricing, scarcity); the three techniques differ.\n\n## Visuals\n- Frame 1 (0 s): green bar with \"$ 14,808\" above, \"sales\" below, caption \"to anyone\". Frames 2-4 (3-9 s): browser mock-up with a teal jacket; \"buy now\" dimmed, then bright, then with four review cards and a hand cursor; caption \"social proof\". Frames 5-7 (12-18 s): \"reciprocity effect\"; teal icons \"TRIAL\" stamp, \"SAMPLE\" badge and circled \"i\" with labels free trial, free sample, free resource. Frame 8 (21 s): large \"3.\". Frames 9-10 (24, 27 s): white T-shirt \"$5\", then second T-shirt with a swoosh \"$25\", caption \"branding is everything\". Frame 11 (30 s): end card.\n- Visual assessment: the review cards (frame 4) are usable only as an example picture with real reviews behind them (rule 1). The \"$5\" shirt next to a \"$25\" shirt with a logo (frame 10) shows the same shirt at five times the price: not usable as shown (rules 1, 4). The \"$ 14,808\" bar is not usable (statement 10). Icons for trial, sample and resource, and the dimmed-then-bright button, are usable (rule 9: shapes and icons).\n- Full capture: `quellen/videos/44/bild.md`.\n\n## Statements\n1. \"How to sell anything to anyone.\"\n2. \"First, use social proof.\"\n3. \"A product with no reviews scares buyers away.\"\n4. \"But if you show five-star reviews, people are more likely to buy.\"\n5. \"Second, use the reciprocity effect.\"\n6. \"Before you sell anything, give away a free trial, free sample, or free resource.\"\n7. \"People are more likely to buy when they receive value first.\"\n8. \"Lastly, branding is everything.\"\n9. \"It's a great way of making people feel better, paying five times more for the same thing.\"\n10. [on-screen only, 0 s] \"$ 14,808 sales\"\n\n## Assessment\n1. **conditional** – \"Anything to anyone\" is an absolute over-promise (rule 5). Required change: only a halal product (rule 15: selling to everyone is allowed as long as the product is halal), and no claim that every product can be sold to every person.\n2. **usable** – Names the tactic.\n3. **usable** – Claim, unverified.\n4. **conditional** – Required change: only real reviews from real buyers; no bought, invented or selected-to-mislead reviews (rule 1). Claim, unverified.\n5. **usable** – Names the mechanism (reciprocity). Rule 7: allowed when true and nothing concealed.\n6. **conditional** – Giving something free is usable. Required changes: a free trial states duration, price afterwards and how to cancel (rule 3, gharar); \"free\" must really be free, with no hidden obligation or hidden data collection (rule 6, rule 1).\n7. **usable** – Claim, unverified. Rule 7: the gift is real and has no hidden strings.\n8. **usable** – Claim, unverified; \"everything\" is an absolute (compare 04, 31, 33).\n9. **not usable** – Making buyers pay five times more for the same thing is deception and an artificial price anchor: rule 1, rule 4 (najsh), rule 5. Same ruling as station 28 statement 11. The usable core is limited to: a real, honestly named difference (design, service, experience) may carry a higher price; \"the same thing\" at 5x may not.\n10. **not usable** – A result figure with no source, period or context. Rule 1 (no false claims about prices, user numbers or sales) and rule 5 (proof). Usable only as our own real figure with the source shown.\n\n## Links\n- [[36-confirmation-bias-say-what-people-already-think]] – related: 36 also uses testimonials, case studies and reviews as proof\n- [[01-reduce-the-pain-of-paying]] – same mechanism: free trials lower the barrier\n- [[05-study-what-works-particl]] – related: a concrete free-trial offer by DM (also needs its terms stated)\n- [[28-same-wine-different-price-experience]] – near duplicate of statement 9: same product, higher price by brand and experience; both rated not usable for the \"same thing\" part\n- [[22-price-is-never-the-problem]] – related: perceived value decides, not the price alone\n- [[31-best-product-with-bad-branding-loses]] – related: branding outweighs the product\n- [[04-there-is-no-winning-product]] – related: branding and story decide\n- [[20-branding-is-the-1p-model-perception]] – related: branding as perception\n- [[social-proof]]\n- [[free-trial]]\n- [[perceived-value]]\n- [[product-vs-branding]]\n- [[reciprocity]]\n\n## Duplicate check\n- Branding part (statements 8-9) duplicates 28, 31 and 04 in substance; new there is only the explicit \"five times the price for the same thing\" claim (rated not usable).\n- Social proof (2-4) is new as a stand-alone tactic (only touched in 36). Reciprocity (5-7) is new; free-trial overlaps 01 and 05.\n- Same opening line as video [[38-framing-bundle-pricing-scarcity]] (\"How to sell anything to anyone.\"), same list format (\"First\", \"Second\", \"Lastly\"), other techniques. Station [[38-framing-bundle-pricing-scarcity]] was not yet written when this station was made.\n"}, {"id": "45-sell-the-outcome-not-the-product", "kind": "station", "title": "45 – Customers care about the outcome, not your product", "path": "stationen/45-sell-the-outcome-not-the-product.md", "text": "---\nid: 45\nsource: quellen/videos/45 (v24044gl0000d64ac4vog65l9a7m45cg.mp4)\ncreator: \"@profaura_\"\nduration_s: 25.10\nduration_video_s: 29.44\nconcepts: [desired-outcome, emotion-selling, product-vs-branding]\n---\n# 45 – Customers care about the outcome, not your product\n## Verbatim\n```text\n[00:00.00 - 00:02.74] Would you rather buy this or would you rather buy this?\n[00:09.94 - 00:13.14] Customers don't care about your product, they care about the outcome.\n[00:13.66 - 00:17.34] They're not buying a mattress, they're buying a good night's sleep and better mornings.\n[00:17.74 - 00:20.86] You're not selling your product, you're selling what your product makes possible.\n[00:21.44 - 00:25.10] Position your brand to sell the outcome, and you'll never have to sell the product again.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- No speech between 2.74 s and 9.94 s in the transcript. The sampled frames at 3 s and 6 s show the camera and the supplement with \"Would you rather buy this?\" in that gap.\n- On-screen at 0 s: \"or would you rather buy this?\" (hiker picture); at 3 s and 6 s: \"Would you rather buy this?\" (camera, supplement). The first spoken question is a single sentence 'Would you rather buy this or would you rather buy this?' (0-2.74 s). The 3-second samples do not show which picture belongs to which half of the sentence: [unclear].\n- On-screen at 15 s: \"they're not buying a matress\" (spelling \"matress\") and \"they're buying a good nights sleep\" (no apostrophe). The audio says 'a good night's sleep and better mornings'; \"better mornings\" is not on screen in the sampled frame.\n- On-screen at 21 s: \"position your brand to sell the outc[...]\" with the last word fading and blurred: [unclear], read as \"outcome\" only from the audio.\n- The end card (24 s) is on screen while the audio still runs to 25.10 s.\n\n## Visuals\n- Frame 1 (0 s): two hikers with backpacks on a mountain trail. Frame 2 (3 s): Canon camera. Frame 3 (6 s): pre-workout tub. Frames 4-5 (9, 12 s): \"customers care\" over a dotted line, with \"product\" and then \"outcome\" below. Frame 6 (15 s): woman at a mattress above a sleeping woman. Frame 7 (18 s): \"Sell\" over a dotted line and \"what your product makes possible\". Frame 8 (21 s): white frame, curved text \"position your brand to sell the outc...\". Frames 9-10 (24, 27 s): end cards.\n- Visual assessment: the hikers (frame 1), the woman at the mattress and the sleeping woman (frame 6) are not usable (rule 9: living beings only where there is a real need; rule 10: no depiction of women). The product pictures (camera, supplement) and the dotted-line word pairs are usable as a device (rule 9); the product pictures show third-party brands (Canon, ON) and would be replaced by our own.\n- Full capture: `quellen/videos/45/bild.md`.\n\n## Statements\n1. \"Would you rather buy this or would you rather buy this?\"\n2. \"Customers don't care about your product, they care about the outcome.\"\n3. \"They're not buying a mattress, they're buying a good night's sleep and better mornings.\"\n4. \"You're not selling your product, you're selling what your product makes possible.\"\n5. \"Position your brand to sell the outcome, and you'll never have to sell the product again.\"\n\n## Assessment\n1. **usable** – Rhetorical device (product picture against outcome picture).\n2. **usable** – Claim, unverified; \"don't care\" is an absolute (compare 33 statement 3, which says people care about the product once they understand the outcome).\n3. **usable** – Example with a permissible product; claim, unverified.\n4. **usable** – Claim, unverified.\n5. **conditional** – \"You'll never have to sell the product again\" is an absolute promise of an effect (rule 5). Required change: no promise that outcome positioning ends the need to sell; and the outcome sold must be one the product really delivers (rule 1, ghish). Compare 37 statement 7 (\"sells itself\").\n\n## Links\n- [[02-sell-the-after-not-the-what]] – near duplicate: customers buy the outcome, not the product\n- [[33-people-buy-the-product-they-like-best]] – near duplicate: statement 3 there, \"people only care about your product if they understand the outcome\", and the drill example\n- [[11-you-sell-emotions-not-the-product]] – related: the goal as the emotion\n- [[12-emotions-are-caught-sell-the-feeling-first]] – related: sell the feeling first\n- [[20-branding-is-the-1p-model-perception]] – related: 20 says the product \"doesn't matter at all\"; 45 says customers do not care about the product, only about the outcome\n- [[desired-outcome]]\n- [[emotion-selling]]\n- [[product-vs-branding]]\n\n## Duplicate check\n- Near duplicate of 02 and 33. Same core message (outcome over product). New in 45: the visual contrast \"this or this\" (product pictures against an outcome picture), the mattress example (good night's sleep and better mornings), and the wording \"what your product makes possible\". The only new claim is statement 5 (rated conditional).\n"}, {"id": "46-selling-versus-storytelling", "kind": "station", "title": "46 – Selling versus storytelling", "path": "stationen/46-selling-versus-storytelling.md", "text": "---\nid: 46\nsource: quellen/videos/46 (v24044gl0000d5mif7fog65iuu2m7bh0.mp4)\ncreator: \"@profaura_\"\nduration_s: 49.74\nduration_video_s: 54.10\nconcepts: [brand-perception, emotion-selling, named-brands, storytelling]\n---\n# 46 – Selling versus storytelling\n## Verbatim\n```text\n[00:00.00 - 00:02.44] What's the difference between selling versus storytelling?\n[00:03.06 - 00:04.80] Selling focuses on transactions.\n[00:05.60 - 00:07.14] Storytelling focuses on transformation.\n[00:08.14 - 00:09.48] Selling tells people what you offer.\n[00:10.16 - 00:11.86] Storytelling shows people why it matters.\n[00:12.72 - 00:14.32] Selling competes on price and features.\n[00:15.32 - 00:17.16] Storytelling competes on meaning and emotion.\n[00:17.76 - 00:19.30] Selling might win you a customer today.\n[00:20.08 - 00:22.22] Storytelling earns you a loyal customer for years.\n[00:22.90 - 00:24.00] Selling is about the product.\n[00:24.68 - 00:26.54] Storytelling is about the person buying it.\n[00:27.24 - 00:28.44] Nike doesn't just sell shoes.\n[00:28.44 - 00:30.18] It tells stories of determination.\n[00:30.70 - 00:32.30] Patagonia doesn't just sell jackets.\n[00:32.70 - 00:33.98] It tells stories of purpose.\n[00:34.70 - 00:36.20] Aesop doesn't just sell skincare.\n[00:36.64 - 00:38.06] It tells stories of ritual.\n[00:38.80 - 00:40.44] Storytelling turns products into symbols.\n[00:40.88 - 00:42.04] It turns buyers into believers.\n[00:42.62 - 00:45.48] It makes your brand something people care for, not just buy from.\n[00:46.18 - 00:47.44] So don't just focus on selling.\n[00:47.80 - 00:49.74] Focus on crafting stories worth sharing.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- On-screen at 18 s: \"Wins a cusomer today\" (spelling \"cusomer\"); the audio says 'Selling might win you a customer today.' The on-screen list items are short labels of the spoken sentences (e.g. \"Loyal customer for years\" for 'Storytelling earns you a loyal customer for years.').\n- On-screen at 15 s and 24 s: ends of lines (\"Meaning & en[...]\", \"Loyal c[...]omer for years\", \"About t[...]\") are covered by a teal ribbon in the sampled frames: [unclear] at that instant; the full lines are visible in later frames except \"About t[...]\", read as the storytelling counterpart of \"About the product\" (spoken: 'Storytelling is about the person buying it'): [unclear].\n- 'Aesop', 'Nike' and 'Patagonia' are spoken; Nike and Patagonia logos are on screen (27, 30 s); no Aesop logo in the sampled frames.\n- 'symbols' (sentence 38.80-40.44 s) is on screen at 39 s; 'believers' (40.88-42.04 s) is not in the sampled frames.\n- The frame at 0 s has a white lower half (transition frame, no content).\n- Audio ends at 49.74 s; the file is 54.10 s long; the last sampled frame (51 s) is the end card.\n- No transcript artifacts.\n\n## Visuals\n- Frame 1 (0 s): word \"Selling\" in italics with a teal underline. Frames 2-9 (3-24 s): two stacked blocks \"Selling\" and \"Storytelling\" of teal bars; a ribbon peels each bar and one line of text appears per spoken pair, five lines per block. Frame 10 (27 s): Nike swoosh, dotted line, running shoe crossed out in red. Frame 11 (30 s): \"patagonia\" logo, dotted line, jacket. Frame 12 (33 s): close-up of a man with snow on his face and a goggle, \"stories of purpose.\" Frame 13 (36 s): woman touching her cheek, \"stories of ritual.\" Frame 14 (39 s): \"storytelling turns / symbols\". Frame 15 (42 s): \"something people care for\". Frames 16-17 (45, 48 s): \"focus on selling\", \"focus on crafting stories worth sharing\". Frame 18 (51 s): end card.\n- Visual assessment: the woman (frame 13) is not usable (rules 9, 10); the man in the snow (frame 12) is a living being without real need (rule 9) and not usable. The two-column comparison built line by line, the dotted-line word pairs and the crossed-out product are usable as devices (rule 9: shapes, text, icons). The third-party logos (Nike, Patagonia) are named-brand examples and would not be reused as pictures in our own content.\n- Full capture: `quellen/videos/46/bild.md`.\n\n## Statements\n1. \"What's the difference between selling versus storytelling?\"\n2. \"Selling focuses on transactions.\"\n3. \"Storytelling focuses on transformation.\"\n4. \"Selling tells people what you offer.\"\n5. \"Storytelling shows people why it matters.\"\n6. \"Selling competes on price and features.\"\n7. \"Storytelling competes on meaning and emotion.\"\n8. \"Selling might win you a customer today.\"\n9. \"Storytelling earns you a loyal customer for years.\"\n10. \"Selling is about the product.\"\n11. \"Storytelling is about the person buying it.\"\n12. \"Nike doesn't just sell shoes.\"\n13. \"It tells stories of determination.\"\n14. \"Patagonia doesn't just sell jackets.\"\n15. \"It tells stories of purpose.\"\n16. \"Aesop doesn't just sell skincare.\"\n17. \"It tells stories of ritual.\"\n18. \"Storytelling turns products into symbols.\"\n19. \"It turns buyers into believers.\"\n20. \"It makes your brand something people care for, not just buy from.\"\n21. \"So don't just focus on selling.\"\n22. \"Focus on crafting stories worth sharing.\"\n\n## Assessment\n1. **usable** – Framing question.\n2. **usable** – Claim, unverified; a simplified contrast.\n3. **usable** – Claim, unverified (compare 02: desired transformation).\n4. **usable** – Description.\n5. **usable** – Claim, unverified.\n6. **usable** – Claim, unverified.\n7. **conditional** – Claim, unverified. Required change: the emotion must be true and not manufactured (ghish; same condition as station 25 statement 6) and the meaning must be real, not invented.\n8. **usable** – Claim, unverified.\n9. **usable** – Claim, unverified; \"for years\" is not a promise we may make for our own product.\n10. **usable** – Description.\n11. **usable** – Claim, unverified (compare 23: the customer is the hero).\n12. **usable** – Example about a named brand; claim, unverified.\n13. **usable** – Same.\n14. **usable** – Same.\n15. **usable** – Same.\n16. **usable** – Same; skincare is a permissible product, but the example's picture (woman) is not (see Visuals).\n17. **usable** – Same.\n18. **usable** – Claim, unverified.\n19. **conditional** – \"Believers\" is religious wording applied to customers and frames brand loyalty as faith (order of authority 1: belief and faith belong to the religion only). Required change: say \"loyal customers\" or \"customers who trust you\"; loyalty must come from real value, with nothing concealed (rule 7).\n20. **usable** – Claim, unverified.\n21. **usable** – Instruction, no checkpoint touched.\n22. **conditional** – Required change: the stories must be true; no invented customers, journeys or testimonials (rule 1, ghish); the customer's real story only with their consent (rule 6; compare 23 statement 8).\n\n## Links\n- [[23-the-customer-is-the-hero-of-the-story]] – same mechanism: storytelling is about the buyer, not the seller (statement 11)\n- [[25-emotional-content-is-remembered]] – same mechanism: emotion and story are remembered (statement 7)\n- [[02-sell-the-after-not-the-what]] – same mechanism: transformation over the thing (statement 3)\n- [[13-animations-that-turn-your-message-into-a-story]] – related: turning a message into a story, there as a service offer\n- [[10-the-five-year-old-rule]] – related: story and clarity\n- [[04-there-is-no-winning-product]] – related: the story told about the product\n- [[15-three-questions-every-customer-asks]] – extends: \"why it matters\" answers the question will it help me\n- [[22-price-is-never-the-problem]] – related: statement 6 says selling competes on price; 22 says perceived value decides\n- [[named-brands]]\n- [[storytelling]]\n- [[emotion-selling]]\n- [[brand-perception]]\n\n## Duplicate check\n- Overlaps 23 (story about the customer), 25 (emotion is remembered), 02 (transformation) and 13/10 (story). New in 46: the explicit selling-versus-storytelling comparison as a list of pairs (transactions/transformation, what you offer/why it matters, price and features/meaning and emotion, today/years, product/person), the three named brand examples (Nike determination, Patagonia purpose, Aesop ritual), and the claims \"products into symbols\" and \"buyers into believers\" (the latter conditional). No service offer or call to action in this video.\n"}, {"id": "47-people-dont-read-they-scan", "kind": "station", "title": "47 – People don't read, they scan (F and Z patterns)", "path": "stationen/47-people-dont-read-they-scan.md", "text": "---\nid: 47\nsource: quellen/videos/47 (v24044gl0000d5jskinog65jcjingik0.mp4)\ncreator: \"@profaura_\"\nduration_s: 18.28\nduration_video_s: 22.52\nconcepts: [attention, clarity, scannable-content]\n---\n# 47 – People don't read, they scan (F and Z patterns)\n## Verbatim\n```text\n[00:00.00 - 00:02.76] Psychology says that people don't read, they scan.\n[00:03.30 - 00:05.34] Most people read in the F and Z shape patterns.\n[00:05.76 - 00:09.58] Your eyes go from 1 to 2 to 3 to 4 and finally to 5.\n[00:10.02 - 00:13.06] The words in your text don't have to be spelled correctly to be understood.\n[00:13.64 - 00:15.98] Therefore, while building a website, make it scannable.\n[00:16.20 - 00:18.28] And while building an ad, make it scannable too.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- On-screen at 9 s: \"The wrods in yuor txet dno't hvae to be sepelld corecrtly to be unedstrood\". The letters are deliberately scrambled on screen to show the claim; the audio at 10.02 s says the sentence spelled correctly. Recorded as on-screen text, not corrected.\n- On-screen at 12 s: only fragments of two lines (\"n\", \":o\") and a thin bar at the left edge; text mid-animation: [unclear].\n- On-screen at 0 s \"Don't\" (with a people icon), at 3 s \"F / Z Shaped\", at 6 s \"to\", at 15 s \"While Building\": single words or short fragments of the spoken sentences. Nothing contradicts the audio.\n- Audio ends at 18.28 s; the file is 22.52 s long; the last sampled frame (18 s) is the end card.\n- Wording differences to the transcript of video [[39-people-scan-they-dont-read]] (same script, other account): 39 starts 'A marketing secret you must never ignore is that people don't read, they scan.'; 47 starts 'Psychology says that people don't read, they scan.' 39: 'F and Z shaped patterns', 47: 'F and Z shape patterns'. 39: 'while making an ad', 47: 'while building an ad'. All other sentences are the same.\n- No transcript artifacts.\n\n## Visuals\n- Frame 1 (0 s): caption \"Don't\" with a white group-of-people icon. Frame 2 (3 s): \"F / Z Shaped\" with a teal slash. Frame 3 (6 s): numbered circles 1 to 5 with arrows in an \"F\" shape; circle 2 filled teal; caption \"to\". Frame 4 (9 s): scrambled-letter text block. Frame 5 (12 s): partial letters. Frame 6 (15 s): \"While Building\". Frame 7 (18 s): end card.\n- Visual assessment: all usable (rule 9: shapes, text, icons; no living beings). The diagram shows only the F path; the Z path is named but not drawn in the sampled frames.\n- Full capture: `quellen/videos/47/bild.md`.\n\n## Statements\n1. \"Psychology says that people don't read, they scan.\"\n2. \"Most people read in the F and Z shape patterns.\"\n3. \"Your eyes go from 1 to 2 to 3 to 4 and finally to 5.\"\n4. \"The words in your text don't have to be spelled correctly to be understood.\"\n5. \"Therefore, while building a website, make it scannable.\"\n6. \"And while building an ad, make it scannable too.\"\n\n## Assessment\n1. **usable** – Claim, unverified; \"don't read\" is an absolute (compare 24 and 27, which also say people give little effort).\n2. **usable** – Claim, unverified; F and Z are named eye-movement patterns on pages and ads.\n3. **usable** – Describes the numbered path of the F diagram; claim, unverified.\n4. **conditional** – Claim, unverified and overstated: readers can often understand scrambled words, but that does not mean spelling errors may stay in our own copy. Required change: use it only as a demonstration of scanning, never as permission for spelling errors; mistakes lower trust (compare 27).\n5. **usable** – Instruction, no checkpoint touched.\n6. **usable** – Instruction, no checkpoint touched.\n\n## Links\n- [[27-the-more-people-think-the-less-they-trust]] – same mechanism: low effort for the reader, the clearest message wins\n- [[24-attention-comes-from-clarity-not-frequency]] – related: attention comes from fast understanding\n- [[30-content-fails-in-the-first-seconds]] – related: the first seconds decide\n- [[10-the-five-year-old-rule]] – related: simple and quick to understand\n- [[34-one-message-one-offer-one-action]] – related: fewer options on a page\n- [[scannable-content]]\n- [[clarity]]\n- [[attention]]\n\n## Duplicate check\n- Near duplicate of station [[39-people-scan-they-dont-read]] (same script, same sentences except three small wording changes listed above; station [[39-people-scan-they-dont-read]] did not exist as a file when this station was made, the video is in `quellen/videos/39` from account \"@oktocreative\"). 47 adds nothing new in content. Differences in form only: dark background with teal accent against a white background with red-brown diagram in 39; 39 also shows a website screenshot and a Z-pattern overlay on an ad as examples, 47 does not (in the samples); 47 is shorter by 1.6 s of speech.\n- Recommendation for the main session: treat 47 as a duplicate of [[39-people-scan-they-dont-read]] for the content and the counts; the new information is only that the same script circulates in two designs.\n"}, {"id": "48-the-so-you-can-method", "kind": "station", "title": "48 – The \"So You Can\" method: sell the outcome", "path": "stationen/48-the-so-you-can-method.md", "text": "---\nid: 48\nsource: quellen/videos/48 (v24044gl0000d59fb97og65i6m9351vg.mp4)\ncreator: \"@profaura_\"\nduration_s: 34.88\nduration_video_s: 39.20\nconcepts: [call-to-action-dm-comment, covert-influence, desired-outcome, emotion-selling, so-you-can-method]\n---\n# 48 – The \"So You Can\" method: sell the outcome\n## Verbatim\n```text\n[00:00.00 - 00:05.06] Everyone says, don't sell the product, sell the outcome, but almost no one shows you how.\n[00:05.48 - 00:10.02] Don't worry, I'm going to give you a simple hack that will make people feel dumb saying no to your product.\n[00:10.50 - 00:12.54] It's called the So You Can method.\n[00:13.18 - 00:13.98] Here's how it works.\n[00:14.36 - 00:18.66] You take your product or feature, add So You Can, and then finish with the outcome.\n[00:19.12 - 00:22.38] For example, a home alarm system so you can feel safe at night,\n[00:22.74 - 00:26.68] or noise-canceling headphones so you can get your work done with no distractions.\n[00:26.68 - 00:31.62] It works because you stop selling the product and start selling what your customer actually needs.\n[00:32.04 - 00:34.88] So try it on your product and drop the best one in the comments.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Spoken at 5.48 s: \"a simple hack that will make people feel dumb saying no to your product\". The sampled frames show the captions \"that will make\" (6 s) and \"to your product\" (9 s); the words \"feel dumb saying no\" fall between sampled frames and were not seen on screen. No contradiction found.\n- Transcript \"So You Can method\" / On-screen at 15 s: The \"so you can\" method (lower case, in quotation marks). Same words.\n- Transcript \"noise-canceling headphones so you can get your work done with no distractions\" / On-screen at 24 s: so you can -> \"get your work d\" (the caption is cut off at \"d\" in this frame, typed-in animation or crop). The end of the on-screen phrase is [unclear]; \"done with no distractions\" comes from the audio only (single frame checked).\n- Transcript \"a home alarm system so you can feel safe at night\" / On-screen at 21 s: \" so you can -> feel safe at night\". Same words; the on-screen text leaves out \"a home alarm system\".\n- Captions run about 1 s ahead of the audio (cell \"how it works\" at 12 s, audio from 13.18 s; cell \"for example\" at 18 s, audio from 19.12 s).\n- The audio ends at 34.88 s on the call to action; the file is 39.20 s long (end card at 36 s). The last on-screen word at 33 s is \"the\" (from \"the best one\"); the transcript line ends \"in the comments\".\n- The hook \"make people feel dumb saying no to your product\" is word for word the opening of station 37 (different creator).\n\n## Visuals\n- Frame 1 (0 s): photo of a bearded man in a plaid shirt on a cyan background with a pixel-style speech bubble \"DON'T\". Frames 3-4 (6 s, 9 s): film-still-like photo of a man in a blue pinstriped suit with men in suits behind him, captions \"that will make\" and \"to your product\". Frame 6 (15 s): ruled notebook page, title \"The \"so you can\" method\", formula \"product or feature + \"so you can\"\". Frame 8 (21 s): alarm keypad with \"ALARM TRIGGERED! INTRUDER ALERT!\" and the silhouette of an intruder in a dark room, caption \" so you can -> feel safe at night\". Frame 9 (24 s): man with headphones writing in a notebook on a train, caption \"so you can -> \"get your work d\". Frames 10-11 (27 s, 30 s): \"sell\" over \"product\", then \"sell\" over \"what your customer actually needs\".\n- Living beings appear in frames 1, 3, 4, 8 and 9 (photos, AI-looking images, silhouette). The video uses images that are against GRUNDSATZ rule 9 for own content.\n- Format: portrait, small image box on black, one to five words of caption at a time, notebook page for the formula, end card with TikTok search bar \"@ profaura_\".\n- The video contains a request to the viewer to comment (\"drop the best one in the comments\").\n\n## Statements\n1. \"Everyone says, don't sell the product, sell the outcome, but almost no one shows you how.\"\n2. \"Don't worry, I'm going to give you a simple hack that will make people feel dumb saying no to your product.\"\n3. \"It's called the So You Can method.\"\n4. \"Here's how it works.\"\n5. \"You take your product or feature, add So You Can, and then finish with the outcome.\"\n6. \"For example, a home alarm system so you can feel safe at night,\"\n7. \"or noise-canceling headphones so you can get your work done with no distractions.\"\n8. \"It works because you stop selling the product and start selling what your customer actually needs.\"\n9. \"So try it on your product and drop the best one in the comments.\"\n\n## Assessment\n1. **usable** – Claim, unverified: 'Everyone' and 'almost no one' are absolutes.\n2. **not usable** – The stated aim is that people \"feel dumb saying no\": shaming and pressure to buy. Rule 7: a mechanism is not allowed when the aim is to move a person against their own interest; order of authority 1 (no humiliation, no pressure into a purchase). The same sentence is rated not usable in station 37 statement 1. 'Will make' is also an unproven promise of effect (rule 5).\n3. **usable** – Name of the method.\n4. **usable** – Connective.\n5. **conditional** – The formula (product or feature + \"so you can\" + outcome) is usable. Required change: the outcome named must be what the product really delivers, for the typical customer, and the product itself and its terms stay stated (rules 1, 3, 5).\n6. **conditional** – The wording is usable. Required change: \"feel safe\" must not promise protection beyond what the product does (rules 1, 5). The picture used for it (an intruder in a dark house) works through fear: fear no stronger than the real size of the problem (rule 7), and a person's silhouette is not usable in own content (rule 9).\n7. **conditional** – Required change: \"no distractions\" is an absolute; noise-cancelling reduces noise, not every distraction. State what is true, for example \"fewer distractions\" (rules 1, 5). The man in the photo is not usable in own content (rule 9).\n8. **conditional** – Claim, unverified. Required change: \"stop selling the product\" must not mean hiding what is sold, the price or the terms (rule 3, gharar); the outcome must be a real need of the customer, not one invented for them (rule 7).\n9. **usable** – Call to action to comment; platform use is allowed (rule 12). No checkpoint touched.\n\nCounts: usable 4 (1, 3, 4, 9), conditional 4 (5, 6, 7, 8), not usable 1 (2).\n\n## Links\n- [[02-sell-the-after-not-the-what]] – same mechanism (sell the outcome, not the product); duplicate in substance, 48 adds a concrete formula and two examples\n- [[37-sell-the-problem-first]] – same hook sentence \"make people feel dumb saying no to your product\", same shaming aim, rated not usable in both\n- [[11-you-sell-emotions-not-the-product]] – related: the goal or emotion is what is sold\n- [[33-people-buy-the-product-they-like-best]] – related: \"People only care about your product if they understand the outcome.\"\n- [[15-three-questions-every-customer-asks]] – related: \"So you can\" answers the question \"will it help me\"\n- [[29-sell-the-instant-benefit]] – related: both state the benefit instead of the feature; 48 does not say how soon the outcome comes\n- [[desired-outcome]]\n- [[emotion-selling]]\n- [[so-you-can-method]]\n- [[call-to-action-dm-comment]]\n- [[covert-influence]]\n"}, {"id": "49-five-words-to-swap-in-marketing", "kind": "station", "title": "49 – Five words that kill your marketing (word swaps)", "path": "stationen/49-five-words-to-swap-in-marketing.md", "text": "---\nid: 49\nsource: quellen/videos/49 (v24044gl0000d55ce9vog65h43ib08kg.mp4)\ncreator: \"@profaura_\"\nduration_s: 16.66\nduration_video_s: 21.04\nconcepts: [named-brands, word-choice]\n---\n# 49 – Five words that kill your marketing (word swaps)\n## Verbatim\n```text\n[00:00.00 - 00:01.50] Five words that kill your marketing.\n[00:02.00 - 00:02.76] Don't say sign up.\n[00:02.88 - 00:04.18] Instead, say start now.\n[00:04.54 - 00:05.38] Don't say best.\n[00:05.84 - 00:07.46] Instead, say top rated.\n[00:08.04 - 00:08.96] Never say only here.\n[00:09.30 - 00:10.44] Instead, say exclusive.\n[00:11.20 - 00:12.04] Don't say sale.\n[00:12.42 - 00:13.70] Instead, say special offer.\n[00:14.30 - 00:15.46] And don't say must have.\n[00:15.78 - 00:16.66] Instead, use essential.\n```\n\nDiscrepancies and notes (transcript vs. on-screen text, artifacts):\n- Transcript \"top rated\" / On-screen at 6 s: \"Top-rated\" (hyphenated). Same words.\n- Transcript \"use essential\" / On-screen at 15 s: \"Esser[...]\" (the word is covered by a sliding cyan box; single frame checked). The rest of the word is [unclear] on screen and read as \"essential\" only from the audio. The column header on screen is \"Say\" for every row; the audio uses \"use\" for this row.\n- The audio says \"Five words\". The table on screen has five pairs, but only \"Best\" and \"Sale\" are single words; the others are two-word phrases (\"Sign up\", \"Only here\", \"Must have\").\n- Audio hook \"Five words that kill your marketing.\" (0 s) / On-screen at 0 s: \"marketing.\" (rest of the hook not seen in the sampled frame).\n- The name \"Blockbuster\" is on screen at 0 s (sign on a burning store) and is not said in the audio. The video does not state a link between the picture and the word list.\n- The audio ends at 16.66 s; the file is 21.04 s long (end card at 18 s).\n\n## Visuals\n- Frame 1 (0 s): AI-looking image of a store with the sign \"BLOCKBUSTER\" on fire, smoke, rain, fire truck; caption \"marketing.\". Frames 2-6 (3 s to 15 s): two-column table \"Don't say | Say\" that fills one row per phrase pair (Sign up | Start now; Best | Top-rated; Only here | Exclusive; Sale | Special offer; Must have | Esser[...]); empty cyan bars show the rows still to come. Frame 7 (18 s): end card with TikTok search bar \"@ profaura_\".\n- No people in the frames. A named real company (Blockbuster) is shown as burning.\n- Format: portrait, no voice-over breaks, table builds in step with each spoken pair. Fast: 11 spoken lines in 16.7 s.\n\n## Statements\n1. \"Five words that kill your marketing.\"\n2. \"Don't say sign up.\"\n3. \"Instead, say start now.\"\n4. \"Don't say best.\"\n5. \"Instead, say top rated.\"\n6. \"Never say only here.\"\n7. \"Instead, say exclusive.\"\n8. \"Don't say sale.\"\n9. \"Instead, say special offer.\"\n10. \"And don't say must have.\"\n11. \"Instead, use essential.\"\n\n## Assessment\n1. **usable** – Claim, unverified; hyperbole (\"kill\"). The image of a burning Blockbuster store implies that wording caused its failure; this is not stated in the audio and is not adopted.\n2. **usable** – Advice about a button or call-to-action word. No checkpoint touched.\n3. **conditional** – Required change: the label must say what really happens. If \"start now\" leads to account creation, a payment or a trial that turns into a subscription, that must be clear before the click (rule 3, gharar; rule 6, no dark pattern). \"Sign up\" is not wrong when an account is created.\n4. **usable** – Consistent with rule 5: \"best\" only with proof.\n5. **conditional** – Required change: \"top rated\" is a claim of ranking by ratings. Allowed only with real ratings, and the source and number of reviews disclosed (rules 1, 5). A swap of \"best\" for \"top rated\" does not remove the need for proof.\n6. **usable** – Consistent with rules 1 and 5: \"only here\" must not be said if it is not true.\n7. **conditional** – Required change: \"exclusive\" says the same as \"only here\" in other words. It is allowed only if the offer is really not available elsewhere. Using it to say the same untrue claim in a softer word is deception (rules 1, 5).\n8. **usable** – Advice about a word. A real price reduction can still be named truthfully.\n9. **conditional** – Required change: \"special offer\" must refer to a real reduction or real extra. No invented \"was\" price, no fake deadline (rules 1, 4, najsh). Using it as a euphemism for \"sale\" where nothing is reduced is not allowed.\n10. **usable** – Consistent with rule 5: \"must have\" is an exaggeration without proof.\n11. **conditional** – Required change: \"essential\" claims necessity. Only if the product is truly necessary for the customer's stated goal (rule 5). Otherwise the exaggeration of \"must have\" is only reworded.\n\nCounts: usable 6 (1, 2, 4, 6, 8, 10), conditional 5 (3, 5, 7, 9, 11), not usable 0.\n\n## Links\n- [[16-illusion-of-innovation]] – related: both change wording so that something sounds better; 16 is rated not usable where nothing new exists, the same test applies to \"exclusive\" and \"special offer\"\n- [[26-use-the-power-of-contrast]] – related: price words and reference points must be real (najsh)\n- [[24-attention-comes-from-clarity-not-frequency]] – related: short, clear wording\n- [[10-the-five-year-old-rule]] – related: simple wording; 49 swaps words, it does not simplify a message\n- [[named-brands]] – Blockbuster (image only)\n- [[word-choice]]\n"}, {"id": "50-understand-why-money-moves", "kind": "station", "title": "50 – The more you chase money, the less you see how it is made: understand why money moves", "path": "stationen/50-understand-why-money-moves.md", "text": "---\nid: 50\nsource: quellen/videos/50 (v26044gc0000dbfnuqvog65jv6o60cbg.mp4)\ncreator: \"@cryothum\"\nduration_s: 91.06\nduration_video_s: 78.53\nconcepts: [customer-understanding, desired-outcome, existing-demand, perceived-value]\n---\n# 50 – The more you chase money, the less you see how it is made: understand why money moves\n## Verbatim\n```text\n[00:00.00 - 00:04.22] The more you chase money, the harder it becomes to understand how it's made.\n[00:04.70 - 00:09.46] Most people who want to become rich spend their time thinking about how much money they want to earn,\n[00:09.68 - 00:12.70] instead of understanding what actually makes money valuable.\n[00:13.18 - 00:16.14] Because money doesn't appear simply because someone wants it.\n[00:16.46 - 00:20.40] It changes hands when people believe they're receiving something worth paying for.\n[00:20.82 - 00:24.46] And understanding this completely changes the way you look at the world.\n[00:24.78 - 00:29.92] Every successful business exists because it gives customers a reason to spend their money.\n[00:30.44 - 00:32.04] Sometimes that reason is convenience.\n[00:32.64 - 00:38.64] Sometimes it's saving time, reducing uncertainty, or solving a problem that would otherwise cost much more.\n[00:39.02 - 00:45.14] And the interesting part is that the value of a solution isn't necessarily determined by how difficult it is to create.\n[00:45.44 - 00:49.56] It's determined by how valuable the outcome is to the person paying for it.\n[00:49.68 - 00:54.96] This is why understanding human behavior can become such a powerful advantage in business.\n[00:54.96 - 01:00.32] The better you understand what people want, what frustrates them, and what they're willing to pay for,\n[01:00.56 - 01:03.14] the easier it becomes to recognize opportunities.\n[01:03.66 - 01:06.76] Because becoming wealthy isn't just about wanting more money.\n[01:07.02
