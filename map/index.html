 "text": "---\nconcept: desired-outcome\nkind: psychological mechanism\n---\n# Desired outcome\nKind: psychological mechanism\n\n## Definition\n\"They want the better version of themselves.\" The customer buys the outcome or the 'after', not the product. Merged synonyms: desired transformation (02), goal (11), outcome (33).\n\nNote: Station 29 (instant benefit) is kept under immediate-reward-bias because it opposes 02 (long-term transformation).\n\n## Used in\n- [[02-sell-the-after-not-the-what]] – \"They want the better version of themselves.\"\n- [[11-you-sell-emotions-not-the-product]] – \"The emotion of getting closer to the desired outcome.\"\n- [[33-people-buy-the-product-they-like-best]] – \"People only care about your product if they understand the outcome.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[customer-as-hero]]\n- [[cost-of-inaction]]\n- [[immediate-reward-bias]]\n- [[problem-first-selling]]\n"}, {"id": "emotion-selling", "kind": "concept", "title": "Emotion selling", "path": "begriffe/emotion-selling.md", "text": "---\nconcept: emotion-selling\nkind: psychological mechanism\n---\n# Emotion selling\nKind: psychological mechanism\n\n## Definition\n\"You don't sell the product, you sell emotions.\" Merged synonyms: sell the feeling first (12), emotional content (25), people buy the product they like best (33).\n\nNote: Conditional wherever emotions are produced by untrue content.\n\n## Used in\n- [[02-sell-the-after-not-the-what]] – \"They buy the confidence boost and compliments they will be getting.\"\n- [[11-you-sell-emotions-not-the-product]] – \"You don't sell the product, you sell emotions.\"\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"sell the feeling first and the product second\"\n- [[25-emotional-content-is-remembered]] – \"If people don't feel something, they won't remember anything.\"\n- [[33-people-buy-the-product-they-like-best]] – \"Make people like you best and that's when your product automatically becomes the best product for them.\"\n\n## Related concepts\n- [[emotion-then-logic]]\n- [[emotional-contagion]]\n- [[desired-outcome]]\n- [[memorability]]\n- [[fear-of-missing-out]]\n- [[covert-influence]]\n"}, {"id": "emotion-then-logic", "kind": "concept", "title": "Emotion then logic", "path": "begriffe/emotion-then-logic.md", "text": "---\nconcept: emotion-then-logic\nkind: psychological mechanism\n---\n# Emotion then logic\nKind: psychological mechanism\n\n## Definition\n\"People buy emotions and justify with logic.\"\n\nNote: Claim, unverified.\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"People buy emotions and justify with logic.\"\n- [[35-make-them-feel-they-found-it]] – \"buying feels like the obvious, logical, and personal decision\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"This provides factual evidence that logically reinforces customers' beliefs in your brand.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[social-proof]]\n- [[perceived-value]]\n"}, {"id": "emotional-contagion", "kind": "concept", "title": "Emotional contagion", "path": "begriffe/emotional-contagion.md", "text": "---\nconcept: emotional-contagion\nkind: psychological mechanism\n---\n# Emotional contagion\nKind: psychological mechanism\n\n## Definition\n\"Humans literally catch emotions from others.\"\n\nNote: Authenticity condition in 12.\n\n## Used in\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"Humans literally catch emotions from others.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[priming]]\n- [[covert-influence]]\n- [[memorability]]\n"}, {"id": "existing-demand", "kind": "concept", "title": "Existing demand", "path": "begriffe/existing-demand.md", "text": "---\nconcept: existing-demand\nkind: tactic\n---\n# Existing demand\nKind: tactic\n\n## Definition\n\"Most marketing fails because it tries to create demand.\"\n\nNote: Contradicted in effect by 16.\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"Most marketing fails because it tries to create demand.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[relief-framing]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "fear-of-missing-out", "kind": "concept", "title": "Fear of missing out", "path": "begriffe/fear-of-missing-out.md", "text": "---\nconcept: fear-of-missing-out\nkind: psychological mechanism\n---\n# Fear of missing out\nKind: psychological mechanism\n\n## Definition\n\"Picture it and make your customers feel the emotion so that they fear missing out.\"\n\nNote: Fabricated urgency or scarcity is excluded by GRUNDSATZ (ghish, najsh).\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"so that they fear missing out\"\n\n## Related concepts\n- [[loss-aversion]]\n- [[cost-of-inaction]]\n- [[emotion-selling]]\n"}, {"id": "feeling-understood", "kind": "concept", "title": "Feeling understood", "path": "begriffe/feeling-understood.md", "text": "---\nconcept: feeling-understood\nkind: psychological mechanism\n---\n# Feeling understood\nKind: psychological mechanism\n\n## Definition\n\"They decide when they feel understood and safe about their choice.\" Merged: feel seen (19).\n\nNote: Feigned understanding is excluded.\n\n## Used in\n- [[15-three-questions-every-customer-asks]] – \"They decide when they feel understood and safe about their choice.\"\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – \"Prove that you understand your customers, and they will buy.\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Because people listen when they feel seen.\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"make them feel understood\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[trust]]\n- [[target-audience-focus]]\n- [[certainty-over-risk]]\n"}, {"id": "first-seconds-hook", "kind": "concept", "title": "First seconds hook", "path": "begriffe/first-seconds-hook.md", "text": "---\nconcept: first-seconds-hook\nkind: tactic\n---\n# First seconds hook\nKind: tactic\n\n## Definition\n\"Most content fails in the first seconds, not at the end.\"\n\n## Used in\n- [[13-animations-that-turn-your-message-into-a-story]] – \"a good video is what makes people stop, feel something, and want to know more, all within a few seconds\"\n- [[30-content-fails-in-the-first-seconds]] – \"Most content fails in the first seconds, not at the end.\"\n\n## Related concepts\n- [[attention]]\n- [[clarity]]\n- [[social-media-content]]\n"}, {"id": "free-trial", "kind": "concept", "title": "Free trial", "path": "begriffe/free-trial.md", "text": "---\nconcept: free-trial\nkind: tactic\n---\n# Free trial\nKind: tactic\n\n## Definition\n\"or free trials\" to reduce the pain of paying; concrete offer in 05: \"a 14-day free trial\".\n\nNote: Conditional: trial terms stated (gharar).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"or free trials\"\n- [[05-study-what-works-particl]] – \"DM me Particle for a 14-day free trial\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[guarantee]]\n- [[simple-checkout]]\n- [[call-to-action-dm-comment]]\n"}, {"id": "guarantee", "kind": "concept", "title": "Guarantee", "path": "begriffe/guarantee.md", "text": "---\nconcept: guarantee\nkind: tactic\n---\n# Guarantee\nKind: tactic\n\n## Definition\n\"use guarantees\" to reduce the pain of paying.\n\nNote: Conditional: real, clearly worded, honored (gharar).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"use guarantees\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[free-trial]]\n- [[certainty-over-risk]]\n- [[trust]]\n"}, {"id": "halo-effect", "kind": "concept", "title": "Halo effect", "path": "begriffe/halo-effect.md", "text": "---\nconcept: halo-effect\nkind: psychological mechanism\n---\n# Halo effect\nKind: psychological mechanism\n\n## Definition\n\"One strong impression, good or bad, influences directly everything that follows.\"\n\nNote: Named effect, no source.\n\n## Used in\n- [[18-halo-effect]] – \"This is what's called the halo effect.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[brand-consistency]]\n- [[product-vs-branding]]\n"}, {"id": "illusion-of-innovation", "kind": "concept", "title": "Illusion of innovation", "path": "begriffe/illusion-of-innovation.md", "text": "---\nconcept: illusion-of-innovation\nkind: psychological mechanism\n---\n# Illusion of innovation\nKind: psychological mechanism\n\n## Definition\n\"That's the illusion of innovation.\" - new-sounding names sell because they feel new.\n\nNote: Rated not usable in 16 (deception).\n\n## Used in\n- [[16-illusion-of-innovation]] – \"That's the illusion of innovation.\"\n\n## Related concepts\n- [[clarity]]\n- [[attention]]\n- [[brand-perception]]\n"}, {"id": "immediate-reward-bias", "kind": "concept", "title": "Immediate reward bias", "path": "begriffe/immediate-reward-bias.md", "text": "---\nconcept: immediate-reward-bias\nkind: psychological mechanism\n---\n# Immediate reward bias\nKind: psychological mechanism\n\n## Definition\n\"By nature, we want immediate rewards.\"\n\nNote: Unsubstantiated result promises are excluded (29: 'Lose weight in 30 days').\n\n## Used in\n- [[29-sell-the-instant-benefit]] – \"By nature, we want immediate rewards.\"\n\n## Related concepts\n- [[desired-outcome]]\n- [[loss-aversion]]\n"}, {"id": "loss-aversion", "kind": "concept", "title": "Loss aversion", "path": "begriffe/loss-aversion.md", "text": "---\nconcept: loss-aversion\nkind: psychological mechanism\n---\n# Loss aversion\nKind: psychological mechanism\n\n## Definition\n\"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n\nNote: Factor 'twice' is not sourced in the video.\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"the less it feels like a loss\"\n- [[21-people-want-to-stop-losing]] – \"The fear of losing \\$100 is twice as powerful as the joy of gaining \\$100.\"\n\n## Related concepts\n- [[cost-of-inaction]]\n- [[pain-of-paying]]\n- [[fear-of-missing-out]]\n"}, {"id": "marketing-vs-branding", "kind": "concept", "title": "Marketing vs branding", "path": "begriffe/marketing-vs-branding.md", "text": "---\nconcept: marketing-vs-branding\nkind: brand concept\n---\n# Marketing vs branding\nKind: brand concept\n\n## Definition\n\"marketing is what you say and branding is what people think when you stop saying it\"; 4P model vs \"The 1P model\".\n\n## Used in\n- [[07-marketing-and-branding-are-yin-and-yang]] – \"marketing gets attention and branding makes people remember\"\n- [[20-branding-is-the-1p-model-perception]] – \"In marketing, everyone knows the 4P model.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[attention]]\n- [[memorability]]\n"}, {"id": "memorability", "kind": "concept", "title": "Memorability", "path": "begriffe/memorability.md", "text": "---\nconcept: memorability\nkind: psychological mechanism\n---\n# Memorability\nKind: psychological mechanism\n\n## Definition\n\"Logical content doesn't necessarily create memory.\" Emotion and story are said to create memory; branding \"makes people remember\" (07).\n\nNote: Claims, unverified.\n\n## Used in\n- [[03-your-brand-is-the-feeling-not-the-logo]] – \"it's the gut feeling they get when they see you\"\n- [[07-marketing-and-branding-are-yin-and-yang]] – \"branding makes people remember\"\n- [[08-open-a-loop-zagarnik-effect]] – \"If you want people to remember your brand, don't close the story too soon.\"\n- [[23-the-customer-is-the-hero-of-the-story]] – \"the story they see themselves in, is the one they remember\"\n- [[25-emotional-content-is-remembered]] – \"Logical content doesn't necessarily create memory.\"\n- [[34-one-message-one-offer-one-action]] – \"If you want people to remember you, keep it simple.\"\n\n## Related concepts\n- [[emotion-selling]]\n- [[storytelling]]\n- [[brand-perception]]\n- [[marketing-vs-branding]]\n- [[zagarnik-effect]]\n"}, {"id": "named-brands", "kind": "concept", "title": "Named brands", "path": "begriffe/named-brands.md", "text": "---\nconcept: named-brands\nkind: reference list\n---\n# Named brands\nKind: reference list\n\n## Definition\nBrands and companies named in the sources as examples.\n\nNote: Named without data; examples involving alcohol (26, 28) are not reusable.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"Dollar Shave Club sells razors. Liquid Death sells water.\"\n- [[05-study-what-works-particl]] – \"companies like Skims, Gymshark, and Lululemon\"\n- [[08-open-a-loop-zagarnik-effect]] – \"Have you ever started a Netflix show and suddenly had to finish the whole season?\"\n- [[09-branding-is-for-any-company]] – \"Outline apple logo.\"\n- [[12-emotions-are-caught-sell-the-feeling-first]] – \"If you see someone feeling happy to drink a Coke\"\n- [[16-illusion-of-innovation]] – \"Hydraactive Complex or a BioLift Pro Repair\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Pepsi fans will never choose Coca-Cola over it.\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Samsung fans will never own an Apple product.\"\n- [[28-same-wine-different-price-experience]] – \"Option 1 costs \\$7 and you can buy it at Walmart.\"\n- [[34-one-message-one-offer-one-action]] – \"Think about Apple.\"\n\n## Related concepts\n- [[product-vs-branding]]\n- [[brand-perception]]\n"}, {"id": "own-idea-feeling", "kind": "concept", "title": "Own idea feeling", "path": "begriffe/own-idea-feeling.md", "text": "---\nconcept: own-idea-feeling\nkind: psychological mechanism\n---\n# Own idea feeling\nKind: psychological mechanism\n\n## Definition\n\"When it feels like your idea, you want to have it.\" (35); \"the sale feels like their own idea\" (06).\n\nNote: Conditional: sales intent not concealed.\n\n## Used in\n- [[06-priming-makes-people-buy-without-a-word]] – \"the sale feels like their own idea\"\n- [[35-make-them-feel-they-found-it]] – \"When it feels like your idea, you want to have it.\"\n\n## Related concepts\n- [[priming]]\n- [[covert-influence]]\n- [[relief-framing]]\n"}, {"id": "pain-of-paying", "kind": "concept", "title": "Pain of paying", "path": "begriffe/pain-of-paying.md", "text": "---\nconcept: pain-of-paying\nkind: psychological mechanism\n---\n# Pain of paying\nKind: psychological mechanism\n\n## Definition\nThe act of committing to buy is felt as a small pain; \"The pain of paying actually lights up the same brain regions as physical pain.\"\n\nNote: Distinct from pain-of-the-problem: this is the pain of the payment itself, not the pain of the unsolved problem. Claim, unverified in the source (no study named).\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"The pain of paying actually lights up the same brain regions as physical pain.\"\n\n## Related concepts\n- [[loss-aversion]]\n- [[simple-checkout]]\n- [[guarantee]]\n- [[free-trial]]\n- [[perceived-value]]\n- [[pain-of-the-problem]]\n"}, {"id": "pain-of-the-problem", "kind": "concept", "title": "Pain of the problem", "path": "begriffe/pain-of-the-problem.md", "text": "---\nconcept: pain-of-the-problem\nkind: psychological mechanism\n---\n# Pain of the problem\nKind: psychological mechanism\n\n## Definition\n\"Make them really feel the pain.\" (37); \"the problem is already painful enough\" (14); \"the pain of standing still\" (21).\n\nNote: Distinct from pain-of-paying.\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"go where the problem is already painful enough and where people need a solution for it\"\n- [[21-people-want-to-stop-losing]] – \"the pain of standing still is the most underused trigger in marketing\"\n- [[37-sell-the-problem-first]] – \"Make them really feel the pain.\"\n\n## Related concepts\n- [[problem-first-selling]]\n- [[relief-framing]]\n- [[cost-of-inaction]]\n- [[pain-of-paying]]\n"}, {"id": "perceived-value", "kind": "concept", "title": "Perceived value", "path": "begriffe/perceived-value.md", "text": "---\nconcept: perceived-value\nkind: psychological mechanism\n---\n# Perceived value\nKind: psychological mechanism\n\n## Definition\n\"the perceived value of experiencing this emotion has to be greater than the perceived costs to experience the emotion\" (11); price objection is \"about the value they perceive from it\" (22). Synonym: perceived quality (28).\n\nNote: Costs and terms must be disclosed so perceived costs are accurate (gharar).\n\n## Used in\n- [[11-you-sell-emotions-not-the-product]] – \"the perceived value of experiencing this emotion has to be greater than the perceived costs to experience the emotion\"\n- [[22-price-is-never-the-problem]] – \"it's about the value they perceive from it\"\n- [[26-use-the-power-of-contrast]] – \"Control the comparison, and you control how expensive or cheap your product feels.\"\n- [[28-same-wine-different-price-experience]] – \"to many people that experience is worth the extra money\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[contrast-effect]]\n- [[brand-perception]]\n- [[emotion-then-logic]]\n"}, {"id": "priming", "kind": "concept", "title": "Priming", "path": "begriffe/priming.md", "text": "---\nconcept: priming\nkind: psychological mechanism\n---\n# Priming\nKind: psychological mechanism\n\n## Definition\n\"Tiny hints in what people see, hear, or feel can shift their mood and decisions without them ever realizing it.\"\n\nNote: Only station 06 names it.\n\n## Used in\n- [[06-priming-makes-people-buy-without-a-word]] – \"The method is called priming, and it is the reason why brands exist.\"\n\n## Related concepts\n- [[covert-influence]]\n- [[own-idea-feeling]]\n- [[emotional-contagion]]\n"}, {"id": "problem-first-selling", "kind": "concept", "title": "Problem first selling", "path": "begriffe/problem-first-selling.md", "text": "---\nconcept: problem-first-selling\nkind: tactic\n---\n# Problem first selling\nKind: tactic\n\n## Definition\n\"So sell the problem first, and the product sells itself.\" (37); \"a problem well explained is a solution half sold\" (17).\n\n## Used in\n- [[17-a-problem-well-explained-is-a-solution-half-sold]] – \"a problem well explained is a solution half sold\"\n- [[37-sell-the-problem-first]] – \"So sell the problem first, and the product sells itself.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[relief-framing]]\n- [[customer-understanding]]\n"}, {"id": "product-vs-branding", "kind": "concept", "title": "Product vs branding", "path": "begriffe/product-vs-branding.md", "text": "---\nconcept: product-vs-branding\nkind: brand concept\n---\n# Product vs branding\nKind: brand concept\n\n## Definition\n\"The idea of finding the one winning product is an illusion sold by coaches.\" Synonym group: no winning product (04), best product loses (31), people like best (33), same product different perception (28).\n\nNote: Absolute claims, unverified.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"The idea of finding the one winning product is an illusion sold by coaches.\"\n- [[28-same-wine-different-price-experience]] – \"What creates this difference is not the product itself.\"\n- [[31-best-product-with-bad-branding-loses]] – \"the best product with bad branding will be outperformed by a worse product with good branding\"\n- [[33-people-buy-the-product-they-like-best]] – \"People don't buy the best product. They buy the product they like best.\"\n\n## Related concepts\n- [[brand-perception]]\n- [[halo-effect]]\n- [[emotion-selling]]\n- [[perceived-value]]\n- [[named-brands]]\n"}, {"id": "relief-framing", "kind": "concept", "title": "Relief framing", "path": "begriffe/relief-framing.md", "text": "---\nconcept: relief-framing\nkind: tactic\n---\n# Relief framing\nKind: tactic\n\n## Definition\n\"People don't buy solutions. They buy relief.\" (37); \"your offer will feel like relief, not like persuasion\" (14).\n\n## Used in\n- [[14-sell-water-to-the-thirsty]] – \"your offer will feel like relief, not like persuasion\"\n- [[37-sell-the-problem-first]] – \"People don't buy solutions. They buy relief.\"\n\n## Related concepts\n- [[pain-of-the-problem]]\n- [[problem-first-selling]]\n- [[existing-demand]]\n- [[own-idea-feeling]]\n"}, {"id": "simple-checkout", "kind": "concept", "title": "Simple checkout", "path": "begriffe/simple-checkout.md", "text": "---\nconcept: simple-checkout\nkind: tactic\n---\n# Simple checkout\nKind: tactic\n\n## Definition\n\"Use a simple checkout\" to reduce the pain of paying.\n\nNote: Only station 01 names it.\n\n## Used in\n- [[01-reduce-the-pain-of-paying]] – \"Use a simple checkout\"\n\n## Related concepts\n- [[pain-of-paying]]\n- [[guarantee]]\n- [[free-trial]]\n- [[traffic-vs-conversion-problem]]\n"}, {"id": "single-message-focus", "kind": "concept", "title": "Single message focus", "path": "begriffe/single-message-focus.md", "text": "---\nconcept: single-message-focus\nkind: tactic\n---\n# Single message focus\nKind: tactic\n\n## Definition\n\"It's one message, one offer, one clear action.\"\n\nNote: One reason to buy must not omit terms.\n\n## Used in\n- [[34-one-message-one-offer-one-action]] – \"It's one message, one offer, one clear action.\"\n\n## Related concepts\n- [[clarity]]\n- [[target-audience-focus]]\n"}, {"id": "social-media-content", "kind": "concept", "title": "Social media content", "path": "begriffe/social-media-content.md", "text": "---\nconcept: social-media-content\nkind: channel\n---\n# Social media content\nKind: channel\n\n## Definition\nShort-form content as channel: \"Most content fails for one reason.\" (25); \"scroll-stopping story\" (13).\n\nNote: All 37 sources are TikToks; this concept lists only statements that treat content as the object.\n\n## Used in\n- [[13-animations-that-turn-your-message-into-a-story]] – \"scroll-stopping story\"\n- [[24-attention-comes-from-clarity-not-frequency]] – \"But the solution is not that you have to post more.\"\n- [[25-emotional-content-is-remembered]] – \"Most content fails for one reason.\"\n- [[30-content-fails-in-the-first-seconds]] – \"If the brain doesn't immediately know what your content is about, it won't stay long enough to find out.\"\n\n## Related concepts\n- [[first-seconds-hook]]\n- [[attention]]\n- [[call-to-action-dm-comment]]\n- [[storytelling]]\n"}, {"id": "social-proof", "kind": "concept", "title": "Social proof", "path": "begriffe/social-proof.md", "text": "---\nconcept: social-proof\nkind: tactic\n---\n# Social proof\nKind: tactic\n\n## Definition\n\"testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand\"; data, statistics, studies (36).\n\nNote: Fabricated social proof is excluded (GRUNDSATZ: reviews, user numbers).\n\n## Used in\n- [[36-confirmation-bias-say-what-people-already-think]] – \"Then, use testimonials, case studies, and reviews that reinforce positive experiences others have had with your brand.\"\n\n## Related concepts\n- [[confirmation-bias]]\n- [[trust]]\n- [[emotion-then-logic]]\n"}, {"id": "storytelling", "kind": "concept", "title": "Storytelling", "path": "begriffe/storytelling.md", "text": "---\nconcept: storytelling\nkind: tactic\n---\n# Storytelling\nKind: tactic\n\n## Definition\n\"Most brands don't understand storytelling.\" Merged: story, scroll-stopping story, founder story.\n\nNote: 23 says tell the customer's story; 25 says people love founder stories; 04 says tell a story about the product.\n\n## Used in\n- [[04-there-is-no-winning-product]] – \"the story you tell about it\"\n- [[10-the-five-year-old-rule]] – \"DM me to turn your message into a story anyone can get and love.\"\n- [[13-animations-that-turn-your-message-into-a-story]] – \"we will help you turn your message into a scroll-stopping story\"\n- [[23-the-customer-is-the-hero-of-the-story]] – \"Most brands don't understand storytelling.\"\n- [[25-emotional-content-is-remembered]] – \"That's why people love founder stories, or stories with personal background.\"\n\n## Related concepts\n- [[customer-as-hero]]\n- [[memorability]]\n- [[zagarnik-effect]]\n- [[emotion-selling]]\n"}, {"id": "target-audience-focus", "kind": "concept", "title": "Target audience focus", "path": "begriffe/target-audience-focus.md", "text": "---\nconcept: target-audience-focus\nkind: tactic\n---\n# Target audience focus\nKind: tactic\n\n## Definition\n\"Focus on one group of people and make it your target audience.\"\n\n## Used in\n- [[19-sell-to-everyone-sell-to-no-one]] – \"Focus on one group of people and make it your target audience.\"\n- [[36-confirmation-bias-say-what-people-already-think]] – \"You have to get to know your customers and your target audience.\"\n\n## Related concepts\n- [[customer-understanding]]\n- [[single-message-focus]]\n- [[feeling-understood]]\n"}, {"id": "traffic-vs-conversion-problem", "kind": "concept", "title": "Traffic vs conversion problem", "path": "begriffe/traffic-vs-conversion-problem.md", "text": "---\nconcept: traffic-vs-conversion-problem\nkind: framework\n---\n# Traffic vs conversion problem\nKind: framework\n\n## Definition\n\"You either have a conversion problem or a traffic problem.\"\n\nNote: Metric terms used in the sources without numbers; no rates are given.\n\n## Used in\n- [[32-conversion-problem-or-traffic-problem]] – \"You either have a conversion problem or a traffic problem.\"\n\n## Related concepts\n- [[attention]]\n- [[simple-checkout]]\n- [[existing-demand]]\n"}, {"id": "trust", "kind": "concept", "title": "Trust", "path": "begriffe/trust.md", "text": "---\nconcept: trust\nkind: psychological mechanism\n---\n# Trust\nKind: psychological mechanism\n\n## Definition\n\"The more people have to think, the less they trust you.\" (27); \"This will build trust and increase your sales.\" (19); \"can I trust it\" (15).\n\n## Used in\n- [[15-three-questions-every-customer-asks]] – \"can I trust it\"\n- [[19-sell-to-everyone-sell-to-no-one]] – \"This will build trust and increase your sales.\"\n- [[27-the-more-people-think-the-less-they-trust]] – \"The more people have to think, the less they trust you.\"\n\n## Related concepts\n- [[certainty-over-risk]]\n- [[feeling-understood]]\n- [[social-proof]]\n- [[guarantee]]\n- [[clarity]]\n"}, {"id": "zagarnik-effect", "kind": "concept", "title": "Zagarnik effect", "path": "begriffe/zagarnik-effect.md", "text": "---\nconcept: zagarnik-effect\nkind: psychological mechanism\n---\n# Zagarnik effect\nKind: psychological mechanism\n\n## Definition\n\"It's called the Zagarnik effect. Your mind simply hates unfinished stories.\" (source spelling kept). Synonym used in the source: open a loop.\n\nNote: Withholding is conditional: no withheld terms (gharar).\n\n## Used in\n- [[08-open-a-loop-zagarnik-effect]] – \"It's called the Zagarnik effect. Your mind simply hates unfinished stories.\"\n\n## Related concepts\n- [[clarity]]\n- [[attention]]\n- [[memorability]]\n- [[storytelling]]\n"}], "links": [{"source": "01-reduce-the-pain-of-paying", "target": "05-study-what-works-particl"}, {"source": "01-reduce-the-pain-of-paying", "target": "11-you-sell-emotions-not-the-product"}, {"source": "01-reduce-the-pain-of-paying", "target": "15-three-questions-every-customer-asks"}, {"source": "01-reduce-the-pain-of-paying", "target": "21-people-want-to-stop-losing"}, {"source": "01-reduce-the-pain-of-paying", "target": "27-the-more-people-think-the-less-they-trust"}, {"source": "01-reduce-the-pain-of-paying", "target": "29-sell-the-instant-benefit"}, {"source": "01-reduce-the-pain-of-paying", "target": "32-conversion-problem-or-traffic-problem"}, {"source": "01-reduce-the-pain-of-paying", "target": "free-trial"}, {"source": "01-reduce-the-pain-of-paying", "target": "guarantee"}, {"source": "01-reduce-the-pain-of-paying", "target": "loss-aversion"}, {"source": "01-reduce-the-pain-of-paying", "target": "pain-of-paying"}, {"source": "01-reduce-the-pain-of-paying", "target": "simple-checkout"}, {"source": "02-sell-the-after-not-the-what", "target": "06-priming-makes-people-buy-without-a-word"}, {"source": "02-sell-the-after-not-the-what", "target": "11-you-sell-emotions-not-the-product"}, {"source": "02-sell-the-after-not-the-what", "target": "23-the-customer-is-the-hero-of-the-story"}, {"source": "02-sell-the-af const deg = {}; DATA.links.forEach(l => { deg[l.source] = (deg[l.source]||0)+1; deg[l.target] = (deg[l.target]||0)+1; });

const r = n => 4 + Math.sqrt(deg[n.id] || 0) * 2;

resize(); addEventListener("resize", resize);

  highlight(q ? new Set(DATA.nodes.filter(n => n.text.toLowerCase().includes(q)).map(n => n.id)) : null);
};
document.getElementById("showConcepts").onchange = e => {
  const on = e.target.checked;
  node.attr("display", d => on || d.kind === "station" ? null : "none");
  label.attr("display", d => on || d.kind === "station" ? null : "none");
  link.attr("display", l => on || (l.source.kind === "station" && l.target.kind === "station") ? null : "none");
};
</script>
</body>
</html>
