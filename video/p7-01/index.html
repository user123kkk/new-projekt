<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* VIDEO-REGELN.md: dark ground, white/grey outline icons, one focus dot in our accent colour,
         captions of 5 words or fewer, a new graphic every 3 s or less. No people, no music (GRUNDSATZ 8-10). */
      :root {
        --ground: #0b0f14;
        --ink: #ffffff;
        --dim: #4d5560;
        --accent: #f5b83d;
        --font-display: "Inter";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      .scene { position: absolute; inset: 0; }
      .art { position: absolute; left: 0; right: 0; top: 340px; height: 620px; display: flex; align-items: center; justify-content: center; }
      .art svg { overflow: visible; filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.28)); }
      .cap { position: absolute; left: 90px; right: 90px; top: 1040px; font-size: 84px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; text-align: center; }
      .cap em { font-style: normal; color: var(--accent); }
      .s { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .d { fill: none; stroke: var(--dim); stroke-width: 4; stroke-linecap: round; }
      .a { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: var(--accent); }
      .lbl { font: 700 44px var(--font-display); fill: var(--ink); text-anchor: middle; }
      .bg { fill: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">

      <!-- 1 (0.0-2.4): hook -->
      <div id="b1" class="scene clip" data-start="0" data-duration="2.4" data-track-index="0">
        <div class="art"><svg width="760" height="560" viewBox="0 0 760 560">
          <g class="b1-doc"><rect class="s bg" x="250" y="40" width="260" height="340" rx="10"/><path class="s" d="M290 110h180M290 160h180M290 210h120"/></g>
          <g class="b1-doc"><rect class="s bg" x="250" y="40" width="260" height="340" rx="10"/><path class="s" d="M290 110h180M290 160h180M290 210h120"/></g>
          <g class="b1-doc"><rect class="s bg" x="250" y="40" width="260" height="340" rx="10"/><path class="s" d="M290 110h180M290 160h180M290 210h120"/></g>
          <g class="b1-doc"><rect class="s bg" x="250" y="40" width="260" height="340" rx="10"/><path class="s" d="M290 110h180M290 160h180M290 210h120"/></g>
          <g class="b1-doc"><rect class="s bg" x="250" y="40" width="260" height="340" rx="10"/><path class="s" d="M290 110h180M290 160h180M290 210h120"/></g>
          <rect class="s bg" x="290" y="400" width="180" height="120" rx="8"/><path class="s" d="M290 405l90 62 90-62"/>
          <circle class="dot" cx="380" cy="467" r="13"/>
        </svg></div>
        <div class="cap">Ein Anschreiben<br/>für <em>alle</em>?</div>
      </div>

      <!-- 2 (2.4-5.2): only the firm name changes -->
      <div id="b2" class="scene clip" data-start="2.4" data-duration="2.8" data-track-index="0">
        <div class="art"><svg width="840" height="460" viewBox="0 0 840 460">
          <g transform="translate(20 100)"><rect class="s" width="230" height="300" rx="10"/><path class="s" d="M35 70h160M35 115h160M35 160h100"/></g>
          <g transform="translate(305 100)"><rect class="s" width="230" height="300" rx="10"/><path class="s" d="M35 70h160M35 115h160M35 160h100"/></g>
          <g transform="translate(590 100)"><rect class="s" width="230" height="300" rx="10"/><path class="s" d="M35 70h160M35 115h160M35 160h100"/></g>
          <rect class="s" x="95" y="10" width="80" height="62" rx="8"/><text class="lbl" x="135" y="56">A</text>
          <rect class="s" x="380" y="10" width="80" height="62" rx="8"/><text class="lbl" x="420" y="56">B</text>
          <rect class="s" x="665" y="10" width="80" height="62" rx="8"/><text class="lbl" x="705" y="56">C</text>
          <circle id="b2-dot" class="dot" cx="135" cy="-20" r="13"/>
        </svg></div>
        <div class="cap">Nur der <em>Firmenname</em> neu</div>
      </div>

      <!-- 3 (5.2-8.0): the ad tells you -->
      <div id="b3" class="scene clip" data-start="5.2" data-duration="2.8" data-track-index="0">
        <div class="art"><svg width="560" height="600" viewBox="0 0 560 600">
          <rect class="s" x="20" y="10" width="520" height="580" rx="14"/>
          <path class="s" d="M70 80h260"/><path class="d" d="M70 150h420M70 200h380"/>
          <path class="s b3-r" d="M70 270h400"/><path class="d" d="M70 320h340"/>
          <path class="s b3-r" d="M70 390h360"/><path class="d" d="M70 440h400"/><path class="s b3-r" d="M70 510h300"/>
          <circle class="dot" cx="370" cy="80" r="13"/>
        </svg></div>
        <div class="cap">Die <em>Anzeige</em> verrät es</div>
      </div>

      <!-- 4 (8.0-10.0): every ad is different -->
      <div id="b4" class="scene clip" data-start="8" data-duration="2" data-track-index="0">
        <div class="art"><svg width="900" height="500" viewBox="0 0 900 500">
          <g><rect class="s" x="10" y="60" width="260" height="380" rx="12"/><path class="d" d="M50 130h180M50 250h180M50 310h180"/><path class="a" d="M50 190h180"/></g>
          <g><rect class="s" x="630" y="60" width="260" height="380" rx="12"/><path class="d" d="M670 130h180M670 190h180M670 310h180"/><path class="a" d="M670 250h180"/></g>
          <g><rect class="s bg" x="360" y="110" width="180" height="260" rx="10"/><path class="s" d="M390 170h120M390 220h120M390 270h80"/></g>
          <circle class="dot" cx="450" cy="330" r="13"/>
        </svg></div>
        <div class="cap">Jede Anzeige <em>anders</em></div>
      </div>

      <!-- 5 (10.0-12.4): clear requirements -->
      <div id="b5" class="scene clip" data-start="10" data-duration="2.4" data-track-index="0">
        <div class="art"><svg width="560" height="600" viewBox="0 0 560 600">
          <rect class="s" x="20" y="10" width="520" height="580" rx="14"/>
          <path class="d" d="M70 80h260M70 150h420"/>
          <path class="s" d="M110 250h360M110 350h320M110 450h340"/>
          <path class="a b5-tick" d="M60 250l12 12 22-26M60 350l12 12 22-26M60 450l12 12 22-26"/>
          <circle id="b5-dot" class="dot" cx="500" cy="250" r="13"/>
        </svg></div>
        <div class="cap">Klare <em>Anforderungen</em></div>
      </div>

      <!-- 6 (12.4-14.8): one sentence per requirement -->
      <div id="b6" class="scene clip" data-start="12.4" data-duration="2.4" data-track-index="0">
        <div class="art"><svg width="900" height="560" viewBox="0 0 900 560">
          <rect class="s" x="10" y="40" width="340" height="480" rx="12"/><path class="d" d="M50 110h260M50 170h220M50 310h240M50 380h200"/><path class="s" d="M50 240h260"/>
          <rect class="s" x="550" y="40" width="340" height="480" rx="12"/><path class="d" d="M590 110h260M590 310h220M590 380h240"/><path class="s" d="M590 240h260"/>
          <path id="b6-link" class="a" d="M310 240H590" stroke-dasharray="280" stroke-dashoffset="280"/>
          <circle class="dot" cx="450" cy="240" r="13"/>
        </svg></div>
        <div class="cap">Pro <em>Anforderung</em> ein Satz</div>
      </div>

      <!-- 7 (14.8-17.6): with proof -->
      <div id="b7" class="scene clip" data-start="14.8" data-duration="2.8" data-track-index="0">
        <div class="art"><svg width="760" height="560" viewBox="0 0 760 560">
          <path class="s" d="M80 120h600"/>
          <rect class="s" x="110" y="260" width="220" height="130" rx="10"/><path class="s" d="M150 310h140M150 345h90"/>
          <rect class="s" x="430" y="260" width="220" height="130" rx="10"/><path class="s" d="M470 310h140M470 345h90"/>
          <path class="d" d="M220 130v130M540 130v130"/>
          <path id="b7-check" class="a" d="M320 470l40 40 90-100" stroke-width="7" stroke-dasharray="200" stroke-dashoffset="200"/>
          <circle class="dot" cx="450" cy="410" r="13"/>
        </svg></div>
        <div class="cap">Dazu ein <em>Beleg</em></div>
      </div>

      <!-- 8 (17.6-20.4): tailored instead of general -->
      <div id="b8" class="scene clip" data-start="17.6" data-duration="2.8" data-track-index="0">
        <div class="art"><svg width="760" height="520" viewBox="0 0 760 520">
          <rect class="d b8-doc" x="250" y="90" width="260" height="340" rx="10"/>
          <rect class="d b8-doc" x="250" y="90" width="260" height="340" rx="10"/>
          <rect class="d b8-doc" x="250" y="90" width="260" height="340" rx="10"/>
          <rect class="d b8-doc" x="250" y="90" width="260" height="340" rx="10"/>
          <g id="b8-one"><rect class="s bg" x="250" y="90" width="260" height="340" rx="10"/>
            <path class="a" d="M290 160h180"/><path class="s" d="M290 215h180"/><path class="a" d="M290 270h140"/>
            <circle class="dot" cx="455" cy="160" r="13"/></g>
        </svg></div>
        <div class="cap"><em>Passgenau</em> statt allgemein</div>
      </div>

      <!-- 9 (20.4-22.8): the ad sets the letter -->
      <div id="b9" class="scene clip" data-start="20.4" data-duration="2.4" data-track-index="0">
        <div class="art"><svg width="820" height="420" viewBox="0 0 820 420">
          <rect class="s" x="20" y="40" width="250" height="340" rx="10"/><path class="s" d="M60 100h170M60 150h170M60 200h110"/>
          <rect class="s" x="550" y="40" width="250" height="340" rx="10"/><path class="s" d="M590 100h170M590 150h170M590 200h110"/>
          <path class="s" d="M310 210h200M480 185l30 25-30 25"/>
          <circle id="b9-dot" class="dot" cx="310" cy="210" r="13"/>
        </svg></div>
        <div class="cap">Anzeige gibt <em>Brief</em> vor</div>
      </div>

      <!-- 10 (22.8-25.6): end card 1, the tool is not built (GRUNDSATZ rule 1) -->
      <div id="b10" class="scene clip" data-start="22.8" data-duration="2.8" data-track-index="0">
        <div class="art"><svg width="820" height="420" viewBox="0 0 820 420">
          <rect class="s" x="20" y="40" width="250" height="340" rx="10"/><path class="s" d="M60 100h170M60 150h170M60 200h110"/>
          <rect class="s" x="550" y="40" width="250" height="340" rx="10" stroke-dasharray="18 14"/><path class="d" d="M590 100h170M590 150h170M590 200h110"/>
          <path class="s" d="M310 210h200M480 185l30 25-30 25"/>
          <circle class="dot" cx="410" cy="210" r="13"/>
        </svg></div>
        <div class="cap">Tool: <em>noch nicht</em> fertig</div>
      </div>

      <!-- 11 (25.6-28.0): end card 2 -->
      <div id="b11" class="scene clip" data-start="25.6" data-duration="2.4" data-track-index="0">
        <div class="art"><svg width="640" height="420" viewBox="0 0 640 420">
          <rect class="s" x="40" y="110" width="280" height="190" rx="10"/><path class="s" d="M40 115l140 95 140-95"/>
          <path class="a" d="M240 330l30 30 60-70"/>
          <g transform="translate(400 150)"><rect class="s" x="0" y="20" width="120" height="70" rx="35"/><rect class="s" x="80" y="20" width="120" height="70" rx="35"/></g>
          <circle class="dot" cx="540" cy="205" r="13"/>
        </svg></div>
        <div class="cap"><em>Vormerken</em> kostenlos.<br/>Link im Profil</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const out = "power3.out";
      const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: out }, t);
      // Frame 0 already shows the hook (thumbnail): no fade-in on beat 1.
      tl.fromTo(".b1-doc", { x: 0, rotation: 0 }, { x: (i) => (i - 2) * 70, rotation: (i) => (i - 2) * 6, transformOrigin: "50% 100%", duration: 1.2, ease: out }, 0.1);
      pop("#b2 .cap", 2.4); tl.to("#b2-dot", { keyframes: [{ attr: { cx: 420 }, duration: 0.6 }, { attr: { cx: 705 }, duration: 0.6 }], ease: "power2.inOut" }, 3.0);
      pop("#b3 .cap", 5.2); tl.fromTo(".b3-r", { opacity: 0.2 }, { opacity: 1, duration: 0.4, stagger: 0.5 }, 5.6);
      pop("#b4 .cap", 8.0); tl.fromTo("#b4 .a", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.3 }, 8.3);
      pop("#b5 .cap", 10.0); tl.fromTo(".b5-tick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.4); tl.to("#b5-dot", { attr: { cy: 450 }, duration: 1.4, ease: "power1.inOut" }, 10.6);
      pop("#b6 .cap", 12.4); tl.to("#b6-link", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 12.7);
      pop("#b7 .cap", 14.8); tl.to("#b7-check", { strokeDashoffset: 0, duration: 0.7, ease: out }, 15.8);
      pop("#b8 .cap", 17.6); tl.fromTo(".b8-doc", { x: (i) => (i - 1.5) * 150, opacity: 1 }, { x: 0, opacity: 0, duration: 1.1, ease: "power2.inOut" }, 17.7); tl.fromTo("#b8-one", { scale: 0.85, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.6, ease: out }, 18.6);
      pop("#b9 .cap", 20.4); tl.to("#b9-dot", { attr: { cx: 505 }, duration: 1.2, ease: "power2.inOut" }, 20.8);
      pop("#b10 .cap", 22.8);
      pop("#b11 .cap", 25.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
